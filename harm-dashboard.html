<!doctype html><html lang="ar" dir="rtl"><head>
<meta name="description" content="${LuxHarm.esc(r.location_text||&#x27;&#x27;)} ${r.latitude?`· ${r.latitude}, ${r.longitude}`:&#x27;&#x27;}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة معالجة البلاغات · LuxDot</title><link rel="stylesheet" href="styles.css?v=4328"><style>body{background:#020604;color:#edf6ef}.w{max-width:1180px;margin:auto;padding:60px 20px}.box,.report{border:1px solid #294b33;border-radius:17px;padding:16px;background:#050b07;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}input,textarea,select,button{box-sizing:border-box;border:1px solid #294b33;border-radius:10px;background:#06100a;color:#edf6ef;padding:9px}textarea{width:100%;min-height:90px}.actions{display:flex;gap:7px;flex-wrap:wrap}.imggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.imggrid img{width:100%;height:150px;object-fit:cover;border-radius:10px}.muted{color:#91a296;font-size:12px}.setup{border-color:#735f27;background:#111008}</style></head><body><main class="w"><p><a href="removing-harm-way.html">← المشروع</a></p><h1>لوحة معالجة البلاغات</h1><section id="setup" class="box setup" hidden>يلزم توصيل Supabase أولًا في supabase-config.js وتشغيل ملف SQL.</section><section id="login" class="box"><h2>دخول الإدارة</h2><div class="grid"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"></div><p><button id="signIn">دخول</button> <button id="signOut">خروج</button></p><div id="authStatus"></div></section><section id="reports"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=41844"></script><script src="harm-app.js?v=41844"></script><script>
const sb=LuxHarm.sb, statuses=['NEW','VERIFIED','SENT_TO_MUNICIPALITY','IN_PROGRESS','FIXED','CLOSED','REJECTED'];if(!LuxHarm.configured)setup.hidden=false;signIn.onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});authStatus.textContent=error?error.message:'تم الدخول';if(!error)load()};signOut.onclick=async()=>{await sb.auth.signOut();reports.innerHTML='';authStatus.textContent='تم الخروج'};
async function privateUrl(path){if(!path)return null;const {data,error}=await sb.storage.from('harm-private').createSignedUrl(path,600);return error?null:data.signedUrl}
async function publishImage(img, report){if(!img.private_path)return;const dl=await sb.storage.from('harm-private').download(img.private_path);if(dl.error)throw dl.error;const ext=(img.private_path.split('.').pop()||'jpg');const publicPath=`published/${report.id}/${img.phase}-${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from('harm-public').upload(publicPath,dl.data,{upsert:false});if(up.error)throw up.error;const u=await sb.from('harm_report_images').update({public_path:publicPath,published:true}).eq('id',img.id);if(u.error)throw u.error}
async function load(){reports.innerHTML='<p>تحميل…</p>';const {data,error}=await sb.from('harm_reports').select('*').order('created_at',{ascending:false});if(error){reports.textContent=error.message;return}reports.innerHTML='';for(const r of data){const {data:imgs=[]}=await sb.from('harm_report_images').select('*').eq('report_id',r.id);const card=document.createElement('article');card.className='report';const imageHtml=[];for(const im of imgs){const u=await privateUrl(im.private_path);imageHtml.push(`<div>${u?`<img src="${u}">`:''}<small>${im.phase} · ${im.published?'PUBLIC':'PRIVATE'}</small><button data-pubimg="${im.id}">نشر نسخة عامة</button></div>`)}card.innerHTML=`<div class="actions"><b>${LuxHarm.esc(r.public_code)}</b><span>${new Date(r.created_at).toLocaleString()}</span></div><h2>${LuxHarm.esc(r.title)}</h2><p>${LuxHarm.esc(r.description)}</p><p class="muted">${LuxHarm.esc(r.location_text||'')} ${r.latitude?`· ${r.latitude}, ${r.longitude}`:''}</p><div class="imggrid">${imageHtml.join('')}</div><div class="grid"><label>الحالة<select data-status>${statuses.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></label><label>النشر العام<select data-published><option value="false" ${!r.published?'selected':''}>خاص</option><option value="true" ${r.published?'selected':''}>منشور</option></select></label></div><p>ملخص عام</p><textarea data-summary>${LuxHarm.esc(r.public_summary||'')}</textarea><p>ملخص الإصلاح</p><textarea data-resolution>${LuxHarm.esc(r.resolution_summary||'')}</textarea><div class="actions"><button data-save>حفظ الحالة</button><label>صورة بعد الإصلاح <input data-after type="file" accept="image/jpeg,image/png,image/webp"></label></div>`;reports.append(card);card.querySelector('[data-save]').onclick=async()=>{const upd={status:card.querySelector('[data-status]').value,published:card.querySelector('[data-published]').value==='true',public_summary:card.querySelector('[data-summary]').value,resolution_summary:card.querySelector('[data-resolution]').value};if(upd.status==='FIXED')upd.fixed_at=new Date().toISOString();const {error}=await sb.from('harm_reports').update(upd).eq('id',r.id);if(error)alert(error.message);else{await sb.from('harm_report_events').insert({report_id:r.id,event_type:'STATUS_UPDATE',note:`${upd.status} / published=${upd.published}`});alert('تم الحفظ')}};for(const b of card.querySelectorAll('[data-pubimg]'))b.onclick=async()=>{const im=imgs.find(x=>x.id===b.dataset.pubimg);try{await publishImage(im,r);alert('تم نشر نسخة عامة من الصورة');load()}catch(e){alert(e.message)}};card.querySelector('[data-after]').onchange=async e=>{const f=e.target.files[0];if(!f)return;const path=`incoming/${r.id}/${crypto.randomUUID()}.${(f.name.split('.').pop()||'jpg')}`;const up=await sb.storage.from('harm-private').upload(path,f,{contentType:f.type});if(up.error)return alert(up.error.message);const ins=await sb.from('harm_report_images').insert({report_id:r.id,phase:'after',private_path:path,published:false});if(ins.error)alert(ins.error.message);else load()}}}
if(sb)sb.auth.getSession().then(({data})=>{if(data.session)load()});
</script><script src="site-shell.js?v=41843"></script></body></html>
