<!doctype html><html lang="ar" dir="rtl"><head><script src="language-core.js?v=43101"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="styles.css?v=430" rel="stylesheet"><style>body{background:#020403;color:#edf7ef;margin:0;font-family:Arial,sans-serif}.d{max-width:1080px;margin:auto;padding:34px 22px 80px}.hero{border:1px solid #23402d;border-radius:24px;padding:28px;background:linear-gradient(145deg,#07120b,#020403)}.tag{font-size:12px;color:#d2b15b;letter-spacing:.08em}.hero h1{font-size:clamp(30px,5vw,58px);margin:.2em 0}.lead{font-size:18px;line-height:1.9;color:#d8e8dd}.heroimg{width:100%;max-height:560px;object-fit:cover;border-radius:18px;margin-top:20px;border:1px solid #2b4934;background:#08110b}.cap{font-size:12px;color:#9db1a3;line-height:1.6;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px;margin:22px 0}.c,.src a{display:block;border:1px solid #203a29;border-radius:18px;padding:18px;background:#06100a}.c h3{color:#d2b15b;margin-top:0}.c p{line-height:1.75}.timeline{border-inline-start:2px solid #315c3d;padding-inline-start:20px}.timeline p{margin:0 0 16px;line-height:1.75}.src{display:grid;gap:10px}.src a{text-decoration:none;color:#edf7ef}.src small{display:block;color:#9db1a3;margin-top:6px;line-height:1.5}.question{border-inline-start:3px solid #d2b15b;padding:16px 20px;background:#09140d;line-height:1.8}.back a{color:#d2b15b;text-decoration:none}.symbolcart{display:inline-flex;gap:3px;align-items:center;border:1px solid #3f6f4c;border-radius:999px;padding:5px 10px;margin-bottom:8px;font-size:20px}.hero.visual-only{min-height:240px;display:flex;flex-direction:column;justify-content:center}.visual-mark{font-size:70px;letter-spacing:-10px;text-align:center;margin:24px 0;color:#d2b15b}html[dir=rtl] body{font-family:'Noto Kufi Arabic',Arial,sans-serif}html[lang='ar'] body{font-family:'Noto Kufi Arabic',Arial,sans-serif!important}html[lang='en'] body,html[lang='nl'] body,html[lang='jv'] body{font-family:Arial,Helvetica,sans-serif!important}</style><link rel="stylesheet" href="luxdot-ui-lock.css?v=4385"><link rel="stylesheet" href="luxdot-global-language.css?v=43101"></head><body><header class="top"><div class="wrap topin"><a class="logo" href="home.html">LuxDot</a><nav class="nav"><a href="memory.html" id="memlink">الذاكرة</a><a href="research.html" id="reslink">الأبحاث</a></nav></div></header><main class="d"><section class="hero"><div class="symbolcart">☮ ✝ ☪ ✡</div><span class="tag">LUXDOT · LIVING MEMORY</span><h1 id="title"></h1><p class="lead" id="lead"></p><div class="visual-mark">☮ ✝ ☪ ✡</div><p class="cap">A non-sectarian LuxDot remembrance visual: freedom of religion, belief and conscience.</p></section><section class="grid" id="cards"></section><h2 id="why"></h2><p class="question" id="question"></p><h2>Sources / المصادر</h2><div class="src"><a target="_blank" rel="noopener" href="https://www.un.org/en/observances/religious-based-violence-victims-day"><b>United Nations — 22 August</b></a><a target="_blank" rel="noopener" href="https://www.un.org/en/about-us/universal-declaration-of-human-rights"><b>Universal Declaration of Human Rights — Article 18</b></a></div><p class="back"><a id="back" href="memory.html">← Memory</a></p></main><script src="site-shell.js?v=4385"></script><script>const D={"ar": {"title": "22 أغسطس — ضحايا العنف بسبب الدين أو المعتقد", "place": "ذاكرة عالمية", "lead": "اعتمدت الجمعية العامة للأمم المتحدة 22 أغسطس يوماً دولياً لإحياء ذكرى ضحايا أعمال العنف القائمة على أساس الدين أو المعتقد. تنطلق العقدة من حرية الضمير: للإنسان حق أن يؤمن أو يغيّر معتقده أو لا يتبنى معتقداً، من دون أن يصبح ذلك مبرراً لاستهدافه.", "cards": [["لماذا يوم مستقل؟", "لأن ضحايا هذا النوع من العنف قد يُستهدفون بسبب هوية مفترضة أو حقيقية، وقد تمتد الهجمات إلى دور العبادة والمقابر والمجتمعات المحلية."], ["المادة 18", "الإعلان العالمي لحقوق الإنسان يحمي حرية الفكر والوجدان والدين، بما في ذلك حرية تغيير الدين أو المعتقد وإظهاره منفرداً أو مع جماعة."], ["قاعدة مهمة", "الأمم المتحدة تؤكد أن الإرهاب والتطرف العنيف لا ينبغي ربطهما بدين أو جنسية أو حضارة أو جماعة عرقية."], ["تقاطع 21 و22 أغسطس", "يأتي يوم 22 أغسطس مباشرة بعد يوم ضحايا الإرهاب. هذا التجاور يسمح بقراءة الضحية أولاً، لا هوية الجاني أو الضحية كأداة للتعميم."]], "why": "لماذا تحفظها LuxDot؟", "q": "كيف نحفظ ذاكرة الضحايا بطريقة تميز بين الدليل، السياق، المسؤولية، والاختلاف في الروايات؟"}, "en": {"title": "22 August — victims of violence based on religion or belief", "place": "Global memory", "lead": "The UN General Assembly designated 22 August as the International Day Commemorating the Victims of Acts of Violence Based on Religion or Belief. The node begins with freedom of conscience: belief, change of belief and non-belief must never become grounds for targeting a person.", "cards": [["Why a separate day?", "Victims may be targeted because of real or perceived identity, and violence can extend to houses of worship, cemeteries and whole communities."], ["Article 18", "The Universal Declaration of Human Rights protects freedom of thought, conscience and religion, including the freedom to change religion or belief and to manifest it alone or with others."], ["A key boundary", "The UN stresses that terrorism and violent extremism should not be associated with any religion, nationality, civilization or ethnic group."], ["21–22 August", "The observance follows immediately after the day for victims of terrorism, encouraging a victim-centred reading rather than collective blame."]], "why": "Why LuxDot preserves it", "q": "How can victims’ memory be preserved while distinguishing evidence, context, responsibility and competing narratives?"}, "nl": {"title": "22 augustus — slachtoffers van geweld op grond van religie of overtuiging", "place": "Wereldwijde herinnering", "lead": "De VN heeft 22 augustus aangewezen als internationale herdenkingsdag voor slachtoffers van geweld op grond van religie of overtuiging. De kern is gewetensvrijheid: geloof, verandering van geloof en niet-geloven mogen nooit een reden voor vervolging zijn.", "cards": [["Waarom een aparte dag?", "Mensen kunnen worden aangevallen vanwege een echte of vermeende identiteit; geweld kan ook gebedshuizen, begraafplaatsen en hele gemeenschappen treffen."], ["Artikel 18", "De Universele Verklaring beschermt vrijheid van gedachte, geweten en godsdienst, inclusief het veranderen en individueel of gezamenlijk uiten van geloof of overtuiging."], ["Een belangrijke grens", "De VN benadrukt dat terrorisme en gewelddadig extremisme niet aan een religie, nationaliteit, beschaving of etnische groep mogen worden gekoppeld."], ["21–22 augustus", "Deze dag volgt direct op de dag voor slachtoffers van terrorisme en stimuleert een slachtoffergerichte herinnering in plaats van collectieve schuld."]], "why": "Waarom LuxDot dit bewaart", "q": "Hoe bewaren we de herinnering aan slachtoffers en onderscheiden we tegelijk bewijs, context, verantwoordelijkheid en concurrerende verhalen?"}, "jv": {"title": "22 Agustus — korban kekerasan adhedhasar agama utawa kapercayan", "place": "Memori global", "lead": "PBB netepake 22 Agustus minangka dina internasional kanggo ngelingi korban tumindak kekerasan adhedhasar agama utawa kapercayan. Intine yaiku kebebasan nurani: percaya, ngganti kapercayan utawa ora percaya ora kena dadi alasan kanggo nyerang wong.", "cards": [["Napa ana dina khusus?", "Korban bisa diserang amarga identitas nyata utawa sing dianggep, lan kekerasan bisa nyerang papan ibadah, kuburan lan komunitas."], ["Artikel 18", "Deklarasi Universal HAM nglindhungi kebebasan pikiran, nurani lan agama, kalebu hak ngganti lan nindakake kapercayan dhewe utawa bebarengan."], ["Wates penting", "PBB negesake manawa terorisme lan ekstremisme kasar ora kena digandhengake karo agama, bangsa, peradaban utawa etnis tartamtu."], ["21–22 Agustus", "Dina iki langsung sawise dina korban terorisme, supaya memori fokus marang korban lan ora nggawe salah kolektif."]], "why": "Napa LuxDot nyimpen iki?", "q": "Kepiye njaga memori korban kanthi mbedakake bukti, konteks, tanggung jawab lan narasi sing beda?"}, "he": {"title": "22 באוגוסט — קורבנות אלימות על בסיס דת או אמונה", "place": "זיכרון עולמי", "lead": "העצרת הכללית של האו״ם קבעה את 22 באוגוסט כיום בינלאומי להנצחת קורבנות מעשי אלימות על בסיס דת או אמונה. נקודת המוצא היא חופש המצפון: אמונה, שינוי אמונה או אי־אמונה אינם יכולים להצדיק פגיעה באדם.", "cards": [["למה יום נפרד?", "קורבנות עלולים להיות מותקפים בשל זהות אמיתית או מיוחסת, והאלימות יכולה לפגוע גם בבתי תפילה, בתי קברות וקהילות שלמות."], ["סעיף 18", "ההכרזה לכל באי עולם בדבר זכויות האדם מגינה על חופש המחשבה, המצפון והדת, לרבות שינוי אמונה וביטויה ביחיד או בציבור."], ["גבול חשוב", "האו״ם מדגיש שאין לקשור טרור וקיצוניות אלימה לדת, לאום, ציוויליזציה או קבוצה אתנית כלשהם."], ["21–22 באוגוסט", "היום מגיע מיד אחרי יום קורבנות הטרור ומעודד זיכרון שמעמיד את הקורבן במרכז במקום אשמה קולקטיבית."]], "why": "למה LuxDot שומרת את הזיכרון?", "q": "כיצד משמרים את זיכרון הקורבנות תוך הבחנה בין ראיות, הקשר, אחריות ונרטיבים מתחרים?"}};function lang(){let q=new URLSearchParams(location.search).get('lang')||localStorage.getItem('luxdot.lang')||document.documentElement.lang||'ar';return D[q]?q:'en'}function render(){let l=lang(),x=D[l];document.documentElement.lang=l;document.documentElement.dir=(l==='ar'||l==='he')?'rtl':'ltr';title.textContent=x.title;lead.textContent=x.lead;why.textContent=x.why;question.textContent=x.q;cards.innerHTML=x.cards.map(c=>`<article class="c"><h3>${c[0]}</h3><p>${c[1]}</p></article>`).join('');let s='?lang='+l;memlink.href='memory.html'+s;reslink.href='research.html'+s;back.href='memory.html'+s;}render();</script></body></html>
