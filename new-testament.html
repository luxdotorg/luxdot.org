<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head><body>
<header class="top"><div class="wrap topin"><a class="logo" href="home.html">LUX<b>•</b>DOT</a>
<nav class="nav"><a href="home.html" data-t="home"></a><span data-t="discover"></span><a href="library.html" data-t="library"></a><span data-t="living"></span><span data-t="projects"></span><span data-t="participate"></span><button class="lang" data-lang>ع</button></nav></div></header>

<main class="sacred-page">
<section class="sacred-card">
<div class="sacred-kicker" data-t="selectedPassage"></div>
<h1 data-t="ntTitle"></h1>
<p class="sacred-lead" data-t="ntLead"></p>

<div class="sacred-kicker" data-t="john2031"></div>
<div class="greek" lang="grc">ταῦτα δὲ γέγραπται ἵνα πιστεύσητε ὅτι Ἰησοῦς ἐστιν ὁ Χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.</div>

<div class="sacred-translation">But these are written, that ye may believe that Jesus is the Christ, the Son of God; and that believing ye may have life in his name.</div>

<div class="sacred-kicker" style="margin-top:22px" data-t="writtenLife"></div>
<div class="intro-note" data-t="ntAudioNote"></div>

<div class="intro-player">
<button id="listen" type="button">▶ <span data-t="listenPassage"></span></button>
<button id="stop" type="button" data-t="stopIntro"></button>
</div>
<div class="audio-msg" id="msg"></div>

<audio id="ntAudio" preload="metadata" src="https://archive.org/download/the_gospel_according_to_saint_john_asv_ss_librivox/john_20_asv_64kb.mp3"></audio>
</section>
</main>

<script>
document.addEventListener("DOMContentLoaded",()=>{
 const audio=document.getElementById("ntAudio");
 const listen=document.getElementById("listen");
 const stop=document.getElementById("stop");
 const msg=document.getElementById("msg");
 let started=false;

 function start(){
   const go=()=>{
     // John 20:31 is at the end of the chapter. Start near the final verses.
     if(Number.isFinite(audio.duration) && audio.duration>35){
       audio.currentTime=Math.max(0,audio.duration-32);
     }
     const p=audio.play();
     if(p&&p.then){
       p.then(()=>{started=true;msg.textContent=""})
        .catch(()=>{msg.textContent=t("autoplayBlocked")});
     }
   };
   if(audio.readyState>=1) go();
   else audio.addEventListener("loadedmetadata",go,{once:true});
 }

 listen.addEventListener("click",start);
 stop.addEventListener("click",()=>{audio.pause();msg.textContent=""});
 audio.addEventListener("ended",()=>{started=false;});
 setTimeout(start,5000);
});
</script>
</body></html>
