<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuxDot</title><meta name="description" content="LuxDot — A Common Language for a Diverse Humanity">
<style>:root{--g:0,255,102}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;color:#fff}.scene{position:fixed;inset:0;background:radial-gradient(circle at center,rgba(4,18,10,.5),rgba(0,0,0,.9) 55%,#000 82%)}#matrix{position:absolute;inset:0;width:100%;height:100%;opacity:.62}.vig{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 0,rgba(0,0,0,.25) 38%,rgba(0,0,0,.83) 85%);pointer-events:none}.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.inner{max-width:760px}.logo{font-size:clamp(42px,6.5vw,86px);letter-spacing:.08em;margin:0}.dot{color:rgb(var(--g))}.sub{margin-top:13px;font-size:clamp(13px,1.6vw,20px);color:rgba(230,255,238,.82);letter-spacing:.04em}.lang-title{margin-top:30px;font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:rgba(195,255,214,.55)}.langs{display:flex;justify-content:center;gap:10px;margin-top:13px;flex-wrap:wrap}.lang{min-width:145px;border:1px solid rgba(160,255,191,.35);background:rgba(0,20,8,.42);color:#eafff0;border-radius:999px;padding:12px 18px;cursor:pointer;letter-spacing:.06em}.lang:hover,.lang:focus-visible{background:rgba(0,45,20,.6);border-color:rgba(210,255,224,.8);outline:none}.enter{display:none;margin-top:18px;color:#eafff0;text-decoration:none;border:1px solid rgba(160,255,191,.35);border-radius:999px;padding:11px 19px}.enter.on{display:inline-flex}</style></head><body>
<div class="scene"><canvas id="matrix"></canvas><div class="vig"></div><main class="center"><div class="inner"><h1 class="logo">LUX<span class="dot">•</span>DOT</h1><div class="sub" id="sub">The First Point of Light · Where Understanding Begins</div><div class="lang-title" id="choose">Choose your language · اختر لغتك</div><div class="langs"><button class="lang" data-pick="ar">العربية</button><button class="lang" data-pick="en">English</button></div><a class="enter" id="enter" href="home.html">Enter LuxDot</a></div></main></div>
<script>const c=document.getElementById('matrix'),x=c.getContext('2d');let cols,drops,fs=15;function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);fs=innerWidth<600?13:15;cols=Math.ceil(innerWidth/fs);drops=Array.from({length:cols},()=>Math.random()*innerHeight/fs)}const glyph='0101010101LUXDOTنورعقلفهممعنى∞ΣΔλ';function draw(){x.fillStyle='rgba(0,0,0,.09)';x.fillRect(0,0,innerWidth,innerHeight);x.fillStyle='rgba(115,255,160,.72)';x.font=fs+'px monospace';for(let i=0;i<drops.length;i++){const ch=glyph[Math.floor(Math.random()*glyph.length)];x.fillText(ch,i*fs,drops[i]*fs);if(drops[i]*fs>innerHeight&&Math.random()>.975)drops[i]=0;drops[i]+=.58}requestAnimationFrame(draw)}size();addEventListener('resize',size);draw();const enter=document.getElementById('enter'),sub=document.getElementById('sub'),choose=document.getElementById('choose');function select(lang){localStorage.setItem('luxdot.lang',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';sub.textContent=lang==='ar'?'أول نقطة ضوء · حيث يبدأ الفهم':'The First Point of Light · Where Understanding Begins';choose.textContent=lang==='ar'?'تم اختيار العربية':'English selected';enter.textContent=lang==='ar'?'الدخول إلى لوكسدوت ←':'Enter LuxDot →';enter.classList.add('on')}document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.pick)));const saved=localStorage.getItem('luxdot.lang');if(saved==='ar'||saved==='en')select(saved);</script></body></html>
