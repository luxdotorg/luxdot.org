<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000"><title>LuxDot — Signal</title>
<link rel="stylesheet" href="intro.css?v=287">
<style id="luxdot-fallback">html,body{margin:0;min-height:100%;background:#020403;color:#eef8f1}body{font-family:Arial,Helvetica,sans-serif}a{color:inherit}#matrix{position:fixed;inset:0;width:100%;height:100%;background:#000}.top{background:#050806;color:#eef8f1}</style><script src="analytics-config.js"></script><script src="analytics.js" defer></script></head>
<body><noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#dfffea;font:14px Arial;z-index:9999">LuxDot يحتاج JavaScript لتشغيل الإشارة</div></noscript>
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="noise" aria-hidden="true"></div><div class="scan" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div>
<div id="signals" class="signals" aria-hidden="true"></div>
<div class="sig-status" aria-hidden="true"><span id="statusA"></span><span id="statusB"></span></div>
<main class="gate" id="gate">
  <div class="mark"><span></span></div>
  <div class="eyebrow" id="eyebrow"></div>
  <h1>LUX<span>•</span>DOT</h1>
  <p id="sub"></p>
  <div class="langpick" id="langpick" aria-label="Language">
    <button data-lang="ar">العربية</button><button data-lang="en">English</button><button data-lang="nl">Nederlands</button><button data-lang="jv">Basa Jawa</button><button data-lang="he">עברית</button>
  </div>
  <button id="enter" class="enter" type="button"></button>
  <div class="micro" id="micro"></div><div id="burst" class="burst" aria-hidden="true"></div>
</main>
<button class="sound" id="sound" aria-label="Toggle ambient signal" title="Toggle ambient signal">◉</button>
<script src="intro.js?v=287"></script>
</body></html>
