<!DOCTYPE html>

<html dir="ltr" lang="en">
<head><script src="language-core.js?v=4399"></script>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="#000000" name="theme-color"/><title>LUXDOT — Signal</title>
<link href="intro.css?v=4385" rel="stylesheet"/>
<style id="luxdot-fallback">html,body{margin:0;min-height:100%;background:#020403;color:#eef8f1}body{font-family:Arial,Helvetica,sans-serif}a{color:inherit}#matrix{position:fixed;inset:0;width:100%;height:100%;background:#000}.top{background:#050806;color:#eef8f1}</style><link rel="stylesheet" href="styles.css?v=4344"><link rel="stylesheet" href="luxdot-ui-lock.css?v=4385"><style>.pilot-note{margin-top:14px;max-width:620px;text-align:center;font-size:12px;line-height:1.6;letter-spacing:.035em;color:rgba(230,245,235,.72);border:1px solid rgba(150,220,175,.18);background:rgba(2,12,7,.38);border-radius:999px;padding:8px 14px;backdrop-filter:blur(8px)}@media(max-width:620px){.pilot-note{border-radius:18px;margin-inline:16px}}</style><link rel="stylesheet" href="luxdot-global-language.css?v=4399"><link rel="stylesheet" href="luxdot-radio.css?v=43105"></head>
<body><noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#dfffea;font:14px Arial;z-index:9999">LUXDOT requires JavaScript to receive the signal</div></noscript>
<canvas aria-hidden="true" id="matrix"></canvas>
<div aria-hidden="true" class="noise"></div><div aria-hidden="true" class="scan"></div><div aria-hidden="true" class="vignette"></div>
<div aria-hidden="true" class="belief-stars" id="beliefStars"></div><div aria-hidden="true" class="signals" id="signals"></div>
<div aria-hidden="true" class="sig-status"><span id="statusA"></span><span id="statusB"></span></div>
<main class="gate" id="gate">
<div class="mark"><span></span></div>
<div class="eyebrow" id="eyebrow"></div>
<h1>LUX<span>•</span>DOT</h1>
<p id="sub"></p>
<div aria-label="Language" class="langpick" id="langpick">
<button data-lang="ar">العربية</button><button data-lang="en">English</button><button data-lang="nl">Nederlands</button><button data-lang="he">עברית</button>
</div>
<button class="enter" id="enter" type="button"></button>
<div class="micro" id="micro"></div><div class="pilot-note" id="pilotNote" aria-live="polite"></div><div aria-hidden="true" class="burst" id="burst"></div>
</main>
<button aria-label="Toggle ambient signal" class="sound" id="sound" title="Toggle ambient signal">◉</button>
<script src="intro.js?v=4385"></script><script defer src="luxdot-radio.js?v=43105"></script></body></html>
