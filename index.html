<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000"><title>LuxDot — Signal</title>
<link rel="stylesheet" href="intro.css">
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="noise" aria-hidden="true"></div><div class="scan" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div>
<div id="signals" class="signals" aria-hidden="true"></div>
<div class="sig-status" aria-hidden="true"><span id="statusA"></span><span id="statusB"></span></div>
<main class="gate" id="gate">
  <div class="mark"><span></span></div>
  <div class="eyebrow" id="eyebrow"></div>
  <h1>LUX<span>•</span>DOT</h1>
  <p id="sub"></p>
  <div class="langpick" id="langpick" aria-label="Language">
    <button data-lang="ar">العربية</button><button data-lang="en">English</button><button data-lang="nl">Nederlands</button>
  </div>
  <button id="enter" class="enter" type="button"></button>
  <div class="micro" id="micro"></div><div id="burst" class="burst" aria-hidden="true"></div>
</main>
<button class="sound" id="sound" aria-label="Toggle ambient signal" title="Toggle ambient signal">◉</button>
<script src="intro.js"></script>
</body></html>
