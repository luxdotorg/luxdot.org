<!doctype html><html lang="en" dir="ltr"><head><script src="language-core.js?v=4392"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewish Research · LuxDot</title><link rel="stylesheet" href="styles.css?v=430"><link rel="stylesheet" href="arabic-polish.css?v=430"><link rel="stylesheet" href="platform-v43.css?v=4328"><link rel="stylesheet" href="jewish-research.css?v=4392"><link rel="stylesheet" href="luxdot-ui-lock.css?v=4385"><script defer src="app.js?v=430"></script><link rel="stylesheet" href="luxdot-global-language.css?v=4399"><link rel="stylesheet" href="luxdot-radio.css?v=43105"></head><body data-lux-i18n-complete="1"><header class="top"><div class="wrap topin"><a class="logo" data-lux-brand href="home.html">LuxDot</a><nav class="nav"><a data-t="home" href="home.html"></a><a data-t="research" href="research.html"></a><a data-t="faith" href="faith.html"></a><select class="lang lang-select" data-lang-select><option value="ar">العربية</option><option value="en">English</option><option value="nl">Nederlands</option><option value="jv">Basa Jawa</option><option value="he">עברית</option></select></nav></div></header><main class="jr" id="jr"></main><script>window.JR_PAGE={"slug":"abulafia-letters-names","data":{"ar":{"title":"أبراهام أبو العافية · قبّالاه الأسماء","sub":"צירוף אותיות · الأسماء · التبديل · النبوّة","lead":"العقدة الأقرب داخل اليهودية لبحث LuxDot في الحروف والأسماء: أبراهام أبو العافية (القرن 13) طوّر قبّالاه نبوية/وجدية تعتمد تركيب الحروف، تبديلها، الأسماء الإلهية وتقنيات تأملية، وقرأ دلالة الحائرين لابن ميمون وكتب عليها. لذلك هو جسر تاريخي بين العقلانية الميمونية وصوفية الحروف اليهودية."},"en":{"title":"Abraham Abulafia · Kabbalah of Names","sub":"letters · permutations · divine names · prophecy","lead":"A key node for Jewish letter mysticism. Abulafia developed prophetic/ecstatic Kabbalah around letter combinations and divine names while engaging deeply with Maimonides’ Guide."},"nl":{"title":"Abraham Abulafia · Kabbala van Namen","sub":"letters · permutaties · goddelijke namen","lead":"Een kernknoop voor Joodse lettermystiek. Abraham Abulafia ontwikkelde profetische/ecstatische Kabbala rond lettercombinaties en godsnamen, terwijl hij intensief in gesprek bleef met Maimonides’ Guide of the Perplexed."},"jv":{"title":"Abraham Abulafia · Kabbalah Jeneng","sub":"aksara · permutasi · jeneng Ilahi","lead":"Simpul utama mistik aksara Yahudi."},"he":{"title":"אברהם אבולעפיה · קבלת השמות","sub":"צירופי אותיות · שמות · נבואה","lead":"צומת מרכזי לקבלה הנבואית ולשילובי אותיות ושמות אלוהיים, מתוך עיסוק עמוק במורה נבוכים."}},"img":"assets/jewish-research/maimonides.jpg","credit":"LuxDot Jewish Research · source-linked study node","extra":[["ar","لماذا هو أقرب من ابن ميمون لعلم الحروف؟","الدراسات الحديثة تصف قبّالاه أبو العافية بأنها قبّالاه الأسماء أو القبّالاه النبوية؛ تقنياتها تشمل تركيب الحروف وتبديلها ودراسة الأسماء الإلهية. هذا يجعل مقارنته بعلم الحروف عند ابن عربي أقوى منهجياً من إلصاق هذا الدور بابن ميمون."],["ar","الجسر الميموني","أبو العافية لم يرَ بالضرورة مشروعه نقيضاً للعقلانية الميمونية؛ كتب شروحاً على دلالة الحائرين واستثمر عناصر منها في مشروعه الروحي. هذه عقدة انتقال: فلسفة → لغة → تأمل → نبوّة."],["ar","قاعدة المقارنة","التشابه بين تبديل الحروف عند أبو العافية وعلم الحروف في التصوف الإسلامي لا يثبت اقتباساً مباشراً. نسجل التشابه البنيوي، التسلسل الزمني، والمصادر المحتملة كلٌ على حدة."]],"sources":[["Brill · Abulafia, Kabbalah of Names","https://referenceworks.brill.com/display/entries/EJIO/COM-0000580.xml"],["Cambridge · Name of God and linguistic theory of Kabbalah","https://www.cambridge.org/core/journals/diogenes/article/name-of-god-and-the-linguistic-theory-of-the-kabbala/B1DA5BD235C3C07683B46084CC4DEF48"],["Stanford Encyclopedia · Scholem / Abulafia and Maimonides","https://plato.stanford.edu/archives/win2016/entries/scholem/"]],"related":[["maimonides.html","ابن ميمون"],["maimonides-letters-numbers.html","ابن ميمون والحروف"],["ibn-arabi-abulafia-comparison.html","ابن عربي × أبو العافية"],["gematria-method-lab.html","مختبر الجيماتريا"]],"extra_i18n":{"en":[["Why is he closer than Maimonides to a science of letters?","Modern scholarship describes Abraham Abulafia’s Kabbalah as prophetic or names-oriented Kabbalah. Its techniques include combining and permuting letters and working with divine names. This makes comparison with Ibn Arabi’s letter science methodologically stronger than assigning that role to Maimonides."],["The Maimonidean bridge","Abulafia did not necessarily treat his project as the opposite of Maimonidean rationalism. He wrote commentaries on Guide of the Perplexed and adapted elements of it to his spiritual project: philosophy → language → contemplation → prophecy."],["Comparison rule","Similarity between Abulafia’s letter permutations and Islamic letter sciences does not prove direct borrowing. LuxDot records structural similarity, chronology and possible channels of transmission separately."]],"nl":[["Waarom staat hij dichter dan Maimonides bij een letterleer?","Moderne studies beschrijven de Kabbala van Abraham Abulafia als profetische of op godsnamen gerichte Kabbala. Zijn technieken omvatten het combineren en permuteren van letters en het werken met godsnamen. Daardoor is een vergelijking met de letterleer van Ibn Arabi methodologisch sterker dan die rol aan Maimonides toe te schrijven."],["De Maimonideïsche brug","Abulafia zag zijn project niet noodzakelijk als het tegendeel van het rationalisme van Maimonides. Hij schreef commentaren op Guide of the Perplexed en verwerkte elementen ervan in zijn spirituele project: filosofie → taal → contemplatie → profetie."],["Vergelijkingsregel","Gelijkenis tussen Abulafia’s letterpermutaties en islamitische letterwetenschappen bewijst geen directe ontlening. LuxDot registreert structurele overeenkomst, chronologie en mogelijke overdrachtskanalen afzonderlijk."]]},"related_i18n":{"en":["Maimonides","Maimonides · Letters & Numbers","Ibn Arabi × Abraham Abulafia","Gematria Method Lab"],"nl":["Maimonides","Maimonides · letters & getallen","Ibn Arabi × Abraham Abulafia","Gematria-methodenlab"]}};</script><script defer src="jewish-research-page.js?v=4392"></script><script src="site-shell.js?v=43109"></script><script src="hebrew-research-overlay.js?v=4399"></script><script defer src="luxdot-radio.js?v=43105"></script></body></html>
