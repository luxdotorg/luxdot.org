<!doctype html><html lang="en" dir="ltr"><head><script src="language-core.js?v=4391"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewish Research · LuxDot</title><link rel="stylesheet" href="styles.css?v=430"><link rel="stylesheet" href="arabic-polish.css?v=430"><link rel="stylesheet" href="platform-v43.css?v=4328"><link rel="stylesheet" href="jewish-research.css?v=4391"><link rel="stylesheet" href="luxdot-ui-lock.css?v=4385"><script defer src="app.js?v=430"></script></head><body data-lux-i18n-complete="1"><header class="top"><div class="wrap topin"><a class="logo" data-lux-brand href="home.html">LuxDot</a><nav class="nav"><a data-t="home" href="home.html"></a><a data-t="research" href="research.html"></a><a data-t="faith" href="faith.html"></a><select class="lang lang-select" data-lang-select><option value="ar">العربية</option><option value="en">English</option><option value="nl">Nederlands</option><option value="jv">Basa Jawa</option><option value="he">עברית</option></select></nav></div></header><main class="jr" id="jr"></main><script>window.JR_PAGE={"slug":"maimonides-messiah-test","data":{"ar":{"title":"اختبار ابن ميمون للمشيح","sub":"Hilkhot Melakhim 11–12 · معايير قابلة للفحص","lead":"هذه عقدة معيارية لا دعائية: ما الذي يطلبه ابن ميمون قبل وصف شخص بالمشيح؟ وما الفرق بين «مفترض أنه المشيح» وبين تحقق المهمة؟ تُستخدم العقدة لاختبار الادعاءات، لا لتأكيدها مسبقاً."},"en":{"title":"Maimonides’ Messiah Test","sub":"Hilkhot Melakhim 11–12 · falsifiable criteria","lead":"A criteria node: what does Maimonides require before calling someone Messiah, and what distinguishes presumptive status from completed fulfillment? It tests claims rather than presupposing them."},"nl":{"title":"Maimonides’ Messias-toets","sub":"Hilkhot Melakhim 11–12","lead":"Een criteriaknoop: wat vereist Maimonides voordat iemand Messias kan worden genoemd, en wat onderscheidt een voorlopige status van voltooide vervulling? De pagina toetst claims in plaats van ze vooraf te veronderstellen."},"jv":{"title":"Tes Mesias Rambam","sub":"Hilkhot Melakhim 11–12","lead":"Kriteria kanggo nguji klaim Mesias."},"he":{"title":"מבחן המשיח של הרמב״ם","sub":"הלכות מלכים יא–יב","lead":"צומת קריטריונים לבחינת טענות משיחיות ולא לאישורן מראש."}},"img":"assets/jewish-research/maimonides.jpg","credit":"Maimonides relief · Architect of the Capitol · public domain","extra":[["ar","المستوى الأول: قرينة قوية","في الفصل 11 يربط ابن ميمون المرشح ببيت داود، والانشغال بالتوراة والوصايا وفق الشريعة المكتوبة والشفوية، والعمل على إصلاح التزام إسرائيل. هذه مرحلة افتراضية وليست حكماً نهائياً."],["ar","المستوى الثاني: نجاح المهمة","إذا نجح، وأعاد البناء الديني/القومي الذي يصفه النص، وبنى الهيكل وجمع شتات إسرائيل، عندها ينتقل الحكم إلى مرتبة أقوى في صياغة ابن ميمون. وإذا قُتل أو فشل قبل ذلك فالنص نفسه يعطي مثالاً تاريخياً مضاداً."],["ar","الخوارق ليست شرط الاختبار","ابن ميمون يستشهد بربي عكيفا وبار كوزيبا ليقول إن الحكم لم يُبنَ على طلب آيات وعجائب؛ ثم في الفصل 12 يحذر من تصور أن العصر المشيحاني يغيّر نظام الطبيعة بالضرورة، ويقرأ بعض صور إشعيا مجازياً."],["ar","كيف يستخدمها LuxDot","أي ادعاء شخصي يُقسَّم إلى جدول: CLAIM / MAIMONIDEAN CRITERION / EVIDENCE / COUNTER-EVIDENCE / STATUS. النتيجة قد تكون: غير مختبَر، غير كافٍ، متعارض، أو متوافق جزئياً؛ ولا يجوز تحويل التشابه إلى يقين."]],"sources":[["Sefaria · Mishneh Torah, Kings 11:1","https://www.sefaria.org/Mishneh_Torah%2C_Kings_and_Wars.11.1"],["Sefaria · Kings 11:4","https://www.sefaria.org/Mishneh_Torah%2C_Kings_and_Wars.11.4"],["Sefaria · Kings 12","https://www.sefaria.org/Mishneh_Torah%2C_Kings_and_Wars.12"],["Sefaria · Kings 12:5","https://www.sefaria.org/Mishneh_Torah%2C_Kings_and_Wars.12.5"]],"related":[["maimonides.html","موسى بن ميمون"],["talmud-messiah.html","التلمود والمشيح"],["savior-atlas.html","أطلس المخلّص"],["red-heifer.html","البقرة الحمراء"]],"extra_i18n":{"en":[["Level one: strong presumption","In chapter 11 Maimonides links a candidate to the House of David, Torah and commandments according to Written and Oral Law, and efforts to restore Israel’s observance. This is a provisional stage, not a final verdict."],["Level two: success of the mission","If the candidate succeeds, rebuilds the religious and national order described by the text, builds the Temple and gathers the dispersed of Israel, the assessment becomes stronger. If he is killed or fails beforehand, the text itself provides a historical counter-example."],["Miracles are not the test","Maimonides invokes Rabbi Akiva and Bar Koziva to show that judgment was not based on demanding signs and wonders. In chapter 12 he also warns against assuming that the messianic age necessarily overturns the natural order."],["How LuxDot uses the test","Any personal claim is separated into CLAIM / MAIMONIDEAN CRITERION / EVIDENCE / COUNTER-EVIDENCE / STATUS. Possible outcomes include untested, insufficient, conflicting or partially compatible; similarity is never converted into certainty."]],"nl":[["Niveau één: sterke aanwijzing","In hoofdstuk 11 verbindt Maimonides een kandidaat met het Huis van David, de Tora en geboden volgens de Schriftelijke en Mondelinge Leer, en inspanningen om Israëls naleving te herstellen. Dit is een voorlopige fase, geen definitief oordeel."],["Niveau twee: slagen van de opdracht","Als de kandidaat slaagt, de beschreven religieuze en nationale orde herstelt, de Tempel bouwt en de verstrooiden van Israël bijeenbrengt, wordt de beoordeling sterker. Als hij voordien wordt gedood of faalt, geeft de tekst zelf een historisch tegenvoorbeeld."],["Wonderen zijn niet de toets","Maimonides verwijst naar rabbi Akiva en Bar Koziva om te tonen dat het oordeel niet op het eisen van tekenen en wonderen was gebaseerd. In hoofdstuk 12 waarschuwt hij er ook voor te veronderstellen dat het messiaanse tijdperk noodzakelijk de natuurorde omkeert."],["Hoe LuxDot de toets gebruikt","Elke persoonlijke claim wordt uitgesplitst in CLAIM / MAIMONIDEAN CRITERION / EVIDENCE / COUNTER-EVIDENCE / STATUS. Mogelijke uitkomsten zijn onder meer niet getest, onvoldoende, strijdig of gedeeltelijk passend; overeenkomst wordt nooit in zekerheid omgezet."]]},"related_i18n":{"en":["Maimonides","Talmud & Messiah · Sanhedrin 97–99","Savior Atlas","Red Heifer"],"nl":["Maimonides","Talmoed & Messias · Sanhedrin 97–99","Verlossersatlas","Rode koe"]}};</script><script defer src="jewish-research-page.js?v=4391"></script><script src="site-shell.js?v=4385"></script></body></html>
