const S=[
['المكتبة الوطنية الفرنسية — تعريف بالمخطوطات الدرزية وCorpus الرسائل','https://heritage.bnf.fr/bibliothequesorient/en/druze-0'],
['المكتبة الوطنية الإسرائيلية — فهرس مخطوط المجلد الثاني ويتضمن «رسالة الغيبة»','https://www.nli.org.il/ar/manuscripts/NNL_ALEPH990028807280205171/NLI'],
['Cambridge University Press — Mark Sedgwick, New Religious Movements in Islam (2026)','https://www.cambridge.org/core/elements/new-religious-movements-in-islam/5F671C5FD542E90AD023A2F4BEC0F59F'],

function draw(){const x=L(),ar=x===DATA.ar;document.documentElement.dir=x.dir;document.documentElement.lang=ar?'ar':((x===DATA.nl)?'nl':'en');document.title=x.title+' · LuxDot';hikma.innerHTML=`<section class="hero"><article class="card"><div class="kicker">LUXDOT / RESEARCH 029</div><h1>${x.title}</h1><p class="lead">${x.sub}</p><p>${x.intro}</p><span class="tag grade A">A · مخطوط/فهرس</span><span class="tag grade B">B · دراسة أكاديمية</span><span class="tag grade C">C · تقليد موثق</span><span class="tag grade D">D · فرضية LuxDot</span></article><article class="card"><img class="manu" src="assets/druze-hikma-manuscript.jpg" alt="مخطوط درزي تاريخي"><p class="note">صورة مخطوط درزي تاريخي من مجموعة عرضتها Christie’s. الصورة توثيق بصري للمادة المخطوطة، وليست دليلاً بذاتها على أي تفسير عقائدي.</p></article></section>
<section class="grid"><article class="card"><h2>${x.sections.a}</h2><p><b>1.</b> تصف المكتبة الوطنية الفرنسية رسائل الحكمة بأنها corpus مقدس لدى الدروز مؤلف من <b>111 رسالة</b> تعود إلى القرن 11.</p><p><b>2.</b> فهرس مخطوط المجلد الثاني في المكتبة الوطنية الإسرائيلية يثبت وجود عنوان <b>«رسالة الغيبة»</b> ضمن التسلسل المخطوط، ويضعها قبل «كتاب فيه تقسيم العلوم».</p><p><b>3.</b> الدراسات الحديثة تجعل حمزة بن علي الشخصية المؤسسة والمحورية في تشكل الدعوة الدرزية في العصر الفاطمي.</p></article>
<article class="card"><h2>${x.sections.b}</h2><div class="timeline"><div class="step"><b>سجل الغيبة</b><span>نصوص مرتبطة باختفاء الحاكم بأمر الله سنة 411هـ/1021م، وهي نقطة تاريخية مركزية لفهم معنى الغيبة في corpus المبكر.</span></div><div class="step"><b>كشف الحقائق</b><span>عنوان يكشف مركزية الانتقال من ظاهر النص إلى حقيقته الباطنة داخل البنية التأويلية.</span></div><div class="step"><b>صاحب الكشف</b><span>«شرط الإمام صاحب الكشف» نص مهم لفهم السلطة الدينية/الاجتماعية في زمن الكشف، ولا ينبغي مساواته آلياً بـ«المهدي».</span></div><div class="step"><b>سجل المجتبى</b><span>مرتبط بإسماعيل التميمي ضمن نظام الحدود؛ لذلك «المجتبى» هنا ليس دليلاً مستقلاً على مخلّص أخروي مجهول.</span></div></div></article>
<article class="card"><h2>${x.sections.c}</h2><p>أحد أهم نتائج التدقيق هو تصحيح القراءة السابقة: <b>«المجتبى» لقب مرتبط بإسماعيل التميمي</b> في منظومة الحدود الخمسة، وليس اسماً نبوئياً مفتوحاً يمكن إسقاطه مباشرة على شخصية مستقبلية. لذلك تُصنّف أي محاولة لربطه بالمهدي أو المسيح من دون نص إضافي في درجة <b>D</b> لا أكثر.</p></article>
<article class="card"><h2>${x.sections.d}</h2><p>وجود «رسالة الغيبة» ثابت نصياً وفهرسياً، وارتباطها بسياق اختفاء الحاكم ثابت تاريخياً بدرجة عالية. أما تفاصيل <b>كيفية العودة، زمنها، علاماتها، وهوية من يظهر معها</b> فتحتاج استخراجاً مباشراً من نصوص الرسائل وشروحها المعتبرة قبل تحويلها إلى ادعاءات.</p><p class="note">قاعدة LuxDot: الغيبة في هذا corpus تُقارن بغيبة الإمام في بعض التقاليد الشيعية وبفكرة Parousia المسيحية من حيث البنية فقط؛ التشابه البنيوي لا يعني وحدة الشخصية أو النبوءة.</p></article>
<article class="card"><h2>${x.sections.e}</h2><p>مصطلحات «الكشف»، «البعث»، «النشور» و«القيامة» تظهر ضمن اللغة الدينية المنسوبة إلى رسائل الحكمة وشروحها، لكن دلالتها ليست مطابقة بالضرورة للفهم السنّي أو الشيعي أو المسيحي الحرفي. في الفكر الدرزي ترتبط هذه المفاهيم أيضاً ببنية باطنية ودورات كونية/روحية؛ لذلك سنعاملها كمفاهيم تحتاج تفسيراً داخلياً قبل المقارنة الخارجية.</p></article>
<article class="card"><h2>${x.sections.f}</h2><table><tr><th>المحور</th><th>رسائل الحكمة</th><th>المقارنة</th><th>الدرجة</th></tr><tr><td>الغيبة</td><td>عنوان نصي ثابت وسياق تاريخي واضح</td><td>المهدي الغائب / عودة المسيح</td><td>A→D</td></tr><tr><td>الكشف</td><td>مصطلح مركزي في عناوين ورسائل</td><td>الظهور/التجلي في تقاليد أخرى</td><td>B→D</td></tr><tr><td>المجتبى</td><td>إسماعيل التميمي ضمن الحدود</td><td>ليس «المخلّص المختار» تلقائياً</td><td>A</td></tr><tr><td>القيامة</td><td>قراءة باطنية تحتاج ضبطاً نصياً</td><td>القيامة الإسلامية/المسيحية</td><td>B→D</td></tr><tr><td>الحاكم</td><td>مركز تاريخي وعقائدي في نشأة الدعوة</td><td>أي مساواة مع مهدي/مسيح آخر غير مثبتة</td><td>B→D</td></tr></table></article>
<article class="card wide"><h2>${x.sections.g}</h2><p>لا يوجد حتى الآن ما يسمح لـLuxDot بأن يقول إن رسائل الحكمة «تتنبأ بمهدي بعينه» أو أن «المجتبى» هو شخصية مستقبلية، ولا أن علامات عودة الحاكم تطابق سلسلة علامات إسلامية أو مسيحية محددة. هذه ستبقى <b>أسئلة بحث</b> إلى أن نجد نصوصاً صريحة برقم الرسالة والسياق والنسخة.</p><p>المرحلة التالية داخل العقدة: فهرسة كل موضع لـ <b>الغيبة، الكشف، الظهور، البعث، النشور، القيامة، القائم، المسيح، المهدي، الميثاق، ولي الزمان، الدور، الشام</b> وربطه برقم الرسالة والمخطوط/الطبعة.</p></article>
<article class="card wide src"><h2>${x.sections.h}</h2>${S.map(s=>`<a target="_blank" rel="noopener" href="${s[1]}">${s[0]} ↗</a>`).join('')}<p class="note">المصادر النقدية/الأكاديمية لها الأولوية. النسخ الرقمية المتداولة تُستخدم للوصول إلى موضع النص ثم تُراجع على فهرس مخطوط أو دراسة موثوقة قبل اعتماد الاستنتاج.</p><div class="links"><a href="research.html">${x.back}</a><a href="savior-atlas.html">أطلس المخلّص</a><a href="mahdi-matrix.html">مصفوفة المهدي</a><a href="red-heifer.html">البقرة الحمراء</a></div></article></section>`}
