ad":"Jembatan sejarah antarane pietisme Yahudi lan lingkungan Sufi."},"he":{"title":"אברהם בן הרמב״ם · גשר יהודי־צופי","sub":"מצרים · חסידות · תפילה · השפעה צופית","lead":"צומת היסטורי לתנועת החסידים במצרים ולמגע המתועד עם פרקטיקות צופיות."}},"img":"assets/jewish-research/maimonides.jpg","credit":"LuxDot Jewish Research · source-linked study node","extra":[["ar","المسار المختلف","هنا لا نبحث الجيماتريا، بل الجسد والعبادة والزهد: السجود، الخلوة، التهيؤ للصلاة، الزهد وممارسات التقوى. لذلك نضعه بجانب الحلاج وابن عربي على محور التصوف، لا على محور حساب الحروف."],["ar","الأب والابن","من الخطأ دمج فكر موسى بن ميمون بفكر ابنه. LuxDot يسجل الاستمرار والاختلاف: الأب عقلاني وفقيه وفيلسوف؛ الابن طوّر تيار تقوى ذي تقاطعات صوفية أوضح."]],"sources":[["Cambridge · Judaism and Sufism","https://resolve.cambridge.org/core/services/aop-cambridge-core/content/view/4368181703EFD43490478EF23C4BA974/9781139000055c10_p201-217_CBO.pdf/judaism_and_sufism.pdf"],["Cambridge History of Judaism · Abraham Maimuni bibliography","https://www.cambridge.org/core/books/cambridge-history-of-judaism/spiritual-and-intellectual-history/6AD770DA9A6E361D056B8969A62123FD"]],"related":[["maimonides.html","موسى بن ميمون"],["hallaj.html","الحلاج"],["ibn-arabi-abulafia-comparison.html","المقارنة الصوفية/الحروفية"],["knowledge-journeys.html","رحلات المعرفة"]],"extra_i18n":{"en":[["A different track","This node is not about gematria but about body, worship and ascetic piety: prostration, retreat, preparation for prayer and renunciation. Abraham Maimonides therefore belongs beside al-Hallaj and Ibn Arabi on a mysticism axis, not on the letter-calculation axis."],["Father and son","The thought of Moses Maimonides must not be merged with that of his son. LuxDot records both continuity and difference: the father was a rationalist jurist and philosopher; the son developed a pietistic current with clearer Sufi intersections."]],"nl":[["Een ander spoor","Deze knoop gaat niet over gematria maar over lichaam, eredienst en ascetische vroomheid: prostratie, afzondering, voorbereiding op gebed en verzaking. Abraham Maimonides hoort daarom naast al-Hallaj en Ibn Arabi op een mystiek-as, niet op de as van letterberekening."],["Vader en zoon","Het denken van Moses Maimonides mag niet met dat van zijn zoon worden samengevoegd. LuxDot registreert zowel continuïteit als verschil: de vader was rationalistisch jurist en filosoof; de zoon ontwikkelde een vroomheidsstroming met duidelijkere soefistische raakvlakken."]]},"related_i18n":{"en":["Maimonides","al-Hallaj","Ibn Arabi × Abraham Abulafia","Knowledge Journeys"],"nl":["Maimonides","al-Hallaj","Ibn Arabi × Abraham Abulafia","Kennisreizen"]}};</script><script defer src="jewish-research-page.js?v=4392"></script><script src="site-shell.js?v=41838"></script><script src="hebrew-research-overlay.js?v=4399"></script><script defer src="luxdot-radio.js?v=41819b"></script><script defer src="content-language-core.js?v=41837"></script><script src="luxdot-typography-density.js?v=41416"></script>
