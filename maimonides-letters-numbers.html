<!doctype html><html lang="en" dir="ltr"><head><script src="language-core.js?v=43111"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewish Research · LuxDot</title><link rel="stylesheet" href="styles.css?v=430"><link rel="stylesheet" href="arabic-polish.css?v=430"><link rel="stylesheet" href="platform-v43.css?v=4328"><link rel="stylesheet" href="jewish-research.css?v=4392"><link rel="stylesheet" href="luxdot-ui-lock.css?v=4385"><script defer src="app.js?v=43111"></script><link rel="stylesheet" href="luxdot-global-language.css?v=4399"><link rel="stylesheet" href="luxdot-radio.css?v=43105"></head><body data-lux-i18n-complete="1"><header class="top"><div class="wrap topin"><a class="logo" data-lux-brand href="home.html">LuxDot</a><nav class="nav"><a data-t="home" href="home.html"></a><a data-t="research" href="research.html"></a><a data-t="faith" href="faith.html"></a><select class="lang lang-select" data-lang-select><option value="ar">العربية</option><option value="en">English</option><option value="nl">Nederlands</option><option value="he">עברית</option><option value="jv">Basa Jawa</option><option value="id">Bahasa Indonesia</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option><option value="tr">Türkçe</option></select></nav></div></header><main class="jr" id="jr"></main><script>window.JR_PAGE={"slug":"maimonides-letters-numbers","data":{"ar":{"title":"ابن ميمون · الحروف والأرقام","sub":"ما الذي قاله فعلاً؟ وما الذي أُضيف لاحقاً؟","lead":"عقدة نقدية تمنع إسقاط القبّالاه العددية المتأخرة على ابن ميمون. اهتمامه الدقيق بالحروف يظهر بقوة في قوانين كتابة التوراة والتفلين والمزوزاه، بينما موقفه من التنجيم حادّ وعقلاني. الجيماتريا موجودة في التراث الربّاني الأوسع، لكنها ليست محور مشروعه الفكري كما هي عند قبّاليين لاحقين."},"en":{"title":"Maimonides · Letters & Numbers","sub":"What did he actually teach?","lead":"A critical node separating Maimonides’ own treatment of letters and textual precision from later kabbalistic numerology. His corpus is not best described as a gematria system."},"nl":{"title":"Maimonides · letters en getallen","sub":"tekstkritiek vóór numerologie","lead":"Kritische knoop die Maimonides’ eigen tekstuele precisie scheidt van latere kabbalistische getallenleer."},"jv":{"title":"Maimonides · aksara lan angka","sub":"bedakake Rambam lan Kabbalah","lead":"Simpul kritis kanggo mbedakake Rambam saka numerologi Kabbalah mengko."},"he":{"title":"הרמב״ם · אותיות ומספרים","sub":"מה כתב באמת ומה נוסף מאוחר יותר","lead":"צומת ביקורתי המפריד בין דיוק האותיות אצל הרמב״ם לבין נומרולוגיה קבלית מאוחרת."}},"img":"assets/jewish-research/maimonides.jpg","credit":"LuxDot Jewish Research · source-linked study node","extra":[["ar","الحروف عند ابن ميمون","في Hilkhot Tefillin, Mezuzah and Sefer Torah يعامل شكل الحرف، الفراغ، التيجان والنص الصحيح كعناصر قانونية في صلاحية النص المقدس. هذا اهتمام نصّي/هالاخي بالحرف، وليس تلقائياً نظرية سرّية في قوى الحروف."],["ar","الأرقام ليست كلها جيماتريا","يستخدم ابن ميمون الأعداد في التقنين، التقسيم، الفلك والعلوم بحسب سياقها. لا يجوز تحويل كل رقم عنده إلى شفرة. أي علاقة عددية في LuxDot يجب وسمها: نص صريح / جيماتريا تقليدية / حساب حديث / مصادفة."],["ar","حدّ فاصل: التنجيم","رسالته في التنجيم مهمة كاختبار منهجي: رفض الاعتقاد بالتأثير النجمي غير المؤسس على برهان، وربطه بمشكلة حرية الإرادة. لذلك يجب أن يكون ابن ميمون داخل LuxDot أيضاً أداة لرفض الحسابات التي لا يمكن تبريرها، لا مجرد مصدر لإنتاجها."]],"sources":[["Stanford Encyclopedia · Maimonides","https://plato.stanford.edu/entries/maimonides/"],["Mishneh Torah · Tefillin, Mezuzah and Sefer Torah 7","https://www.chabad.org/library/article_cdo/aid/925429/jewish/Tefillin-Mezuzah-and-Sefer-Torah-Chapter-7.htm"],["Cambridge / scholarship context · Jewish thought in Arabic","https://www.cambridge.org/core/books/cambridge-history-of-judaism/spiritual-and-intellectual-history/6AD770DA9A6E361D056B8969A62123FD"]],"related":[["maimonides.html","ابن ميمون"],["abulafia-letters-names.html","أبو العافية · الحروف والأسماء"],["gematria-method-lab.html","مختبر الجيماتريا"],["name-date-matrix.html","مصفوفة الاسم والتاريخ"]],"extra_i18n":{"en":[["Letters in Maimonides","In Hilkhot Tefillin, Mezuzah and Sefer Torah, letter form, spacing, crowns and correct textual transmission are treated as legal conditions for a valid sacred text. This is textual and halakhic attention to letters, not automatically a secret theory of letter powers."],["Not every number is gematria","Maimonides uses numbers in codification, classification, astronomy and science according to context. LuxDot labels every numerical relation as explicit text / traditional gematria / modern calculation / coincidence instead of treating every number as a code."],["A boundary: astrology","His letter on astrology is methodologically important: he rejected unsupported claims of stellar influence and connected the issue to free will. In LuxDot he therefore serves as a filter against unjustified calculations, not merely as a source for producing them."]],"nl":[["Letters bij Maimonides","In Hilkhot Tefillin, Mezuzah and Sefer Torah worden lettervorm, spatiëring, kroontjes en correcte tekstoverlevering behandeld als juridische voorwaarden voor een geldige heilige tekst. Dat is tekstuele en halachische aandacht voor letters, niet automatisch een geheime theorie over letterkrachten."],["Niet elk getal is gematria","Maimonides gebruikt getallen in codificatie, indeling, astronomie en wetenschap volgens hun context. LuxDot labelt elke numerieke relatie als expliciete tekst / traditionele gematria / moderne berekening / toeval, in plaats van elk getal als code te behandelen."],["Een grens: astrologie","Zijn brief over astrologie is methodologisch belangrijk: hij verwierp ongefundeerde claims over sterreninvloed en verbond de kwestie met vrije wil. In LuxDot functioneert hij daarom ook als filter tegen ongerechtvaardigde berekeningen, niet alleen als bron om ze te produceren."]]},"related_i18n":{"en":["Maimonides","Abraham Abulafia · Letters & Divine Names","Gematria Method Lab","Name & Date Matrix"],"nl":["Maimonides","Abraham Abulafia · letters & godsnamen","Gematria-methodenlab","Naam- en datummatrix"]}};</script><script defer src="jewish-research-page.js?v=4392"></script><script src="site-shell.js?v=43109"></script><script src="hebrew-research-overlay.js?v=4399"></script><script defer src="luxdot-radio.js?v=43105"></script></body></html>
