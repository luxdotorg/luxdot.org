<!doctype html><html lang="ar" dir="rtl" data-canonical="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شارك · شبكة الجذور البشرية</title><style>body{margin:0;background:#07110e;color:#edf8f1;font-family:"Noto Kufi Arabic",system-ui;line-height:1.8}main{max-width:780px;margin:auto;padding:32px 18px 70px}.box{background:#0e1e18;border:1px solid #29483a;border-radius:20px;padding:22px;margin:16px 0}label{display:block;margin:14px 0}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #456858;background:#09140f;color:#fff}input[type=checkbox]{width:auto}button{background:#c7e8d2;color:#07110e;font-weight:700}.notice{color:#bdd0c5}.consent{display:flex;gap:10px;align-items:flex-start}.consent input{margin-top:8px}</style></head><body><main><a href="human-roots-network.html">← شبكة الجذور البشرية</a><h1>المشاركة في المرحلة الأولى</h1><p class="notice">لا ترفع DNA خاماً هنا. هذه النسخة نموذج خصوصية للمرحلة الأولى؛ التسجيل الخلفي غير مفعّل بعد حتى تكتمل المراجعة القانونية والحوكمة.</p><form id="f"><section class="box"><h2>عن العائلة</h2><label>رمز/اسم عائلي اختياري<input name="family" maxlength="80" autocomplete="off"></label><label>البلد/المنطقة المرتبطة بالجذور<input name="region" maxlength="100" autocomplete="off"></label><label>سبب المشاركة<select name="purpose"><option>توثيق شجرة العائلة</option><option>البحث عن فرع عائلي مفقود</option><option>طلب كِت مدعوم</option><option>دعم المبادرة فقط</option></select></label></section><section class="box"><h2>موافقات منفصلة</h2><label class="consent"><input type="checkbox" name="genealogy"><span>أرغب بالمشاركة في مسار الأنساب.</span></label><label class="consent"><input type="checkbox" name="matching"><span>أرغب مستقبلاً بمطابقة الأقارب. لن تُكشف الهوية دون موافقة مزدوجة.</span></label><label class="consent"><input type="checkbox" name="health"><span>أرغب أن يُعرض عليّ مستقبلاً خيار منفصل للبحث الصحي؛ هذا ليس موافقة على مشاركة بيانات جينية الآن.</span></label><label class="consent"><input type="checkbox" name="population"><span>أرغب أن يُعرض عليّ مستقبلاً خيار منفصل للبحث السكاني المجهول/المشفّر؛ لا بيانات DNA تُجمع هنا.</span></label></section><section class="box"><h2>برنامج الكِت التضامني</h2><label class="consent"><input type="checkbox" name="kit"><span>أرغب بطلب فحص مدعوم إذا أصبح البرنامج متاحاً. الحصول على الكِت لن يكون مشروطاً بالتنازل عن حقوقي الجينية.</span></label></section><button type="submit">مراجعة اختياراتي</button></form><div id="out" class="box" hidden></div></main><script src="language-core.js?v=41855"></script><script src="content-language-core.js?v=41855"></script><script>document.getElementById('f').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),a=[];for(const k of ['genealogy','matching','health','population','kit'])if(d.get(k))a.push(k);const o=document.getElementById('out');o.hidden=false;o.textContent='تمت المراجعة محلياً فقط. لم تُرسل أو تُحفظ أي بيانات. الاختيارات: '+(a.join(' · ')||'لا توجد موافقات محددة')+'.';}</script></body></html>
