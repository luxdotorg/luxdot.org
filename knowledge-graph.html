<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuxDot Knowledge Graph</title><script src="language-core.js?v=41816"></script><link href="styles.css?v=450" rel="stylesheet"><link rel="stylesheet" href="luxdot-global-language.css?v=4399"><link rel="stylesheet" href="luxdot-typography-v41416.css?v=41416">
<style>
body{margin:0;background:#020403;color:#eef7f0}main{max-width:1300px;margin:auto;padding:28px 18px 80px}.kg-head{display:flex;gap:12px;justify-content:space-between;align-items:end;flex-wrap:wrap}.kg-note{max-width:780px;opacity:.75}
.kg-shell{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;margin-top:16px}.kg-canvas{border:1px solid rgba(125,255,174,.18);border-radius:20px;background:#030805;min-height:70vh;position:relative;overflow:hidden}.kg-canvas canvas{display:block;width:100%;height:70vh}.kg-side{border:1px solid rgba(125,255,174,.16);border-radius:20px;padding:15px;background:#06100a}.kg-list{display:grid;gap:7px;max-height:55vh;overflow:auto}.kg-list a{border:1px solid rgba(125,255,174,.12);border-radius:12px;padding:8px 10px;text-decoration:none;color:#eef7f0;font-size:12px}.kg-search{width:100%;box-sizing:border-box;border:1px solid rgba(125,255,174,.2);border-radius:999px;background:#020403;color:white;padding:9px 12px;margin:8px 0}
@media(max-width:850px){.kg-shell{grid-template-columns:1fr}.kg-side{order:-1}.kg-canvas canvas{height:62vh}}
</style></head><body><main><div class="kg-head"><div><h1>LuxDot Knowledge Graph</h1><p class="kg-note">Generated from actual internal links between LuxDot pages. A line means a direct navigational relationship exists; it does not by itself prove a historical or causal relationship.</p></div><a href="research.html">← Research</a></div>
<div class="kg-shell"><div class="kg-canvas"><canvas id="kg"></canvas></div><aside class="kg-side"><b>Nodes</b><input id="q" class="kg-search" placeholder="Search nodes"><div id="info"><p>Select a node.</p></div><div id="list" class="kg-list"></div></aside></div></main>
<script>
(async()=>{const data=await fetch("knowledge-graph.json?v=4150").then(r=>r.json()),cv=document.getElementById("kg"),ctx=cv.getContext("2d"),box=cv.parentElement,q=document.getElementById("q"),list=document.getElementById("list"),info=document.getElementById("info");
const focus=new URLSearchParams(location.search).get("focus");let selected=focus||null,filter="";
function resize(){const d=devicePixelRatio||1;cv.width=box.clientWidth*d;cv.height=box.clientHeight*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener("resize",resize);
const nodes=data.nodes.filter(n=>n.category==="research"||n.category==="core"),idx=new Map(nodes.map((n,i)=>[n.id,i])),links=data.links.filter(e=>idx.has(e.source)&&idx.has(e.target));
function pos(i){const w=box.clientWidth,h=box.clientHeight,cx=w/2,cy=h/2;const n=nodes.length;const ring=1+(i%4);const ang=(i/n)*Math.PI*2*4;const r=Math.min(w,h)*(.11+.075*ring);return{x:cx+Math.cos(ang)*r,y:cy+Math.sin(ang)*r}}
nodes.forEach((n,i)=>Object.assign(n,pos(i)));
function draw(){const w=box.clientWidth,h=box.clientHeight;ctx.clearRect(0,0,w,h);ctx.strokeStyle="rgba(125,255,174,.10)";ctx.lineWidth=.7;for(const e of links){const a=nodes[idx.get(e.source)],b=nodes[idx.get(e.target)];if(!a||!b)continue;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
for(const n of nodes){const hit=selected===n.id,dim=filter&&!n.title.toLowerCase().includes(filter)&&!n.id.toLowerCase().includes(filter);ctx.beginPath();ctx.arc(n.x,n.y,hit?6:3.3,0,Math.PI*2);ctx.fillStyle=dim?"rgba(180,200,185,.12)":hit?"#e0c36b":n.category==="core"?"#9fd3aa":"#72f4a6";ctx.fill()}}
function nearest(x,y){let best=null,d=18;for(const n of nodes){const dd=Math.hypot(n.x-x,n.y-y);if(dd<d){best=n;d=dd}}return best}
function show(n){if(!n)return;selected=n.id;const rel=links.filter(e=>e.source===n.id||e.target===n.id).map(e=>e.source===n.id?e.target:e.source).slice(0,10);info.innerHTML=`<h3>${n.title}</h3><p><small>${n.id}</small></p><p>${rel.length} direct displayed connections</p><p><a href="${n.id}${location.search.includes("lang=")?"?lang="+new URLSearchParams(location.search).get("lang"):""}">Open node ↗</a></p>`;draw()}
cv.addEventListener("click",e=>{const r=cv.getBoundingClientRect();show(nearest(e.clientX-r.left,e.clientY-r.top))});
function renderList(){const f=filter;list.innerHTML=nodes.filter(n=>!f||n.title.toLowerCase().includes(f)||n.id.toLowerCase().includes(f)).slice(0,120).map(n=>`<a href="#" data-id="${n.id}">${n.title}</a>`).join("");list.querySelectorAll("a").forEach(a=>a.onclick=e=>{e.preventDefault();show(nodes[idx.get(a.dataset.id)])})}
q.oninput=()=>{filter=q.value.trim().toLowerCase();renderList();draw()};resize();renderList();if(selected&&idx.has(selected))show(nodes[idx.get(selected)]);
})();
</script><script src="site-shell.js?v=41816"></script><script defer src="content-language-core.js?v=41816"></script><script src="luxdot-typography-density.js?v=41416"></script><script src="arabic-surface-v4160.js?v=4160"></script><script src="luxdot-language-polish.js?v=41815"></script></body></html>
