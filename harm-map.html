<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خريطة الإصلاح · LuxDot</title><link rel="stylesheet" href="styles.css?v=4328"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{background:#020604;color:#edf6ef}.w{max-width:1160px;margin:auto;padding:60px 20px}#map{height:460px;border-radius:18px;border:1px solid #294b33}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}.case{border:1px solid #294b33;border-radius:16px;padding:14px;background:#050b07}.case img{width:100%;max-height:210px;object-fit:cover;border-radius:12px}.badge{display:inline-block;border:1px solid #496052;border-radius:999px;padding:4px 8px;font-size:10px}.setup{border:1px solid #735f27;border-radius:14px;padding:14px;background:#111008}</style></head><body><main class="w"><p><a href="removing-harm-way.html">← إماطة الأذى عن الطريق</a></p><h1>الخريطة العامة والحالات المنشورة</h1><p>لا تظهر هنا إلا الحالات التي تمت مراجعتها واعتمادها للنشر.</p><div id="setup" class="setup" hidden>القاعدة غير موصولة بعد. راجع supabase-config.js.</div><div id="map"></div><div id="cards" class="cards"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=41844"></script><script src="harm-app.js?v=41844"></script><script>
const map=L.map('map').setView([51.506,4.861],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);async function run(){if(!LuxHarm.configured){setup.hidden=false;return}const rows=await LuxHarm.published();for(const r of rows){let imgs=await LuxHarm.images(r.id),before=imgs.find(x=>x.phase==='before'&&x.url),after=imgs.find(x=>x.phase==='after'&&x.url);if(r.latitude&&r.longitude)L.marker([r.latitude,r.longitude]).addTo(map).bindPopup(`<b>${LuxHarm.esc(r.title)}</b><br>${LuxHarm.esc(r.public_code)}`);const d=document.createElement('article');d.className='case';d.innerHTML=`<span class="badge">${LuxHarm.esc(r.status)}</span><h3>${LuxHarm.esc(r.title)}</h3><p>${LuxHarm.esc(r.public_summary||r.description)}</p>${before?`<p><b>قبل</b></p><img src="${before.url}">`:''}${after?`<p><b>بعد</b></p><img src="${after.url}">`:''}${r.resolution_summary?`<p><b>الإصلاح:</b> ${LuxHarm.esc(r.resolution_summary)}</p>`:''}`;cards.append(d)}}run().catch(e=>cards.textContent='تعذر تحميل الحالات: '+e.message);
</script><script src="site-shell.js?v=41843"></script></body></html>
