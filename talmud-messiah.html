, niet als één voorspelling."},"jv":{"title":"Talmud lan Mesias","sub":"Sanhedrin 97–99","lead":"Akeh tradhisi Talmud dibaca bebarengan, dudu siji ramalan."},"he":{"title":"התלמוד והמשיח","sub":"סנהדרין צז–צט","lead":"מיפוי מסורות שונות על המשיח בלי להפוך אותן ללוח זמנים אחיד."}},"img":"assets/jewish-research/maimonides.jpg","credit":"LuxDot Jewish Research · reference image","extra":[["ar","لماذا هذه العقدة مهمة؟","سنهدرين 97a–98a يجمع أقوالاً عن ظروف الجيل، الأزمنة، التوبة، المعاناة، و'ابن داود'. بعض الأقوال حسابية وبعضها أخلاقي وبعضها جدلي. LuxDot يعرضها كخريطة مصادر لا كنبوة واحدة."],["ar","ضابط نقدي","أي ربط بتاريخ معاصر يجب أن يُوسم كفرضية خارج النص، لأن التلمود نفسه يحفظ آراء متعددة ولا يعطي آلية واحدة متفقاً عليها لتعيين شخص معاصر."]],"sources":[["Sefaria · Sanhedrin 97a","https://www.sefaria.org/Sanhedrin.97a"],["Sefaria · Sanhedrin 97b–98a","https://www.sefaria.org/Sanhedrin.97b.1-98a.21"]],"related":[["jewish-source-ladder.html","سُلّم المصادر"],["maimonides-messiah-test.html","اختبار ابن ميمون للمشيح"],["safed-kabbalah-messianism.html","صفد والقبّالاه"]],"extra_i18n":{"en":[["Why this node matters","Sanhedrin 97a–98a gathers statements about the conditions of the generation, time, repentance, suffering and the “Son of David.” Some are numerical, some ethical and some polemical. LuxDot presents them as a source map rather than one prophecy."],["Critical control","Any connection to a contemporary date must be marked as a hypothesis outside the text, because the Talmud preserves multiple opinions and does not provide one agreed mechanism for identifying a contemporary person."]],"nl":[["Waarom deze knoop belangrijk is","Sanhedrin 97a–98a verzamelt uitspraken over de omstandigheden van de generatie, tijd, bekering, lijden en de “Zoon van David”. Sommige zijn numeriek, andere ethisch of polemisch. LuxDot presenteert ze als bronnenkaart, niet als één profetie."],["Kritische controle","Elke koppeling aan een hedendaagse datum moet als hypothese buiten de tekst
