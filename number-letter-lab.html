<style>.lab{max-width:1060px;margin:auto;padding:36px 18px 80px}.lab-card{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:20px;margin:14px 0}.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.metric{border:1px solid var(--line);border-radius:15px;padding:16px;text-align:center}.metric b{display:block;color:var(--accent);font-size:28px}.formula{direction:ltr;unicode-bidi:plaintext;overflow-wrap:anywhere;color:var(--muted);font-size:12px}.arabic-source{font-family:"Noto Kufi Arabic",Tahoma,Arial,sans-serif;direction:rtl}.method-note{border-inline-start:3px solid var(--accent);padding-inline-start:14px;color:var(--muted)}.lab input{width:100%;border:1px solid var(--line);background:#09110c;color:var(--text);padding:12px;border-radius:12px;font:inherit}.tabrow{display:flex;flex-wrap:wrap;gap:8px}.tabrow button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:8px 12px}.secondary{opacity:.85}</style>
<link rel="stylesheet" href="luxdot-ui-lock.css?v=4344"></head><body class="lux-lang-pending" data-full-locales="1"><header class="top"></header><main class="lab" id="lab"></main>
<script>
const COPY={
ar:{title:'مختبر الأسماء والأعداد والحروف',lead:'عقدة حسابية مستقلة. صيغ الاسم المثبتة للاختبار هي Rafy Alhajji وRafi Alhaji بالأحرف اللاتينية، ورافي الحجي ورافي الحاجي بالأحرف العربية. التطابق العددي أداة مقارنة وليس دليلاً على هوية نبوئية.',gem:'Gematrix للاسم اللاتيني',gemLead:'نستخدم الصيغة اللاتينية الثابتة Rafy Alhajji ونفصل الأنظمة الثلاثة كما يعرضها Gematrix.',jew:'Jewish / Hebrew cipher اللاتيني',eng:'English ×6',simple:'Simple A1Z26',abj:'حساب الجمل في الإطار الأكبري',abjLead:'الحساب العربي يختبر الصيغتين المثبتتين بالأحرف العربية: (رافي الحجي) و(رافي الحاجي). الجمل الكبير والصغير يُعرضان كحساب حرفي قابل لإعادة الإنتاج، لا كتنبؤ.',big:'الجمل الكبير',small:'الجمل الصغير',other:'أنظمة أخرى للتجربة مستقبلاً',otherLead:'الجيماتريا العبرية التقليدية، الإيزوبسيفي اليوناني، وكاتابايادي الهندي تتطلب كتابة الاسم فعلياً بأبجدية النظام قبل الحساب. لن نفرض تهجئة تلقائية.',rule:'قاعدة المختبر',ruleText:'كل نتيجة تحفظ الصيغة الدقيقة للاسم، الأبجدية، جدول القيم وطريقة الحساب. تغيير حرف واحد قد يغيّر النتيجة.'},
en:{title:'Number & Letter Systems Lab',lead:'An independent calculation node. The fixed tested spellings are Rafy Alhajji and Rafi Alhaji in Latin script, and رافي الحجي and رافي الحاجي in Arabic script. Numeric coincidence is a comparison tool, not evidence of prophetic identity.',gem:'Gematrix · Latin form',gemLead:'We use the fixed Latin form Rafy Alhajji and keep Gematrix’s three ciphers separate.',jew:'Jewish / Hebrew Latin cipher',eng:'English ×6',simple:'Simple A1Z26',abj:'Arabic abjad · Ibn Arabi framework',abjLead:'The Arabic calculations use both documented Arabic-script forms: (رافي الحجي) and (رافي الحاجي). Large and small abjad are reproducible letter calculations, not prophecy.',big:'Large abjad',small:'Small abjad',other:'Other systems for future trials',otherLead:'Traditional Hebrew gematria, Greek isopsephy and Indian Katapayadi require the name to be deliberately written in the relevant script before calculation. No automatic spelling is imposed.',rule:'Lab rule',ruleText:'Every result keeps the exact spelling, script, value table and calculation method. One changed letter can change the result.'},
nl:{title:'Lab voor namen, letters en getallen',lead:'Een zelfstandige rekenmodule. De enige naam die nu wordt getest is Rafy Alhajji. Een numerieke overeenkomst is een vergelijkingsmiddel, geen bewijs van profetische identiteit.',gem:'Gematrix · Latijnse vorm',gemLead:'We gebruiken de vaste Latijnse vorm Rafy Alhajji en houden de drie Gematrix-cijfersystemen gescheiden.',jew:'Jewish / Hebrew Latijnse cipher',eng:'English ×6',simple:'Simple A1Z26',abj:'Arabisch abjad · kader bij Ibn Arabi',abjLead:'De enige Arabische bronvorm voor deze berekening is (رافي الحجي). Groot en klein abjad zijn reproduceerbare letterberekeningen, geen profetie.',big:'Groot abjad',small:'Klein abjad',other:'Andere systemen voor latere proeven',otherLead:'Traditionele Hebreeuwse gematria, Griekse isopsefie en Indiase Katapayadi vereisen een bewuste spelling in het betreffende schrift. Er wordt geen automatische spelling opgelegd.',rule:'Regel van het lab',ruleText:'Elke uitkomst bewaart de exacte spelling, het schrift, de waardetabel en de rekenmethode. Eén gewijzigde letter kan de uitkomst veranderen.'},
jv:{title:'Laboratorium Jeneng, Aksara lan Angka',lead:'Simpul petungan mandiri. Jeneng siji-sijine sing saiki diuji yaiku Rafy Alhajji. Pepadhan angka mung piranti mbandhingake, dudu bukti identitas ramalan.',gem:'Gematrix · wujud Latin',gemLead:'Kita nganggo wujud Latin tetep Rafy Alhajji lan misahake telung cipher Gematrix.',jew:'Cipher Latin Jewish / Hebrew',eng:'English ×6',simple:'Simple A1Z26',abj:'Abjad Arab · kerangka Ibn Arabi',abjLead:'Wujud sumber Arab siji-sijine kanggo petungan iki yaiku (رافي الحجي). Abjad gedhe lan cilik minangka petungan aksara sing bisa dibaleni, dudu ramalan.',big:'Abjad gedhe',small:'Abjad cilik',other:'Sistem liyane kanggo uji sabanjure',otherLead:'Gematria Ibrani tradisional, isopsephy Yunani lan Katapayadi India mbutuhake jeneng ditulis kanthi sengaja ing aksara sing cocog. Ora ana ejaan otomatis sing dipaksa.',rule:'Aturan laboratorium',ruleText:'Saben asil nyimpen ejaan persis, aksara, tabel nilai lan cara petungan. Owah siji aksara bisa ngganti asil.'},
he:{title:'מעבדת שמות, אותיות ומספרים',lead:'צומת חישובי עצמאי. השם היחיד שנבדק כעת הוא Rafy Alhajji. התאמה מספרית היא כלי השוואתי ולא הוכחה לזהות נבואית.',gem:'Gematrix · צורה לטינית',gemLead:'אנו משתמשים בצורה הלטינית הקבועה Rafy Alhajji ומפרידים בין שלושת הצפנים של Gematrix.',jew:'צופן Latin Jewish / Hebrew',eng:'English ×6',simple:'Simple A1Z26',abj:'אבג׳ד ערבי · מסגרת אבן ערבי',abjLead:'צורת המקור הערבית היחידה לחישוב זה היא (رافي الحجي). האבג׳ד הגדול והקטן הם חישובי אותיות ניתנים לשחזור, לא נבואה.',big:'אבג׳ד גדול',small:'אבג׳ד קטן',other:'שיטות נוספות לניסויים עתידיים',otherLead:'גימטריה עברית מסורתית, איזופספיה יוונית וקטפאיאדי הודי מחייבות כתיבה מכוונת של השם בכתב המתאים. לא נכפית תעתיק אוטומטי.',rule:'כלל המעבדה',ruleText:'כל תוצאה שומרת את האיות המדויק, הכתב, טבלת הערכים ושיטת החישוב. שינוי אות אחת עשוי לשנות את התוצאה.'}}
const GJ={a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,i:9,j:600,k:10,l:20,m:30,n:40,o:50,p:60,q:70,r:80,s:90,t:100,u:200,v:700,w:900,x:300,y:400,z:500};
const A1=Object.fromEntries('abcdefghijklmnopqrstuvwxyz'.split('').map((c,i)=>[c,i+1]));
const ABJ={ا:1,ب:2,ج:3,د:4,ه:5,و:6,ز:7,ح:8,ط:9,ي:10,ك:20,ل:30,م:40,ن:50,س:60,ع:70,ف:80,ص:90,ق:100,ر:200,ش:300,ت:400,ث:500,خ:600,ذ:700,ض:800,ظ:900,غ:1000};
function sum(t,m){return [...t.toLowerCase()].reduce((a,c)=>a+(m[c]||0),0)}
function render(){const l=(window.LuxLang&&LuxLang.get())||'en',d=COPY[l]||COPY.en;const name='Rafy Alhajji',simp=sum(name,A1),j=sum(name,GJ),eng=simp*6,ar='رافي الحجي';const big=sum(ar,ABJ),small=[...ar].reduce((a,c)=>{let v=ABJ[c]||0;return a+(v?((v-1)%9)+1:0)},0);document.getElementById('lab').innerHTML=`<section class="lab-card"><div class="lux-kicker">LUXDOT · NUMERICAL & LETTER SYSTEMS</div><h1>${d.title}</h1><p>${d.lead}</p></section><section class="lab-card"><h2>${d.gem}</h2><p>${d.gemLead}</p><div class="formula">Rafy Alhajji</div><div class="lab-grid"><div class="metric">${d.jew}<b>${j}</b></div><div class="metric">${d.eng}<b>${eng}</b></div><div class="metric">${d.simple}<b>${simp}</b></div></div></section><section class="lab-card"><h2>${d.abj}</h2><p>${d.abjLead}</p><div class="lab-grid"><div class="metric">${d.big}<b>${big}</b></div><div class="metric">${d.small}<b>${small}</b></div></div></section><section class="lab-card secondary"><h2>${d.other}</h2><p>${d.otherLead}</p></section><section class="lab-card method-note"><b>${d.rule}</b><p>${d.ruleText}</p></section>`}
document.addEventListener('DOMContentLoaded',render);document.addEventListener('luxlang',render);
</script><script defer src="site-quality.js?v=4329"></script><script src="site-shell.js?v=4344"></script></body></html>
