<script>
(()=>{try{
 const u=new URL(location.href);
 if(window.top===window.self && u.searchParams.get('luxembed')!=='1' && !u.pathname.endsWith('/player-shell.html')){
   const here=u.pathname.replace(/^\//,'')+u.search+u.hash;
   location.replace('/player-shell.html?page='+encodeURIComponent(here));
   return;
 }
 if(window.top!==window.self){
   const send=()=>{
     try{
       const u=new URL(location.href);
       u.searchParams.delete('luxembed');
       parent.postMessage({type:'luxdot:navigate',url:u.pathname.replace(/^\//,'')+u.search+u.hash},location.origin);
     }catch(e){}
   };
   addEventListener('load',send,{once:true});
 }
}catch(e){}})();
</script>

<script>
const COPY={
ar:{title:'مختبر الأسماء والأعداد والحروف',lead:'عقدة حسابية مستقلة. صيغ الاسم المثبتة للاختبار، بالترتيب الثابت، هي رافي الحجي، رافي الحاجي، Rafy Alhajji، Rafi Alhaji. تُحسب الصيغ العربية ضمن أنظمة الحروف العربية، واللاتينية ضمن أنظمة الحروف اللاتينية. التطابق العددي أداة مقارنة وليس دليلاً على هوية نبوئية.',gem:'Gematrix للاسم اللاتيني',gemLead:'نستخدم الصيغة اللاتينية الثابتة Rafy Alhajji ونفصل الأنظمة الثلاثة كما يعرضها Gematrix.',jew:'Jewish / Hebrew cipher اللاتيني',eng:'English ×6',simple:'Simple A1Z26',abj:'حساب الجمل في الإطار الأكبري',abjLead:'الحساب العربي يختبر الصيغتين المثبتتين بالأحرف العربية: (رافي الحجي) و(رافي الحاجي). الجمل الكبير والصغير يُعرضان كحساب حرفي قابل لإعادة الإنتاج، لا كتنبؤ.',big:'الجمل الكبير',small:'الجمل الصغير',other:'أنظمة أخرى للتجربة مستقبلاً',otherLead:'الجيماتريا العبرية التقليدية، الإيزوبسيفي اليوناني، وكاتابايادي الهندي تتطلب كتابة الاسم فعلياً بأبجدية النظام قبل الحساب. لن نفرض تهجئة تلقائية.',rule:'قاعدة المختبر',ruleText:'كل نتيجة تحفظ الصيغة الدقيقة للاسم، الأبجدية، جدول القيم وطريقة الحساب. تغيير حرف واحد قد يغيّر النتيجة.'},
en:{title:'Number & Letter Systems Lab',lead:'An independent calculation node. The fixed tested spellings, always kept in this order, are رافي الحجي, رافي الحاجي, Rafy Alhajji, Rafi Alhaji. Arabic forms stay Arabic for Arabic-letter systems; Latin forms stay Latin for Latin-letter systems. Numeric coincidence is a comparison tool, not evidence of prophetic identity.',gem:'Gematrix · Latin form',gemLead:'We use the fixed Latin form Rafy Alhajji and keep Gematrix’s three ciphers separate.',jew:'Jewish / Hebrew Latin cipher',eng:'English ×6',simple:'Simple A1Z26',abj:'Arabic abjad · Ibn Arabi framework',abjLead:'The Arabic calculations use both documented Arabic-script forms: (رافي الحجي) and (رافي الحاجي). Large and small abjad are reproducible letter calculations, not prophecy.',big:'Large abjad',small:'Small abjad',other:'Other systems for future trials',otherLead:'Traditional Hebrew gematria, Greek isopsephy and Indian Katapayadi require the name to be deliberately written in the relevant script before calculation. No automatic spelling is imposed.',rule:'Lab rule',ruleText:'Every result keeps the exact spelling, script, value table and calculation method. One changed letter can change the result.'},
nl:{title:'Lab voor namen, letters en getallen',lead:'Een zelfstandige rekenmodule. De vaste geteste schrijfwijzen, altijd in deze volgorde, zijn رافي الحجي, رافي الحاجي, Rafy Alhajji, Rafi Alhaji. Arabische vormen blijven Arabisch in Arabische lettersystemen; Latijnse vormen blijven Latijns in Latijnse lettersystemen. Numerieke overeenkomst is een vergelijkingsmiddel, geen bewijs van profetische identiteit.',gem:'Gematrix · Latijnse vormen',gemLead:'We berekenen beide vaste Latijnse vormen afzonderlijk en veranderen of vertalen de spelling niet binnen het cijfersysteem.',jew:'Jewish / Hebrew Latijnse cipher',eng:'English ×6',simple:'Simple A1Z26',abj:'Arabisch abjad · kader bij Ibn Arabi',abjLead:'De Arabische berekeningen testen beide vaste vormen afzonderlijk: (رافي الحجي) en (رافي الحاجي). Groot en klein abjad zijn reproduceerbare letterberekeningen, geen profetie.',big:'Groot abjad',small:'Klein abjad',other:'Andere systemen voor latere proeven',otherLead:'Traditionele Hebreeuwse gematria, Griekse isopsefie en Indiase Katapayadi vereisen een bewuste spelling in het betreffende schrift. Er wordt geen automatische spelling opgelegd.',rule:'Regel van het lab',ruleText:'Elke uitkomst bewaart de exacte spelling, het schrift, de waardetabel en de rekenmethode. Eén gewijzigde letter kan de uitkomst veranderen.'},
jv:{title:'Laboratorium Jeneng, Aksara lan Angka',lead:'Simpul petungan mandiri. Jeneng siji-sijine sing saiki diuji yaiku Rafy Alhajji. Pepadhan angka mung piranti mbandhingake, dudu bukti identitas ramalan.',gem:'Gematrix · wujud Latin',gemLead:'Kita nganggo wujud Latin tetep Rafy Alhajji lan misahake telung cipher Gematrix.',jew:'Cipher Latin Jewish / Hebrew',eng:'English ×6',simple:'Simple A1Z26',abj:'Abjad Arab · kerangka Ibn Arabi',abjLead:'Wujud sumber Arab siji-sijine kanggo petungan iki yaiku (رافي الحجي). Abjad gedhe lan cilik minangka petungan aksara sing bisa dibaleni, dudu ramalan.',big:'Abjad gedhe',small:'Abjad cilik',other:'Sistem liyane kanggo uji sabanjure',otherLead:'Gematria Ibrani tradisional, isopsephy Yunani lan Katapayadi India mbutuhake jeneng ditulis kanthi sengaja ing aksara sing cocog. Ora ana ejaan otomatis sing dipaksa.',rule:'Aturan laboratorium',ruleText:'Saben asil nyimpen ejaan persis, aksara, tabel nilai lan cara petungan. Owah siji aksara bisa ngganti asil.'},
he:{title:'מעבדת שמות, אותיות ומספרים',lead:'צומת חישובי עצמאי. השם היחיד שנבדק כעת הוא Rafy Alhajji. התאמה מספרית היא כלי השוואתי ולא הוכחה לזהות נבואית.',gem:'Gematrix · צורה לטינית',gemLead:'אנו משתמשים בצורה הלטינית הקבועה Rafy Alhajji ומפרידים בין שלושת הצפנים של Gematrix.',jew:'צופן Latin Jewish / Hebrew',eng:'English ×6',simple:'Simple A1Z26',abj:'אבג׳ד ערבי · מסגרת אבן ערבי',abjLead:'צורת המקור הערבית היחידה לחישוב זה היא (رافي الحجي). האבג׳ד הגדול והקטן הם חישובי אותיות ניתנים לשחזור, לא נבואה.',big:'אבג׳ד גדול',small:'אבג׳ד קטן',other:'שיטות נוספות לניסויים עתידיים',otherLead:'גימטריה עברית מסורתית, איזופספיה יוונית וקטפאיאדי הודי מחייבות כתיבה מכוונת של השם בכתב המתאים. לא נכפית תעתיק אוטומטי.',rule:'כלל המעבדה',ruleText:'כל תוצאה שומרת את האיות המדויק, הכתב, טבלת הערכים ושיטת החישוב. שינוי אות אחת עשוי לשנות את התוצאה.'}}
const GJ={a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,i:9,j:600,k:10,l:20,m:30,n:40,o:50,p:60,q:70,r:80,s:90,t:100,u:200,v:700,w:900,x:300,y:400,z:500};
const A1=Object.fromEntries('abcdefghijklmnopqrstuvwxyz'.split('').map((c,i)=>[c,i+1]));
const ABJ={ا:1,ب:2,ج:3,د:4,ه:5,و:6,ز:7,ح:8,ط:9,ي:10,ك:20,ل:30,م:40,ن:50,س:60,ع:70,ف:80,ص:90,ق:100,ر:200,ش:300,ت:400,ث:500,خ:600,ذ:700,ض:800,ظ:900,غ:1000};
function sum(t,m){return [...t.toLowerCase()].reduce((a,c)=>a+(m[c]||0),0)}
function minorAbjad(name){return [...name].reduce((a,c)=>{let v=ABJ[c]||0;return a+(v?((v-1)%9)+1:0)},0)}
function fixedChip(name,lang){return `<span translate="no" lang="${lang}" style="display:inline-block;border:1px solid #b9964b88;border-radius:999px;padding:5px 9px;margin:3px;unicode-bidi:isolate">${name}</span>`}
function render(){const l=(window.LuxLang&&LuxLang.get())||'en',d=COPY[l]||COPY.en;const latin=['Rafy Alhajji','Rafi Alhaji'],arabic=['رافي الحجي','رافي الحاجي'];const latinRows=latin.map(name=>{const simp=sum(name,A1),j=sum(name,GJ);return `<div class="lab-card secondary"><div class="formula">${fixedChip(name,'en')}</div><div class="lab-grid"><div class="metric">${d.jew}<b>${j}</b></div><div class="metric">${d.eng}<b>${simp*6}</b></div><div class="metric">${d.simple}<b>${simp}</b></div></div></div>`}).join('');const arRows=arabic.map(name=>`<div class="lab-card secondary"><div class="formula">${fixedChip(name,'ar')}</div><div class="lab-grid"><div class="metric">${d.big}<b>${sum(name,ABJ)}</b></div><div class="metric">${d.small}<b>${minorAbjad(name)}</b></div></div></div>`).join('');document.getElementById('lab').innerHTML=`<section class="lab-card"><div class="lux-kicker">LUXDOT · NUMERICAL & LETTER SYSTEMS</div><h1>${d.title}</h1><p>${d.lead}</p><div>${fixedChip('رافي الحجي','ar')}${fixedChip('رافي الحاجي','ar')}${fixedChip('Rafy Alhajji','en')}${fixedChip('Rafi Alhaji','en')}</div></section><section class="lab-card"><h2>${d.gem}</h2><p>${d.gemLead}</p>${latinRows}</section><section class="lab-card"><h2>${d.abj}</h2><p>${d.abjLead}</p>${arRows}</section><section class="lab-card secondary"><h2>${d.other}</h2><p>${d.otherLead}</p></section><section class="lab-card method-note"><b>${d.rule}</b><p>${d.ruleText}</p></section>`} 
document.addEventListener('DOMContentLoaded',render);document.addEventListener('luxlang',render);
</script><script defer src="site-quality.js?v=4377"></script><script src="site-shell.js?v=41837"></script><script defer src="luxdot-radio.js?v=41819b"></script><script defer src="content-language-core.js?v=41837"></script><script src="luxdot-typography-density.js?v=41416"></script>
