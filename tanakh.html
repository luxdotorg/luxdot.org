<nav class="nav"><a href="home.html" data-t="home"></a><span data-t="discover"></span><a href="library.html" data-t="library"></a><span data-t="living"></span><span data-t="projects"></span><span data-t="participate"></span><button class="lang" data-lang>ع</button></nav></div></header>
<main class="sacred-page">
<section class="sacred-card">
<div class="sacred-kicker" data-t="selectedPassage"></div>
<h1 data-t="tanakhTitle"></h1>
<p class="sacred-lead" data-t="tanakhLead"></p>
<div class="sacred-kicker" data-t="proverbs623"></div>
<div class="hebrew" lang="he">כִּי נֵר מִצְוָה וְתוֹרָה אוֹר וְדֶרֶךְ חַיִּים תּוֹכְחוֹת מוּסָר</div>
<div class="sacred-translation">For the commandment is a lamp, and the Torah is light; and reproofs of discipline are the way of life.</div>
<div class="sacred-kicker" style="margin-top:22px" data-t="lightWay"></div>
<div class="intro-note" data-t="introWillPlay"></div>
<div class="intro-player">
<button id="listen" type="button">▶ <span data-t="listenPassage"></span></button>
<button id="stop" type="button" data-t="stopIntro"></button>
</div>
<div class="audio-msg" id="msg"></div>
<audio id="tanakhAudio" preload="metadata" src="https://archive.org/download/the_book_of_proverbs_asv_ss_librivox/proverbs_2_asv_64kb.mp3"></audio>
</section>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const audio=document.getElementById("tanakhAudio"),listen=document.getElementById("listen"),stop=document.getElementById("stop"),msg=document.getElementById("msg");
 let timer=null,started=false,stopAt=145;
 function start(){
   if(started && !audio.paused){return}
   const go=()=>{
     // Track begins at Proverbs 6. Cue near verse 23.
     if(audio.duration && audio.currentTime<100) audio.currentTime=118;
     const p=audio.play();
     if(p&&p.then)p.then(()=>{started=true;msg.textContent=""}).catch(()=>{msg.textContent=t("autoplayBlocked")});
   };
   if(audio.readyState>=1)go(); else audio.addEventListener("loadedmetadata",go,{once:true});
 }
 listen.addEventListener("click",start);
 stop.addEventListener("click",()=>{audio.pause();msg.textContent=""});
 audio.addEventListener("timeupdate",()=>{if(audio.currentTime>=stopAt){audio.pause();}});
 timer=setTimeout(start,5000);
});
</script>
</body></html>
