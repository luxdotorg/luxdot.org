:"Een van de invloedrijkste moderne Sefardische/Mizrachi halachische autoriteiten, met sterke nadruk op Maran Karo."},"jv":{"title":"Ovadia Yosef","sub":"Baghdad → Yerusalem · Yabia Omer","lead":"Otoritas halakha modern sing penting, nguwatake rujukan marang Maran Karo."},"he":{"title":"הרב עובדיה יוסף","sub":"בגדאד → ירושלים · יביע אומר · מרן","lead":"מגדולי פוסקי הספרדים והמזרחים בעת החדשה, עם דגש על פסיקת מרן רבי יוסף קארו ואיסוף רחב של מקורות."}},"img":"assets/jewish-research/ovadia-yosef.jpg","credit":"Rabbi Ovadia Yosef · CC BY-SA 2.5 · Wikimedia Commons","extra":[["ar","مشروعه الفقهي","من أبرز شعارات منهجه العملي تقوية العودة إلى أحكام «ماران» يوسف كارو في أرض إسرائيل، مع responsa موسوعية مثل Yabia Omer وYechaveh Da’at."],["ar","لا تختزل الرجل بالسياسة","كان أيضاً شخصية سياسية وروحية مؤثرة عبر شاس، لكن عقدة LuxDot تفصل الأحكام الفقهية عن المواقف السياسية والخطب الجدلية."]],"sources":[["Sefaria · Yitzhak Yosef topic / lineage context","https://www.sefaria.org/topics/yitzhak-yosef"],["Jewish Virtual Library · Yitzhak Yosef and Ovadia method","https://www.jewishvirtuallibrary.org/yitzhak-yosef"]],"related":[["sephardic-halakha.html","سلسلة الهالاخاه"],["yitzhak-yosef.html","يتسحاق يوسف"],["sephardic-continuity-ovadia-yitzhak.html","عوفاديا → يتسحاق"]],"extra_i18n":{"en":[["His halakhic project","A major feature of his practical method was strengthening recourse to the rulings of “Maran” Joseph Karo in the Land of Israel, alongside encyclopedic responsa such as Yabia Omer and Yechaveh Da’at."],["Do not reduce him to politics","He was also an influential political and spiritual figure through Shas, but LuxDot separates halakhic rulings from political positions and controversial sermons."]],"nl":[["Zijn halachische project","Een belangrijk kenmerk van zijn praktische methode was het versterken van de terugkeer naar de uitspraken van “Maran” Joseph Karo in het Land Israël, naast encyclopedische responsa zoals Yabia Omer en Yechaveh Da’at."],["Beperk hem niet tot politiek","Hij was via Shas ook een invloedrijke politieke en spirituele figuur, maar LuxDot scheidt halachische uitspraken van politieke standpunten en controversiële preken."]]},"related_i18n":{"en":["Sephardic Halakha","Yitzhak Yosef","Ovadia → Yitzhak Yosef · Sephardic Continuity"],"nl":["Sefardische halacha","Yitzhak Yosef","Ovadia → Yitzhak Yosef · Sefardische continuïteit"]}};</script><script defer src="jewish-research-page.js?v=4390"></script><script src="site-shell.js?v=43109"></script><script src="hebrew-research-overlay.js?v=4399"></script><script defer src="luxdot-radio.js?v=43105"></script></body></html>
