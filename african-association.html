ar:{dir:'rtl',k:'LUXDOT / رحلات المعرفة / بحث حي 011',title:'الجمعية الإفريقية',sub:'من رسم الفراغ على الخرائط إلى سؤال: من يملك المعرفة؟',status:'1788–1831 · لندن',intro:'تأسست «جمعية تشجيع اكتشاف الأجزاء الداخلية من إفريقيا» في لندن سنة 1788، وعُرفت باسم الجمعية الإفريقية. موّلت رحلات هدفها عند الأوروبيين فهم داخل القارة، مسار نهر النيجر وموقع تمبكتو. لكنها تكشف أيضاً مشكلة معرفية أساسية: الخرائط الأوروبية كانت فارغة حيث كانت توجد بالفعل مجتمعات وطرق تجارة ومدارس وعلماء ومسافرون محليون.',h1:'لماذا تأسست؟',p1:'نشأت الجمعية في بيئة عصر التنوير وبدعم شخصيات مثل جوزيف بانكس. جمعت الفضول الجغرافي والعلمي مع مصالح التجارة والقوة البريطانية. لذلك لا نقرأها في LuxDot كجمعية علمية بريئة تماماً ولا كأداة استعمارية خالصة؛ بل كمؤسسة تتقاطع فيها المعرفة والتجارة والسياسة.',h2:'المشكلة المعرفية: «المجهول»',p2:'تمبكتو والنيجر لم يكونا مجهولين لسكان غرب إفريقيا أو التجار والعلماء المسلمين. كان الجهل أوروبياً. هذه التفرقة مهمة لأنها تمنع تحويل غياب المعلومة في أرشيف قوة معينة إلى غياب للمعرفة البشرية نفسها.',h3:'النيجر وتمبكتو',p3:'كان تحديد مجرى النيجر والوصول إلى تمبكتو من أهم الأهداف. موّلت الجمعية رحالة مثل مونغو بارك، ثم بوركهارت. لم يصل بوركهارت إلى تمبكتو؛ مات أثناء الإعداد. وفي العقود التالية أصبحت هذه الرحلات جزءاً من التوسع الأوروبي في إنتاج الخرائط والمعرفة عن إفريقيا.',h4:'من الجمعية إلى الجغرافيا المؤسسية',p4:'أرشيف كامبريدج يوثق الجمعية منذ تأسيسها سنة 1788، وفي 1831 اندمجت تقاليدها ومؤسسات أخرى في تأسيس الجمعية الجغرافية الملكية. هذا يربط مغامرات الأفراد بتحول أكبر: المعرفة الجغرافية أصبحت مؤسسة وشبكة أرشيف ونشر وتمويل.',h5:'صلة بوركهارت',p5:'بوركهارت مثال ممتاز على أن الرحلة إلى «داخل إفريقيا» مرّت أولاً عبر تعلم الشرق الأوسط. العربية وحلب والحجاز والنوبة والبتراء لم تكن انحرافات عن مهمته؛ كانت جزءاً من بناء القدرة على السفر في شبكات عربية وإسلامية كان يفترض أن يعتمد عليها للوصول غرباً.',h6:'اختبار LuxDot',p6:'كلما وجدنا كلمة «اكتشاف» نضيف سؤالاً إلزامياً: من كان يعرف المكان قبل المكتشف؟ ومن دوّن المعرفة؟ ومن امتلك القدرة على طبع الخريطة ونشرها؟ هكذا نفصل بين اكتشاف شخصي، وإدخال معلومة إلى مؤسسة أوروبية، ووجود المعرفة عند المجتمعات المحلية.',tags:['1788','جوزيف بانكس','النيجر','تمبكتو','مونغو بارك','بوركهارت','الخرائط','التجارة','المعرفة الاستعمارية'],sources:'مصادر مختارة'},
en:{dir:'ltr',k:'LUXDOT / KNOWLEDGE JOURNEYS / LIVING RESEARCH 011',title:'The African Association',sub:'From blank spaces on European maps to the question: who owns knowledge?',status:'1788–1831 · London',intro:'The Association for Promoting the Discovery of the Interior Parts of Africa was founded in London in 1788 and became known as the African Association. It funded journeys intended, from a European perspective, to clarify Africa’s interior, the course of the Niger and the location of Timbuktu. It also exposes a basic knowledge problem: European maps were blank where communities, trade routes, schools, scholars and local travellers already existed.',h1:'Why was it founded?',p1:'The Association emerged from Enlightenment-era geographical curiosity and was supported by figures including Joseph Banks. Scientific inquiry coexisted with British commercial and strategic interests. LuxDot therefore treats it neither as a purely innocent learned society nor as a single-purpose colonial instrument, but as an institution where knowledge, trade and power intersected.',h2:'The knowledge problem: “unknown”',p2:'Timbuktu and the Niger were not unknown to West African communities or Muslim traders and scholars. The ignorance was European. This distinction matters because absence from one power’s archive is not absence from human knowledge.',h3:'The Niger and Timbuktu',p3:'Tracing the Niger and reaching Timbuktu were central goals. The Association supported travellers including Mungo Park and later Burckhardt. Burckhardt never reached Timbuktu; he died during preparation. Over the following decades such expeditions became part of Europe’s expanding apparatus for mapping and producing knowledge about Africa.',h4:'From club to institutional geography',p4:'Cambridge archives document the Association from its 1788 foundation. By 1831 its tradition and other geographical bodies fed into the founding of the Royal Geographical Society. Individual journeys thus belong to a wider transformation: geography becoming an institution of archives, publication, funding and authority.',h5:'The Burckhardt link',p5:'Burckhardt shows that a journey toward the “African interior” first passed through deep learning in the Middle East. Arabic, Aleppo, the Hijaz, Nubia and Petra were not simply detours; they built the linguistic and cultural capacity he expected to use along Arab and Muslim networks toward the west.',h6:'LuxDot test',p6:'Whenever a source says “discovery,” we add a mandatory question: who knew the place before the discoverer? Who recorded the knowledge? Who had the power to print the map and circulate it? This separates personal discovery, entry into a European institution, and prior local knowledge.',tags:['1788','Joseph Banks','Niger','Timbuktu','Mungo Park','Burckhardt','mapping','trade','colonial knowledge'],sources:'Selected sources'},
nl:{dir:'ltr',k:'LUXDOT / KENNISREIZEN / LEVEND ONDERZOEK 011',title:'De African Association',sub:'Van lege plekken op Europese kaarten naar de vraag: van wie is kennis?',status:'1788–1831 · Londen',intro:'De Association for Promoting the Discovery of the Interior Parts of Africa werd in 1788 in Londen opgericht en werd bekend als de African Association. Ze financierde reizen die vanuit Europees perspectief het Afrikaanse binnenland, de loop van de Niger en de ligging van Timboektoe moesten verduidelijken. Tegelijk toont ze een fundamenteel kennisprobleem: Europese kaarten waren leeg waar al gemeenschappen, handelsroutes, scholen, geleerden en lokale reizigers bestonden.',h1:'Waarom werd zij opgericht?',p1:'De Association ontstond uit geografische nieuwsgierigheid van de Verlichting en kreeg steun van figuren als Joseph Banks. Wetenschappelijke belangstelling liep samen met Britse handels- en machtsbelangen. LuxDot leest haar daarom niet als louter onschuldige wetenschap en ook niet als één enkel koloniaal instrument, maar als een instelling waarin kennis, handel en macht samenkwamen.',h2:'Het kennisprobleem: “onbekend”',p2:'Timboektoe en de Niger waren niet onbekend voor West-Afrikaanse gemeenschappen of islamitische handelaren en geleerden. De onwetendheid was Europees. Ontbreken in het archief van één macht betekent niet ontbreken uit menselijke kennis.',h3:'De Niger en Timboektoe',p3:'De loop van de Niger en het bereiken van Timboektoe waren kerndoelen. De Association steunde reizigers zoals Mungo Park en later Burckhardt. Burckhardt bereikte Timboektoe nooit; hij stierf tijdens de voorbereiding. Zulke expedities werden later onderdeel van het groeiende Europese systeem voor kaarten en kennisproductie over Afrika.',h4:'Van club naar institutionele geografie',p4:'De Cambridge-archieven documenteren de Association vanaf 1788. In 1831 droegen haar traditie en andere geografische organisaties bij aan de vorming van de Royal Geographical Society. Individuele reizen horen dus bij een grotere verandering: geografie werd een institutioneel systeem van archief, publicatie, financiering en gezag.',h5:'De koppeling met Burckhardt',p5:'Burckhardt toont dat een tocht naar het “Afrikaanse binnenland” eerst door diep leren in het Midden-Oosten liep. Arabisch, Aleppo, de Hidjaz, Nubië en Petra waren niet enkel omwegen; ze bouwden de taal- en cultuurvaardigheid die hij op Arabische en islamitische netwerken richting westen wilde gebruiken.',h6:'LuxDot-test',p6:'Wanneer een bron “ontdekking” zegt, stellen we verplicht: wie kende de plaats vóór de ontdekker? Wie legde de kennis vast? Wie had de macht om de kaart te drukken en te verspreiden? Zo scheiden we persoonlijke ontdekking, opname in een Europese instelling en reeds bestaande lokale kennis.',tags:['1788','Joseph Banks','Niger','Timboektoe','Mungo Park','Burckhardt','cartografie','handel','koloniale kennis'],sources:'Geselecteerde bronnen'},
jv:{dir:'ltr',k:'LUXDOT / LELAKON KAWRUH / PANLITEN URIP 011',title:'African Association',sub:'Saka papan kosong ing peta Eropa menyang pitakon: sapa sing nduweni kawruh?',status:'1788–1831 · London',intro:'Association for Promoting the Discovery of the Interior Parts of Africa didegake ing London taun 1788 lan dikenal minangka African Association. Organisasi iki mbiayai lelungan kanggo mangerteni pedalaman Afrika, aliran Kali Niger lan panggonan Timbuktu saka sudut pandang Eropa. Nanging iki uga nuduhake masalah kawruh: peta Eropa kosong ing papan sing sejatine wis ana masyarakat, jalur dagang, sekolah, ulama lan wong lelungan lokal.',h1:'Napa organisasi iki didegake?',p1:'African Association tuwuh saka rasa kepengin ngerti geografis jaman Pencerahan lan didhukung tokoh kaya Joseph Banks. Panliten ilmiah urip bebarengan karo kepentingan dagang lan strategi Inggris. Mula LuxDot ora maca organisasi iki minangka ilmu murni utawa mung alat kolonial, nanging minangka papan ketemune kawruh, dagang lan kuwasa.',h2:'Masalah kawruh: “ora dikenal”',p2:'Timbuktu lan Niger ora asing kanggo masyarakat Afrika Kulon utawa pedagang lan sarjana Muslim. Sing ora ngerti yaiku Eropa. Ora ana informasi ing arsip siji kekuwatan ora ateges kawruh manungsa uga ora ana.',h3:'Niger lan Timbuktu',p3:'Nggoleki aliran Niger lan tekan Timbuktu dadi tujuan utama. Association ndhukung wong lelungan kaya Mungo Park lan banjur Burckhardt. Burckhardt ora tau tekan Timbuktu amarga seda nalika persiapan. Ing dekade sabanjure ekspedisi kaya iki dadi bagean saka sistem Eropa kanggo nggambar peta lan ngasilake kawruh babagan Afrika.',h4:'Saka klub menyang geografi institusional',p4:'Arsip Cambridge nyathet organisasi iki wiwit 1788. Ing 1831 tradisi lan jaringan geografis liyane mlebu ing proses laire Royal Geographical Society. Dadi lelungan pribadi nyambung karo owah-owahan gedhe: geografi dadi institusi arsip, penerbitan, pendanaan lan wewenang.',h5:'Sambungan karo Burckhardt',p5:'Burckhardt nuduhake yen perjalanan menyang “pedalaman Afrika” kudu liwat sinau jero ing Timur Tengah. Basa Arab, Aleppo, Hijaz, Nubia lan Petra dudu mung dalan muter; kabeh dadi latihan basa lan budaya kanggo nggunakake jaringan Arab lan Islam menyang kulon.',h6:'Tes LuxDot',p6:'Saben sumber ngomong “nemokake”, kita kudu takon: sapa sing wis ngerti papan iku sadurunge? Sapa sing nulis kawruhe? Sapa sing nduweni daya kanggo nyithak lan nyebarake peta? Iki misahake pengalaman nemokake pribadi, mlebu menyang institusi Eropa, lan kawruh lokal sing wis ana.',tags:['1788','Joseph Banks','Niger','Timbuktu','Mungo Park','Burckhardt','peta','dagang','kawruh kolonial'],sources:'Sumber pilihan'},
he:{dir:'rtl',k:'LUXDOT / מסעות ידע / מחקר חי 011',title:'האגודה האפריקאית',sub:'מהשטחים הריקים במפות אירופיות אל השאלה: למי שייך הידע?',status:'1788–1831 · לונדון',intro:'האגודה לקידום גילוי חלקיה הפנימיים של אפריקה נוסדה בלונדון בשנת 1788 ונודעה בשם “האגודה האפריקאית”. היא מימנה מסעות שנועדו, מנקודת מבט אירופית, להבהיר את גאוגרפיית פנים אפריקה, את מהלך הניז׳ר ואת מיקומה של טימבוקטו. היא גם חושפת בעיית ידע בסיסית: מפות אירופיות היו ריקות במקומות שבהם כבר התקיימו קהילות, נתיבי מסחר, בתי לימוד, מלומדים ונוסעים מקומיים.',h1:'מדוע נוסדה?',p1:'האגודה צמחה מסקרנות גאוגרפית של עידן הנאורות וקיבלה תמיכה מדמויות ובהן ג׳וזף בנקס. חקירה מדעית התקיימה לצד אינטרסים מסחריים ואסטרטגיים בריטיים. לכן LuxDot אינו מציג אותה כחברה מדעית תמימה לחלוטין וגם לא ככלי קולוניאלי חד-תכליתי, אלא כמוסד שבו ידע, מסחר וכוח נפגשו.',h2:'בעיית הידע: “לא נודע”',p2:'טימבוקטו והניז׳ר לא היו בלתי ידועים לקהילות מערב אפריקה או לסוחרים ולמלומדים מוסלמים. הבורות הייתה אירופית. היעדר מידע מארכיון של מעצמה אחת אינו היעדר מן הידע האנושי.',h3:'הניז׳ר וטימבוקטו',p3:'מיפוי מהלך הניז׳ר והגעה לטימבוקטו היו מטרות מרכזיות. האגודה תמכה בנוסעים כגון מונגו פארק ובהמשך בורקהרדט. בורקהרדט לא הגיע לטימבוקטו ומת בזמן ההכנה. בעשורים הבאים נעשו מסעות כאלה חלק מן המנגנון האירופי המתרחב למיפוי ולייצור ידע על אפריקה.',h4:'ממועדון לגאוגרפיה מוסדית',p4:'ארכיוני קיימברידג׳ מתעדים את האגודה מאז 1788. בשנת 1831 המסורת שלה וגופים גאוגרפיים אחרים השתלבו בתהליך הקמת החברה הגאוגרפית המלכותית. מסעות יחידים הם לכן חלק משינוי גדול יותר: הגאוגרפיה נעשתה מוסד של ארכיון, פרסום, מימון וסמכות.',h5:'הקשר לבורקהרדט',p5:'בורקהרדט מראה שמסע אל “פנים אפריקה” עבר תחילה דרך למידה עמוקה במזרח התיכון. ערבית, חלב, החיג׳אז, נוביה ופטרה לא היו רק סטיות מן הדרך; הן בנו את היכולת הלשונית והתרבותית שאותה התכוון להשתמש ברשתות ערביות ואסלאמיות בדרך מערבה.',h6:'מבחן LuxDot',p6:'בכל פעם שמקור אומר “גילוי”, אנו מוסיפים שאלה חובה: מי הכיר את המקום לפני המגלה? מי תיעד את הידע? למי הייתה היכולת להדפיס את המפה ולהפיצה? כך אנו מפרידים בין גילוי אישי, הכנסת מידע למוסד אירופי וידע מקומי קודם.',tags:['1788','ג׳וזף בנקס','ניז׳ר','טימבוקטו','מונגו פארק','בורקהרדט','מיפוי','מסחר','ידע קולוניאלי'],sources:'מקורות נבחרים'}};
