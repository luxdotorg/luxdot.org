<link rel="stylesheet" href="luxdot-research-experience-v4150.css?v=4150"></head><body data-lux-i18n-complete="1"><header class="top"><div class="wrap topin"><a class="logo" data-lux-brand href="home.html">LuxDot</a><nav class="nav"><a data-t="home" href="home.html"></a><a data-t="research" href="research.html"></a><a data-t="faith" href="faith.html"></a><select class="lang lang-select" data-lang-select><option value="ar">العربية</option><option value="en">English</option><option value="nl">Nederlands</option><option value="he">עברית</option><option value="jv">Basa Jawa</option><option value="id">Bahasa Indonesia</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option><option value="tr">Türkçe</option></select></nav></div></header><main class="jr" id="jr"></main><script>window.JR_PAGE={"slug":"gematria-method-lab","data":{"ar":{"title":"مختبر الجيماتريا وحساب الحروف","sub":"Gematria · Abjad · Isopsephy · طرق متعددة · سجل قابل لإعادة الحساب","lead":"مختبر منهجي يمنع انتقاء النتائج. كل حساب يجب أن يسجل النص الأصلي، نظام الكتابة، التطبيع، طريقة القيمة، الحروف المستبعدة أو المضافة، والنتيجة. تطابق رقمي لا يصبح دلالة تاريخية أو لاهوتية إلا إذا كان النظام سابقاً للنتيجة وله سند نصي مستقل."},"en":{"title":"Gematria & Letter-Number Method Lab","sub":"Gematria · Abjad · Isopsephy · reproducible calculations","lead":"A reproducibility lab for letter-number calculations. Every result records spelling, script, normalization, valuation method and transformations before interpretation."},"nl":{"title":"Gematria & letter-getal laboratorium","sub":"reproduceerbare berekeningen","lead":"Een reproduceerbaarheidslab voor letter-getalberekeningen. Elk resultaat legt spelling, schrift, normalisatie, waarderingsmethode en transformaties vast vóór de interpretatie."},"jv":{"title":"Lab Gematria lan angka-aksara","sub":"pitungan bisa diulang","lead":"Lab metode supaya asil angka ora dipilih sakarepe."},"he":{"title":"מעבדת גימטריה וחישובי אותיות","sub":"שיטות מתועדות וניתנות לשחזור","lead":"כל חישוב מתעד כתיב, נרמול, שיטת ערכים וטרנספורמציות לפני פירוש."}},"img":"assets/jewish-research/maimonides.jpg","credit":"LuxDot Jewish Research · source-linked study node","extra":[["ar","بروتوكول LuxDot للحساب","1) ثبّت التهجئة الأصلية. 2) اذكر الأبجدية. 3) اختر النظام قبل الحساب. 4) لا تبدّل التهجئة بحثاً عن رقم مطلوب. 5) اعرض كل البدائل المعقولة. 6) قِس عدد الاختبارات التي أُجريت. 7) صنّف النتيجة: تقليدية / نصية / استكشافية / مصادفة محتملة."],["ar","أنظمة يجب فصلها","Gematria العبرية القياسية ليست هي Mispar Katan أو Milui، وليست أبجد العربية، وليست isopsephy اليونانية. وضع الأرقام في جدول واحد دون ذكر النظام ينتج تطابقات مضللة."],["ar","اختبار الدلالة","بعد التطابق نسأل: هل ذكر مصدر قديم هذا الربط؟ هل التهجئة ثابتة تاريخياً؟ هل الرقم اختير قبل البحث؟ كم صيغة اختبرنا؟ هل توجد كلمات كثيرة أخرى بالقيمة نفسها؟ بهذه الأسئلة تتحول المصفوفة من لعبة أرقام إلى بحث قابل للنقد."]],"sources":[["Chabad · What Is Gematria?","https://www.chabad.org/library/article_cdo/aid/5541252/jewish/What-Is-Gematria.htm"],["Cambridge · History of Kabbalah · gematria context","https://www.cambridge.org/core/books/history-of-kabbalah/premodern-and-modern-kabbalah/C10281BEA7D017E80DBC01A6F9F974E0"],["Cambridge · numerology of divine names","https://www.cambridge.org/core/journals/harvard-theological-review/article/counting-on-gods-name-the-numerology-of-nomina-sacra/0BCF68076A22C4DCD5AE71C9277D9D7E"]],"related":[["name-date-matrix.html","مصفوفة الاسم والتاريخ"],["maimonides-letters-numbers.html","ابن ميمون والحروف"],["abulafia-letters-names.html","أبو العافية"],["ibn-arabi-abulafia-comparison.html","المصفوفة المقارنة"]],"extra_i18n":{"en":[["LuxDot calculation protocol","1) Fix the original spelling. 2) State the alphabet. 3) Choose the system before calculating. 4) Do not alter spelling to chase a desired number. 5) Show all reasonable variants. 6) Record how many tests were run. 7) Classify the result as traditional / textual / exploratory / possible coincidence."],["Systems that must stay separate","Standard Hebrew gematria is not Mispar Katan or Milui, and it is not Arabic abjad or Greek isopsephy. Putting outputs in one table without naming the system creates misleading matches."],["Significance test","After a match, ask: did an older source make this link? Is the spelling historically stable? Was the target number chosen before the search? How many variants were tested? How many unrelated words share the value? These questions turn a number matrix into research that can be criticized."]],"nl":[["LuxDot-rekenprotocol","1) Leg de oorspronkelijke spelling vast. 2) Vermeld het alfabet. 3) Kies het systeem vóór de berekening. 4) Verander de spelling niet om een gewenst getal te vinden. 5) Toon alle redelijke varianten. 6) Noteer hoeveel tests zijn uitgevoerd. 7) Classificeer het resultaat als traditioneel / tekstueel / verkennend / mogelijk toeval."],["Systemen die gescheiden moeten blijven","Standaard Hebreeuwse gematria is niet Mispar Katan of Milui, en ook niet Arabische abjad of Griekse isopsefie. Uitkomsten in één tabel zetten zonder het systeem te noemen creëert misleidende overeenkomsten."],["Betekenistoets","Na een overeenkomst vragen we: maakte een oudere bron deze koppeling? Is de spelling historisch stabiel? Was het doelgetal vóór de zoektocht gekozen? Hoeveel varianten zijn getest? Hoeveel andere woorden delen dezelfde waarde? Zo wordt een getallenmatrix toetsbaar onderzoek."]]},"related_i18n":{"en":["Name & Date Matrix","Maimonides · Letters & Numbers","Abraham Abulafia · Letters & Divine Names","Ibn Arabi × Abraham Abulafia"],"nl":["Naam- en datummatrix","Maimonides · letters & getallen","Abraham Abulafia · letters & godsnamen","Ibn Arabi × Abraham Abulafia"]}};</script><script defer src="jewish-research-page.js?v=4392"></script><script src="site-shell.js?v=4185"></script><script src="hebrew-research-overlay.js?v=4399"></script><script defer src="luxdot-radio.js?v=4184"></script
