mystical experience, letters, names, numerology and prophecy."},"nl":{"title":"Ibn Arabi × Abulafia × Maimonides × Hallaj","sub":"vergelijkingsmatrix","lead":"Een vergelijkingsmatrix die automatische claims van directe invloed vermijdt en recht, filosofie, mystieke ervaring, letters, namen, numerologie en profetie afzonderlijk behandelt."},"jv":{"title":"Ibn Arabi × Abulafia × Maimonides × Hallaj","sub":"matriks perbandingan","lead":"Perbandingan tanpa nganggep pengaruh langsung."},"he":{"title":"אבן ערבי × אבולעפיה × הרמב״ם × אל־חלאג׳","sub":"מטריצה השוואתית","lead":"השוואה בין חוק, פילוסופיה, מיסטיקה, אותיות, שמות ונבואה בלי להניח השפעה ישירה."}},"img":"assets/jewish-research/maimonides.jpg","credit":"LuxDot Jewish Research · source-linked study node","extra":[["ar","محور 1 · الحرف والاسم","ابن عربي وأبو العافية يستحقان المقارنة الأقوى هنا. أما ابن ميمون فيدخل كمرجع فلسفي/لغوي وقانوني، لا كصاحب منظومة جيماتريا مماثلة."],["ar","محور 2 · الشريعة والتصوف","الحلاج يمثل تجربة صوفية ومصطلحات رمزية مختلفة؛ ابن عربي يبني منظومة ميتافيزيقية واسعة؛ ابن ميمون يبني تقنيناً وفلسفة عقلانية؛ أبو العافية يبني طريقاً نبوياً لغوياً. التشابه يجب أن يقاس على محور محدد لا بكلمة «صوفي» فقط."],["ar","محور 3 · الأرقام","الجيماتريا ليست مرادفاً لكل علم يربط الحروف بالأرقام. نقارن: أبجد العربي، gematria العبرية، isopsephy اليونانية، طرق מילוי/מספר קטן/מספר הכרחי، ثم نسجل طريقة الحساب قبل تسجيل أي تطابق."]],"sources":[["Stanford · Arabic and Islamic influence on Judaic thought","https://plato.stanford.edu/entries/arabic-islamic-judaic/"],["Brill · Jewish, Christian and Muslim mystics in the 13th century","https://brill.com/display/book/edcoll/9789004188501/B9789004188501_016.pdf"],["Cambridge · Abulafia and Maimonides context","https://www.cambridge.org/core/books/cambridge-history-of-judaism/spiritual-and-intellectual-history/1CBD796EF3BCA4D9335FD7A947DDF4C2"]],"related":[["abulafia-letters-names.html","أبو العافية"],["maimonides-letters-numbers.html","ابن ميمون والحروف"],["hallaj.html","الحلاج"],["mahdi-matrix.html","ابن عربي/مصفوفة المهدي"],["gematria-method-lab.html","مختبر الحسابات"]],"extra_i18n":{"en":[["Axis 1 · letter and name","Ibn Arabi and Abraham Abulafia deserve the strongest comparison here. Maimonides enters as a philosophical, linguistic and legal reference, not as the author of a comparable gematria system."],["Axis 2 · law and mysticism","al-Hallaj represents a distinct mystical experience and symbolic vocabulary; Ibn Arabi builds a broad metaphysical system; Maimonides builds a legal code and rationalist philosophy; Abulafia builds a linguistic-prophetic path. Similarity must be measured on a named axis, not by the word “mystic” alone."],["Axis 3 · numbers","Gematria is not a synonym for every system that links letters and numbers. LuxDot compares Arabic abjad, Hebrew gematria, Greek isopsephy and methods such as Milui, Mispar Katan and Mispar Hechrechi, recording the method before recording any match."]],"nl":[["As 1 · letter en naam","Ibn Arabi en Abraham Abulafia verdienen hier de sterkste vergelijking. Maimonides komt binnen als filosofische, taalkundige en juridische referentie, niet als auteur van een vergelijkbaar gematriasysteem."],["As 2 · recht en mystiek","al-Hallaj staat voor een andere mystieke ervaring en symbolische woordenschat; Ibn Arabi bouwt een brede metafysica; Maimonides een juridische codificatie en rationalistische filosofie; Abulafia een taalkundig-profetische weg. Overeenkomst moet op een benoemde as worden gemeten, niet alleen via het woord “mystiek”."],["As 3 · getallen","Gematria is geen synoniem voor elk systeem dat letters en getallen koppelt. LuxDot vergelijkt Arabische abjad, Hebreeuwse gematria, Griekse isopsefie en methoden zoals Milui, Mispar Katan en Mispar Hechrechi, en registreert de methode vóór een eventuele overeenkomst."]]},"related_i18n":{"en":["Abraham Abulafia · Letters & Divine Names","Maimonides · Letters & Numbers","al-Hallaj","Mahdi Matrix","Gematria Method Lab"],"nl":["Abraham Abulafia · letters & godsnamen","Maimonides · letters & getallen","al-Hallaj","Mahdi-matrix","Gematria-methodenlab"]}};</script><script defer src="jewish-research-page.js?v=4392"></script><script src="site-shell.js?v=43109"></script><script src="hebrew-research-overlay.js?v=4399"></script><script defer src="luxdot-radio.js?v=43105"></script></body></html>
