<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="LuxDot — living research, memory and knowledge.">
<meta name="robots" content="noindex,follow">
<title>LuxDot</title>
<link rel="stylesheet" href="luxdot-radio.css?v=41819b">
<link rel="stylesheet" href="luxdot-cosmic-site-v41827.css?v=41827">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050706}
#luxdot-site-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050706}
</style>
</head>
<body>
<iframe id="luxdot-site-frame" title="LuxDot" allow="autoplay; fullscreen"></iframe>
<script>
(()=>{
 'use strict';
 const frame=document.getElementById('luxdot-site-frame');
 const supported=['ar','en','nl','he','jv','id','fr','es','de','tr'];
 const DEFAULT='ar';
 const rtl=new Set(['ar','he']);
 const root=new URL('/',location.origin);
 const initialShellUrl=new URL(location.href);
 const initialQs=initialShellUrl.searchParams;
 const directNative=new Set(['home.html','research.html','projects.html','memory.html','library.html','faith.html','humanity.html','media.html','audiovisual.html','praxis.html','kids-galaxy.html']);
 const validLang=l=>supported.includes(l)?l:null;
 const langFromRaw=raw=>{try{return validLang(new URL('/'+safePage(raw),root).searchParams.get('lang'))}catch(e){return null}};
 const shellLang=raw=>langFromRaw(raw)||validLang(initialQs.get('lang'))||validLang(localStorage.getItem('luxdot.lang'))||DEFAULT;
 const safePage=(raw)=>{
   try{
     const u=new URL(raw||'index.html',root);
     if(u.origin!==location.origin)return 'index.html';
     let p=u.pathname.replace(/^\/+/, '')||'index.html';
     if(p==='player-shell.html')p='index.html';
     u.searchParams.delete('luxembed');
     return p+(u.search||'')+(u.hash||'');
   }catch(e){return 'index.html'}
 };
 const pagePath=(raw)=>{try{return new URL('/'+safePage(raw),root).pathname.replace(/^\//,'')}catch(e){return 'index.html'}};
 const isDirectNative=(raw)=>directNative.has(pagePath(raw));
 const publicUrl=(raw)=>{
   const u=new URL('/'+safePage(raw),root);u.searchParams.delete('luxembed');
   if(!u.searchParams.has('lang'))u.searchParams.set('lang',shellLang(raw));
   return u.pathname+u.search+u.hash;
 };
 const embedded=(raw)=>{
   const u=new URL('/'+safePage(raw),root);u.searchParams.set('luxembed','1');
   if(!u.searchParams.has('lang'))u.searchParams.set('lang',shellLang(raw));
   return u.pathname+u.search+u.hash;
 };
 const exitToDirect=(raw)=>location.replace(publicUrl(raw));
 const syncDocumentMeta=()=>{
   try{
     const doc=frame.contentDocument;if(!doc)return;if(doc.title)document.title=doc.title;
     const l=validLang((doc.documentElement.lang||'').toLowerCase())||shellLang(current);
     document.documentElement.lang=l;document.documentElement.dir=doc.documentElement.dir||(rtl.has(l)?'rtl':'ltr');localStorage.setItem('luxdot.lang',l);
   }catch(e){}
 };
 let current=safePage(initialQs.get('page')||'index.html');
 const initialLang=shellLang(current);localStorage.setItem('luxdot.lang',initialLang);document.documentElement.lang=initialLang;document.documentElement.dir=rtl.has(initialLang)?'rtl':'ltr';
 if(isDirectNative(current)){exitToDirect(current);return;}
 frame.src=embedded(current);
 history.replaceState({luxdotShell:true,page:current},'',publicUrl(current));
 frame.addEventListener('load',syncDocumentMeta);
 addEventListener('message',e=>{
   if(e.origin!==location.origin||e.source!==frame.contentWindow||!e.data||e.data.type!=='luxdot:navigate')return;
   const next=safePage(e.data.url);const innerLang=langFromRaw(next);if(innerLang)localStorage.setItem('luxdot.lang',innerLang);
   if(isDirectNative(next)){exitToDirect(next);return;}
   if(next===current){syncDocumentMeta();return;}current=next;history.pushState({luxdotShell:true,page:current},'',publicUrl(current));syncDocumentMeta();
 });
 addEventListener('popstate',e=>{
   const next=e.state&&e.state.luxdotShell&&e.state.page?safePage(e.state.page):safePage(location.pathname+location.search+location.hash);
   if(isDirectNative(next)){exitToDirect(next);return;}if(next===current)return;current=next;frame.src=embedded(current);
 });
})();
</script>
<script defer src="luxdot-radio.js?v=41819b"></script>
</body>
</html>
