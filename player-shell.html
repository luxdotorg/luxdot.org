<!doctype html>
<html lang="nl">
<head>
<meta name="description" content="LuxDot — a LuxDot living research, memory and knowledge page.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuxDot</title>
<link rel="stylesheet" href="luxdot-radio.css?v=41819b">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050706}
#luxdot-site-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050706}
</style>
<link rel="stylesheet" href="luxdot-cosmic-site-v41827.css?v=41827">
</head>
<body>
<iframe id="luxdot-site-frame" title="LuxDot" allow="autoplay; fullscreen"></iframe>
<script>
(()=>{
 const frame=document.getElementById('luxdot-site-frame');
 const qs=new URLSearchParams(location.search);
 const supported=['ar','en','nl','he','jv','id','fr','es','de','tr'];
 const shellLang=()=>{const l=qs.get('lang')||localStorage.getItem('luxdot.lang')||'en';return supported.includes(l)?l:'en'};
 const safePage=(raw)=>{
   try{
     const u=new URL(raw||'index.html',location.href);
     if(u.origin!==location.origin)return 'index.html';
     const p=u.pathname.replace(/^\//,'');
     return p+(u.search||'')+(u.hash||'');
   }catch(e){return 'index.html'}
 };
 const embedded=(raw)=>{
   const u=new URL(safePage(raw),location.href);
   u.searchParams.set('luxembed','1');
   if(!u.searchParams.has('lang'))u.searchParams.set('lang',shellLang());
   return u.pathname.replace(/^\//,'')+u.search+u.hash;
 };
 let current=safePage(qs.get('page')||'index.html');
 frame.src=embedded(current);

 addEventListener('message',e=>{
   if(e.source!==frame.contentWindow||!e.data||e.data.type!=='luxdot:navigate')return;
   const next=safePage(e.data.url);
   if(next===current)return;
   current=next;
   const u=new URL(location.href);
   u.searchParams.set('page',next);
   const innerLang=new URL(next,location.href).searchParams.get('lang');
   if(supported.includes(innerLang)){u.searchParams.set('lang',innerLang);localStorage.setItem('luxdot.lang',innerLang)}
   history.pushState({page:next},'',u.pathname+u.search);
 });
 addEventListener('popstate',()=>{
   current=safePage(new URLSearchParams(location.search).get('page')||'index.html');
   frame.src=embedded(current);
 });
})();
</script>
<script defer src="luxdot-radio.js?v=41819b"></script>
</body>
</html>
