<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="LuxDot — living research, memory and knowledge.">
<meta name="robots" content="noindex,follow">
<title>LuxDot</title>
<link rel="stylesheet" href="luxdot-radio.css?v=41819b">
<link rel="stylesheet" href="luxdot-cosmic-site-v41827.css?v=41827">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050706}
#luxdot-site-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050706}
</style>
</head>
<body>
<iframe id="luxdot-site-frame" title="LuxDot" allow="autoplay; fullscreen"></iframe>
<script>
(()=>{
 'use strict';
 const frame=document.getElementById('luxdot-site-frame');
 const supported=['ar','en','nl','he','jv','id','fr','es','de','tr'];
 const rtl=new Set(['ar','he']);
 const root=new URL('/',location.origin);
 const initialShellUrl=new URL(location.href);
 const initialQs=initialShellUrl.searchParams;
 const directNative=new Set(['home.html','research.html','projects.html','memory.html']);

 const shellLang=()=>{
   const l=initialQs.get('lang')||localStorage.getItem('luxdot.lang')||'en';
   return supported.includes(l)?l:'en';
 };

 const safePage=(raw)=>{
   try{
     const u=new URL(raw||'index.html',root);
     if(u.origin!==location.origin)return 'index.html';
     let p=u.pathname.replace(/^\/+/, '')||'index.html';
     if(p==='player-shell.html')p='index.html';
     u.searchParams.delete('luxembed');
     return p+(u.search||'')+(u.hash||'');
   }catch(e){return 'index.html'}
 };

 const pagePath=(raw)=>{
   try{return new URL('/'+safePage(raw),root).pathname.replace(/^\//,'')}catch(e){return 'index.html'}
 };

 const isDirectNative=(raw)=>directNative.has(pagePath(raw));

 const publicUrl=(raw)=>{
   const u=new URL('/'+safePage(raw),root);
   u.searchParams.delete('luxembed');
   return u.pathname+u.search+u.hash;
 };

 const embedded=(raw)=>{
   const u=new URL('/'+safePage(raw),root);
   u.searchParams.set('luxembed','1');
   if(!u.searchParams.has('lang'))u.searchParams.set('lang',shellLang());
   return u.pathname+u.search+u.hash;
 };

 const exitToDirect=(raw)=>{
   location.replace(publicUrl(raw));
 };

 const syncDocumentMeta=()=>{
   try{
     const doc=frame.contentDocument;
     if(!doc)return;
     if(doc.title)document.title=doc.title;
     const lang=(doc.documentElement.lang||shellLang()).toLowerCase();
     if(supported.includes(lang)){
       document.documentElement.lang=lang;
       document.documentElement.dir=doc.documentElement.dir|| (rtl.has(lang)?'rtl':'ltr');
       localStorage.setItem('luxdot.lang',lang);
     }
   }catch(e){}
 };

 let current=safePage(initialQs.get('page')||'index.html');

 // Phase B: primary navigation surfaces no longer run inside the iframe shell.
 if(isDirectNative(current)){
   exitToDirect(current);
   return;
 }

 frame.src=embedded(current);

 // The compatibility shell remains the running document for pages not yet
 // migrated, while the address bar exposes the actual LuxDot page.
 history.replaceState({luxdotShell:true,page:current},'',publicUrl(current));

 frame.addEventListener('load',syncDocumentMeta);

 addEventListener('message',e=>{
   if(e.origin!==location.origin||e.source!==frame.contentWindow||!e.data||e.data.type!=='luxdot:navigate')return;
   const next=safePage(e.data.url);
   const innerLang=new URL('/'+next,root).searchParams.get('lang');
   if(supported.includes(innerLang))localStorage.setItem('luxdot.lang',innerLang);
   if(isDirectNative(next)){
     exitToDirect(next);
     return;
   }
   if(next===current){syncDocumentMeta();return;}
   current=next;
   history.pushState({luxdotShell:true,page:current},'',publicUrl(current));
   syncDocumentMeta();
 });

 addEventListener('popstate',e=>{
   const next=e.state&&e.state.luxdotShell&&e.state.page
     ? safePage(e.state.page)
     : safePage(location.pathname+location.search+location.hash);
   if(isDirectNative(next)){
     exitToDirect(next);
     return;
   }
   if(next===current)return;
   current=next;
   frame.src=embedded(current);
 });
})();
</script>
<script defer src="luxdot-radio.js?v=41819b"></script>
</body>
</html>
