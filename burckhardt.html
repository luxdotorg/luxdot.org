ar:{dir:'rtl',k:'LUXDOT / رحلات المعرفة / بحث حي 010',title:'يوهان لودفيغ بوركهارت',sub:'اللغة كجواز عبور · من بازل إلى حلب والبتراء والحجاز والنوبة',status:'الحالة: بحث موثق · قابل للتوسعة',intro:'لم تكن مهمة بوركهارت أن «يكتشف البتراء» فقط. أُعدّ أصلاً لمهمة أكبر لصالح الجمعية الإفريقية: الوصول إلى داخل إفريقيا ومحاولة بلوغ تمبكتو. لذلك تعلم العربية، عاش سنوات في المشرق باسم الشيخ إبراهيم بن عبد الله، وسافر عبر سوريا والأردن ومصر والحجاز والنوبة. موته في القاهرة سنة 1817 أنهى مهمته الإفريقية قبل تنفيذها.',h1:'الخط التاريخي',timeline:['1784 · وُلد في لوزان ونشأ في بازل.','1809 · ارتبط بالجمعية الإفريقية وبدأ إعداداً لغوياً وميدانياً لمهمة إفريقية طويلة.','1809–1812 · أقام في حلب ودرس العربية والعادات والفقه والمجتمع المحلي، وسافر في سوريا.','22 أغسطس 1812 · دخل وادي موسى ودوّن آثار البتراء التي تعرّف إليها بوصفها المدينة القديمة.','1813 · وصل إلى النوبة وسجل أبو سمبل ضمن رحلاته في وادي النيل.','1814–1815 · أدى الحج إلى مكة وزار المدينة، وترك وصفاً واسعاً للحجاز.','1817 · توفي في القاهرة قبل أن تنطلق القافلة التي كان ينتظرها نحو الغرب الإفريقي وتمبكتو.'],h2:'ما الذي يجعل بوركهارت مهماً لـ LuxDot؟',p2:'قصته نموذج واضح لانتقال المعرفة عبر اللغة. لم يدخل البيئات التي درسها كمراقب يحمل خريطة جاهزة فحسب؛ أمضى سنوات يتعلم اللغة وأنماط الحياة حتى صار قادراً على السفر داخل شبكات محلية. هذا لا يلغي علاقة مهمته بالمشروع الأوروبي للاستكشاف، لكنه يجعل «اللغة → الثقة → الوصول → المعرفة» سلسلة قابلة للدراسة.',h3:'البتراء: إعادة تعرّف أوروبية، لا اكتشاف من العدم',p3:'البتراء كانت معروفة لسكان وادي موسى والمنطقة. الأدق أن بوركهارت أعاد تعريف الموقع أمام المعرفة الأوروبية الحديثة سنة 1812. حتى طريقته في الوصول تكشف حدود المعرفة: دخل بحجة تقديم قربان عند مقام هارون، ولم يستطع إجراء مسح طويل خوفاً من إثارة الشبهات.',h4:'الإسلام والحج',p4:'استخدم بوركهارت هوية «الشيخ إبراهيم بن عبد الله»، ودرس الإسلام والعربية بعمق وأدى الحج. في LuxDot نسجل ما هو موثق عن ممارساته ورحلته، ولا نستنتج من ذلك حكماً قطعياً على إيمانه الداخلي؛ الهوية الدينية الشخصية تختلف عن الكفاءة الثقافية والسلوك الظاهر.',h5:'المهمة التي لم تكتمل: تمبكتو',p5:'كان الهدف النهائي الذي أعدته له الجمعية الإفريقية هو الوصول إلى غرب إفريقيا وتمبكتو ودراسة مسار النيجر. لكنه ظل في القاهرة ينتظر فرصة مناسبة، ثم مات بالزحار سنة 1817. المفارقة البحثية: أشهر إنجازاته جاءت خلال «التحضير» للمهمة التي لم ينجزها.',h6:'طبقة نقدية',p6:'لغة المصادر الأوروبية القديمة تستخدم «الاكتشاف» و«المناطق المجهولة». في هذا البحث نحدد دائماً: مجهولة لمن؟ فالبتراء وتمبكتو والنيجر كانت جزءاً من معارف وشبكات محلية وإسلامية وتجارية قبل وصول الرحالة الأوروبيين.',links:'روابط داخل شبكة LuxDot',tags:['الجمعية الإفريقية','حلب','البتراء','الحج','مكة','النوبة','تمبكتو','اللغة','انتقال المعرفة'],sources:'مصادر مختارة'},
en:{dir:'ltr',k:'LUXDOT / KNOWLEDGE JOURNEYS / LIVING RESEARCH 010',title:'Johann Ludwig Burckhardt',sub:'Language as passage · from Basel to Aleppo, Petra, Arabia and Nubia',status:'Status: documented research · open to expansion',intro:'Burckhardt’s mission was much larger than the later fame of Petra. The African Association prepared him for an attempt to reach the African interior and Timbuktu. He learned Arabic, spent years in the Levant as Sheikh Ibrahim ibn Abdallah, and travelled through Syria, Jordan, Egypt, the Hijaz and Nubia. His death in Cairo in 1817 ended the African mission before it could begin.',h1:'Historical line',timeline:['1784 · Born in Lausanne and raised in Basel.','1809 · Engaged by the African Association and began linguistic and field preparation for an African expedition.','1809–1812 · Based in Aleppo, studying Arabic, customs, religion and local society while travelling in Syria.','22 August 1812 · Entered Wadi Musa and recorded the ruins he identified as ancient Petra.','1813 · Travelled in Nubia and recorded Abu Simbel during his Nile journeys.','1814–1815 · Performed the pilgrimage to Mecca and visited Medina, producing extensive observations of the Hijaz.','1817 · Died in Cairo before the caravan route he awaited toward West Africa and Timbuktu became available.'],h2:'Why Burckhardt matters to LuxDot',p2:'His story is a strong case study in knowledge transfer through language. He did not merely arrive with a European map; he spent years learning language and social codes so he could move within local networks. That does not remove the European exploration framework behind his mission, but it makes language → trust → access → knowledge a researchable chain.',h3:'Petra: European re-identification, not creation of knowledge',p3:'Petra was known to the people of Wadi Musa and the region. A more precise formulation is that Burckhardt re-identified the site for modern European scholarship in 1812. His access method also shows the limits of outsider knowledge: he used a stated wish to sacrifice at Aaron’s tomb and could not conduct a long survey without raising suspicion.',h4:'Islam and pilgrimage',p4:'Burckhardt travelled under the identity “Sheikh Ibrahim ibn Abdallah,” studied Arabic and Islam intensively, and performed the Hajj. LuxDot records the documented practices and journey without claiming certainty about his private inner belief; personal faith is not identical to cultural competence or outward practice.',h5:'The unfinished mission: Timbuktu',p5:'The African Association’s ultimate plan was for him to reach West Africa and Timbuktu and investigate the Niger. He waited in Cairo for a viable caravan and died of dysentery in 1817. The research paradox is striking: his most famous contributions emerged during preparation for the mission he never completed.',h6:'Critical layer',p6:'Older European sources speak of “discovery” and “unknown interiors.” This dossier always asks: unknown to whom? Petra, Timbuktu and the Niger belonged to local, Islamic and commercial knowledge systems long before European travellers arrived.',links:'Links inside the LuxDot graph',tags:['African Association','Aleppo','Petra','Hajj','Mecca','Nubia','Timbuktu','language','knowledge transfer'],sources:'Selected sources'},
nl:{dir:'ltr',k:'LUXDOT / KENNISREIZEN / LEVEND ONDERZOEK 010',title:'Johann Ludwig Burckhardt',sub:'Taal als doorgang · van Bazel naar Aleppo, Petra, Arabië en Nubië',status:'Status: gedocumenteerd onderzoek · open voor uitbreiding',intro:'Burckhardts opdracht was veel groter dan zijn latere faam rond Petra. De African Association bereidde hem voor op een poging het Afrikaanse binnenland en Timboektoe te bereiken. Hij leerde Arabisch, verbleef jarenlang in de Levant als sjeik Ibrahim ibn Abdallah en reisde door Syrië, Jordanië, Egypte, de Hidjaz en Nubië. Zijn dood in Caïro in 1817 maakte een einde aan de Afrikaanse missie voordat die kon beginnen.',h1:'Historische lijn',timeline:['1784 · Geboren in Lausanne en opgegroeid in Bazel.','1809 · Verbonden aan de African Association en begonnen met taal- en veldvoorbereiding voor een Afrikaanse expeditie.','1809–1812 · Verbleef in Aleppo, studeerde Arabisch, gewoonten, religie en samenleving en reisde in Syrië.','22 augustus 1812 · Betreedt Wadi Musa en documenteert de ruïnes die hij als het oude Petra herkent.','1813 · Reist door Nubië en beschrijft Abu Simbel tijdens zijn Nijlexpedities.','1814–1815 · Verricht de hadj naar Mekka en bezoekt Medina; laat uitvoerige observaties over de Hidjaz na.','1817 · Sterft in Caïro voordat de karavaanroute naar West-Afrika en Timboektoe beschikbaar komt.'],h2:'Waarom Burckhardt relevant is voor LuxDot',p2:'Zijn verhaal is een sterke casus voor kennisoverdracht via taal. Hij kwam niet alleen met een Europese kaart; hij investeerde jaren in taal en sociale codes om zich binnen lokale netwerken te kunnen bewegen. Dat neemt het Europese exploratiekader niet weg, maar maakt taal → vertrouwen → toegang → kennis tot een onderzoekbare keten.',h3:'Petra: Europese heridentificatie, geen kennis uit het niets',p3:'Petra was bekend bij de bewoners van Wadi Musa en de regio. Preciezer is dat Burckhardt de plaats in 1812 opnieuw identificeerde voor de moderne Europese wetenschap. Ook zijn toegang toont de grenzen van buitenstaanderskennis: hij zei een offer bij het graf van Aäron te willen brengen en kon geen langdurige survey uitvoeren zonder argwaan te wekken.',h4:'Islam en bedevaart',p4:'Burckhardt reisde als “Sheikh Ibrahim ibn Abdallah”, bestudeerde Arabisch en islam intensief en verrichtte de hadj. LuxDot registreert de gedocumenteerde praktijken en reis zonder zekerheid te claimen over zijn innerlijke geloof.',h5:'De onvoltooide missie: Timboektoe',p5:'Het uiteindelijke plan van de African Association was West-Afrika, Timboektoe en de Niger. Burckhardt wachtte in Caïro op een geschikte karavaan en stierf in 1817 aan dysenterie. Zijn beroemdste bijdragen ontstonden dus tijdens de voorbereiding op een missie die hij nooit voltooide.',h6:'Kritische laag',p6:'Oudere Europese bronnen spreken over “ontdekking” en “onbekend binnenland”. Dit dossier vraagt steeds: onbekend voor wie? Petra, Timboektoe en de Niger maakten al lang deel uit van lokale, islamitische en handelskennis.',links:'Koppelingen in de LuxDot-grafiek',tags:['African Association','Aleppo','Petra','hadj','Mekka','Nubië','Timboektoe','taal','kennisoverdracht'],sources:'Geselecteerde bronnen'},
jv:{dir:'ltr',k:'LUXDOT / LELAKON KAWRUH / PANLITEN URIP 010',title:'Johann Ludwig Burckhardt',sub:'Basa dadi dalan · saka Basel menyang Aleppo, Petra, Arab lan Nubia',status:'Status: panliten kacathet · isih bisa ditambahi',intro:'Tugase Burckhardt luwih amba tinimbang crita misuwur babagan Petra. African Association nyiapake dheweke kanggo nyoba mlebu pedalaman Afrika lan tekan Timbuktu. Dheweke sinau basa Arab, manggon pirang-pirang taun ing Levant nganggo jeneng Syekh Ibrahim ibn Abdallah, lan lelungan liwat Siria, Yordania, Mesir, Hijaz lan Nubia. Seda ing Kairo taun 1817 nggawe misi Afrika ora tau rampung.',h1:'Garis sejarah',timeline:['1784 · Lair ing Lausanne lan gedhe ing Basel.','1809 · Gabung karo African Association lan miwiti persiapan basa lan lapangan kanggo ekspedisi Afrika.','1809–1812 · Manggon ing Aleppo, sinau basa Arab, adat, agama lan urip masyarakat, uga lelungan ing Siria.','22 Agustus 1812 · Mlebu Wadi Musa lan nyathet reruntuhan sing dianggep Petra kuna.','1813 · Lelungan ing Nubia lan nyathet Abu Simbel nalika perjalanan Kali Nil.','1814–1815 · Nindakake haji menyang Mekah lan marani Madinah, banjur nulis pengamatan dawa babagan Hijaz.','1817 · Seda ing Kairo sadurunge karavan menyang Afrika Kulon lan Timbuktu sing dienteni bisa mangkat.'],h2:'Apa pentinge Burckhardt kanggo LuxDot?',p2:'Critane dadi tuladha kuat babagan pindhahing kawruh liwat basa. Dheweke ora mung teka nggawa peta Eropa, nanging ngentekake taun kanggo sinau basa lan tata sosial supaya bisa obah ing jaringan lokal. Iki ora mbusak kerangka eksplorasi Eropa, nanging nuduhake rantai basa → kapercayan → akses → kawruh.',h3:'Petra: diidentifikasi maneh kanggo ilmu Eropa',p3:'Petra wis dingerteni wong Wadi Musa lan masyarakat wilayah kono. Luwih trep yen ujar Burckhardt ngidentifikasi maneh situs kasebut kanggo ilmu Eropa modern ing 1812. Cara mlebu uga nuduhake wates kawruh wong njaba: dheweke nggunakake alesan arep kurban ing makam Harun lan ora bisa nliti suwe amarga wedi dicurigai.',h4:'Islam lan haji',p4:'Burckhardt lelungan nganggo jeneng “Syekh Ibrahim ibn Abdallah”, sinau basa Arab lan Islam kanthi jero, lan nindakake haji. LuxDot nyathet tumindak lan perjalanan sing ana buktine tanpa mesthekake iman batine.',h5:'Misi sing ora rampung: Timbuktu',p5:'Rencana pungkasan African Association yaiku supaya dheweke tekan Afrika Kulon, Timbuktu lan nliti Niger. Dheweke ngenteni karavan ing Kairo, nanging seda amarga disentri ing 1817. Aneh nanging penting: karya paling misuwur metu nalika persiapan kanggo misi sing ora tau rampung.',h6:'Lapisan kritis',p6:'Sumber Eropa lawas kerep nggunakake tembung “nemokake” lan “pedalaman sing ora dikenal”. Panliten iki tansah takon: ora dikenal dening sapa? Petra, Timbuktu lan Niger wis ana ing jaringan kawruh lokal, Islam lan perdagangan sadurunge lelungan Eropa.',links:'Sambungan ing graf LuxDot',tags:['African Association','Aleppo','Petra','haji','Mekah','Nubia','Timbuktu','basa','pindhahing kawruh'],sources:'Sumber pilihan'},
he:{dir:'rtl',k:'LUXDOT / מסעות ידע / מחקר חי 010',title:'יוהאן לודוויג בורקהרדט',sub:'שפה כמעבר · מבזל לחלב, פטרה, חצי האי ערב ונוביה',status:'מצב: מחקר מתועד · פתוח להרחבה',intro:'שליחותו של בורקהרדט הייתה רחבה בהרבה מן הפרסום המאוחר סביב פטרה. האגודה האפריקאית הכשירה אותו לניסיון להגיע אל פנים אפריקה ואל טימבוקטו. הוא למד ערבית, שהה שנים בלבנט בשם שייח׳ אבראהים אבן עבדאללה, ונסע בסוריה, ירדן, מצרים, החיג׳אז ונוביה. מותו בקהיר ב-1817 סיים את המשימה האפריקאית לפני שהחלה בפועל.',h1:'הקו ההיסטורי',timeline:['1784 · נולד בלוזאן וגדל בבזל.','1809 · נקשר לאגודה האפריקאית והחל בהכשרה לשונית ומעשית לקראת מסע באפריקה.','1809–1812 · שהה בחלב, למד ערבית, מנהגים, דת וחברה מקומית ונסע ברחבי סוריה.','22 באוגוסט 1812 · נכנס לוואדי מוסא ותיעד את השרידים שזיהה כפטרה העתיקה.','1813 · נסע בנוביה ותיעד את אבו סימבל במסעותיו לאורך הנילוס.','1814–1815 · ביצע את החג׳ למכה וביקר במדינה, והותיר תיאור נרחב של החיג׳אז.','1817 · מת בקהיר לפני שנפתחה הדרך בשיירה שחיכה לה לעבר מערב אפריקה וטימבוקטו.'],h2:'מדוע בורקהרדט חשוב ל-LuxDot',p2:'סיפורו הוא מקרה מבחן חזק להעברת ידע דרך שפה. הוא לא הגיע רק עם מפה אירופית; הוא השקיע שנים בלימוד שפה וקודים חברתיים כדי לנוע בתוך רשתות מקומיות. הדבר אינו מבטל את מסגרת החקר האירופית של שליחותו, אך הוא הופך את השרשרת שפה → אמון → גישה → ידע לנושא מחקר.',h3:'פטרה: זיהוי מחדש אירופי, לא יצירת ידע מאפס',p3:'פטרה הייתה מוכרת לתושבי ואדי מוסא והאזור. מדויק יותר לומר שבורקהרדט זיהה מחדש את האתר עבור המחקר האירופי המודרני בשנת 1812. גם דרך כניסתו מלמדת על גבולות הידע של זר: הוא הציג רצון להקריב ליד קבר אהרן ולא יכול היה לערוך סקר ממושך בלי לעורר חשד.',h4:'אסלאם ועלייה לרגל',p4:'בורקהרדט נסע בזהות “שייח׳ אבראהים אבן עבדאללה”, למד ערבית ואסלאם לעומק וביצע את החג׳. LuxDot מתעד את המנהגים והמסע הידועים בלי לטעון לוודאות לגבי אמונתו הפנימית.',h5:'המשימה שלא הושלמה: טימבוקטו',p5:'התוכנית הסופית של האגודה האפריקאית הייתה שיגיע למערב אפריקה, לטימבוקטו ולנהר ניז׳ר. הוא המתין בקהיר לשיירה מתאימה ומת מדיזנטריה ב-1817. הפרדוקס המחקרי בולט: תרומותיו המפורסמות ביותר נוצרו בזמן ההכנה למשימה שמעולם לא השלים.',h6:'שכבה ביקורתית',p6:'מקורות אירופיים ישנים מדברים על “גילוי” ועל “פנים לא-נודע”. התיק שואל תמיד: לא-נודע למי? פטרה, טימבוקטו והניז׳ר השתייכו למערכות ידע מקומיות, אסלאמיות ומסחריות זמן רב לפני הגעת נוסעים אירופים.',links:'קישורים בתוך גרף LuxDot',tags:['האגודה האפריקאית','חלב','פטרה','חג׳','מכה','נוביה','טימבוקטו','שפה','העברת ידע'],sources:'מקורות נבחרים'}};
