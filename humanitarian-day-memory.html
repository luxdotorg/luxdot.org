<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="language-core.js?v=4387"></script><link href="styles.css?v=430" rel="stylesheet"><link rel="stylesheet" href="luxdot-ui-lock.css?v=4385"><style>body{background:#020403;color:#edf7ef;margin:0;font-family:Arial,sans-serif}.d{max-width:1100px;margin:auto;padding:34px 22px 90px}.hero,.card{border:1px solid #23402d;border-radius:24px;background:linear-gradient(145deg,#07120b,#020403)}.hero{padding:28px}.tag{font-size:12px;color:#d2b15b;letter-spacing:.08em}.hero h1{font-size:clamp(30px,5vw,60px);margin:.25em 0}.lead{font-size:18px;line-height:1.9;color:#d8e8dd}.heroimg{width:100%;max-height:540px;object-fit:cover;border-radius:18px;margin-top:20px;border:1px solid #2b4934}.credit{font-size:11px;color:#8da497;margin-top:7px}.symbols{display:inline-flex;gap:5px;border:1px solid #31563d;border-radius:999px;padding:7px 12px;margin:8px 0 4px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:22px 0}.card{padding:18px}.card h3,h2{color:#d2b15b}.card p,.timeline p{line-height:1.75}.timeline{border-inline-start:2px solid #31563d;margin:20px 0;padding-inline-start:20px}.timeline article{margin:0 0 18px}.timeline b{color:#d2b15b}.question{border-inline-start:3px solid #d2b15b;padding:16px 20px;background:#09140d;line-height:1.8;border-radius:0 14px 14px 0}.src{display:grid;gap:10px}.src a{display:block;border:1px solid #203a29;border-radius:16px;padding:15px;background:#06100a;text-decoration:none;color:#edf7ef}.src small{display:block;color:#9db1a3;margin-top:5px}.back a{color:#d2b15b;text-decoration:none}.navline{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.navline a{border:1px solid #31563d;border-radius:999px;padding:8px 12px;color:#d8e8dd;text-decoration:none}html[lang=ar] body{font-family:'Noto Kufi Arabic',Arial,sans-serif!important}html[dir=rtl] .question{border-radius:14px 0 0 14px}@media(max-width:650px){.d{padding:20px 14px 70px}.hero{padding:20px}}</style><title>LuxDot Memory</title><link rel="stylesheet" href="luxdot-global-language.css?v=4399"><link rel="stylesheet" href="luxdot-radio.css?v=43105"></head><body><header class="top"><div class="wrap topin"><a class="logo" data-lux-brand href="home.html">LuxDot</a><nav class="nav"><a href="memory.html" data-t="memory"></a><a href="research.html" data-t="research"></a><select class="lang lang-select" data-lang-select></select></nav></div></header><main class="d" id="app"></main><script>const DATA={"ar": {"tag": "LUXDOT · الذاكرة الحية · 19 أغسطس", "title": "19 أغسطس — الذين يساعدون تحت الخطر", "lead": "بدأ اليوم العالمي للعمل الإنساني من جرح محدد: تفجير مقر الأمم المتحدة في فندق القناة ببغداد في 19 أغسطس 2003. قُتل 22 شخصاً وأصيب أكثر من مئة، وأصبح التاريخ لاحقاً يوماً عالمياً للدفاع عن المدنيين والعاملين الإنسانيين.", "cards": [["فندق القناة", "كان الفندق مقراً لعمل الأمم المتحدة في بغداد. أدى التفجير إلى انهيار جزء كبير من المبنى وترك أثراً دائماً في طريقة تفكير الأمم المتحدة بأمن بعثاتها."], ["22 اسماً لا رقماً", "تحفظ الأمم المتحدة أسماء القتلى، ومن بينهم سيرجيو فييرا دي ميلو. الذاكرة هنا للأشخاص ولأسرهم وزملائهم، لا لإحصاء مجرد."], ["من بغداد إلى يوم عالمي", "في 2008 اعتمدت الجمعية العامة القرار 63/139 وحددت 19 أغسطس يوماً عالمياً للعمل الإنساني."], ["إشارة 2026", "رسالة حملة الأمم المتحدة لعام 2026 تركز على الانتقال من القلق إلى المساءلة والعمل لحماية المدنيين والعاملين الإنسانيين."]], "timeline": [["19 أغسطس 2003", "تفجير فندق القناة في بغداد؛ 22 قتيلاً وأكثر من 100 مصاب بحسب الأمم المتحدة."], ["2008", "الجمعية العامة تعتمد اليوم العالمي للعمل الإنساني."], ["19 أغسطس من كل عام", "إحياء ذكرى العاملين الذين قُتلوا أو أُصيبوا أثناء عملهم، والدفاع عن سلامة العمل الإنساني وكرامة المتضررين من الأزمات."]], "q": "من يحمي الذين يحمون الآخرين، وكيف يمكن أن تبقى المساعدة الإنسانية مستقلة وقادرة على الوصول عندما يصبح العامل الإنساني نفسه هدفاً؟", "sections": ["السياق والذاكرة", "خط زمني", "سؤال LuxDot", "المصادر", "العودة إلى الذاكرة"], "credit": "UN Photo / Timothy Sopp — آثار تفجير مقر الأمم المتحدة في بغداد."}, "en": {"tag": "LUXDOT · LIVING MEMORY · 19 AUGUST", "title": "19 August — those who help under threat", "lead": "World Humanitarian Day grew from a specific wound: the bombing of the UN headquarters at Baghdad’s Canal Hotel on 19 August 2003. Twenty-two people were killed and more than 100 injured; the date later became a global day for defending civilians and humanitarian workers.", "cards": [["Canal Hotel", "The hotel served as a UN base in Baghdad. The bombing devastated part of the building and permanently changed how the UN approached field security."], ["22 people, not a number", "The UN memorial preserves the names of those killed, including Sérgio Vieira de Mello. This memory is about people, families and colleagues—not an abstract statistic."], ["From Baghdad to a global day", "In 2008 the General Assembly adopted resolution 63/139, designating 19 August as World Humanitarian Day."], ["The 2026 signal", "The UN’s 2026 campaign message stresses moving from concern toward consequence and action for the protection of civilians and humanitarian personnel."]], "timeline": [["19 August 2003", "Canal Hotel bombing in Baghdad: 22 killed and more than 100 injured, according to the United Nations."], ["2008", "The General Assembly establishes World Humanitarian Day."], ["Every 19 August", "The day honours aid workers killed or injured in service and advocates for humanitarian access, safety and human dignity."]], "q": "Who protects those who protect others, and how can humanitarian assistance remain independent and reachable when aid workers themselves become targets?", "sections": ["Context & memory", "Timeline", "LuxDot question", "Sources", "Back to Memory"], "credit": "UN Photo / Timothy Sopp — aftermath at the UN headquarters in Baghdad."}, "nl": {"tag": "LUXDOT · LEVEND GEHEUGEN · 19 AUGUSTUS", "title": "19 augustus — wie helpt onder gevaar", "lead": "Wereldhumanitaire dag ontstond uit een concrete wond: de bomaanslag op het VN-hoofdkwartier in het Canal Hotel in Bagdad op 19 augustus 2003. Tweeëntwintig mensen kwamen om en meer dan honderd raakten gewond; later werd deze datum een wereldwijde dag voor de bescherming van burgers en hulpverleners.", "cards": [["Canal Hotel", "Het hotel diende als VN-basis in Bagdad. De aanslag verwoestte een deel van het gebouw en veranderde blijvend de veiligheidsaanpak van de VN."], ["22 mensen, geen getal", "Het VN-memorial bewaart de namen van de doden, onder wie Sérgio Vieira de Mello. Het gaat om mensen, families en collega’s, niet om een abstract cijfer."], ["Van Bagdad naar een werelddag", "In 2008 nam de Algemene Vergadering resolutie 63/139 aan en wees 19 augustus aan als Wereldhumanitaire dag."], ["Signaal 2026", "De VN-campagne van 2026 legt nadruk op concrete gevolgen en actie voor de bescherming van burgers en humanitair personeel."]], "timeline": [["19 augustus 2003", "Aanslag op het Canal Hotel in Bagdad: 22 doden en meer dan 100 gewonden volgens de VN."], ["2008", "De Algemene Vergadering stelt Wereldhumanitaire dag in."], ["Elke 19 augustus", "Herdenking van hulpverleners die tijdens hun werk zijn gedood of gewond, en aandacht voor toegang, veiligheid en menselijke waardigheid."]], "q": "Wie beschermt degenen die anderen beschermen, en hoe blijft humanitaire hulp onafhankelijk en bereikbaar wanneer hulpverleners zelf doelwit worden?", "sections": ["Context & herinnering", "Tijdlijn", "LuxDot-vraag", "Bronnen", "Terug naar Geheugen"], "credit": "UN Photo / Timothy Sopp — nasleep bij het VN-hoofdkwartier in Bagdad."}, "jv": {"tag": "LUXDOT · PANGELING URIP · 19 AGUSTUS", "title": "19 Agustus — wong sing nulungi ing bebaya", "lead": "Dina Kamanungsan Donya tuwuh saka tragedi nyata: serangan bom ing markas PBB ing Canal Hotel, Baghdad, tanggal 19 Agustus 2003. Rong puluh loro wong tiwas lan luwih saka satus tatu; tanggal iki banjur dadi dina donya kanggo nglindhungi warga sipil lan pekerja kamanungsan.", "cards": [["Canal Hotel", "Hotel iki dadi basis PBB ing Baghdad. Serangan ngrusak gedhong lan ngganti cara PBB ngatur keamanan misi lapangan."], ["22 wong, dudu angka", "Memorial PBB nyimpen jeneng para korban, kalebu Sérgio Vieira de Mello. Pangeling iki ngenani manungsa, kulawarga lan kanca kerja."], ["Saka Baghdad dadi dina donya", "Ing 2008 Majelis Umum PBB netepake 19 Agustus minangka Dina Kamanungsan Donya."], ["Isyarat 2026", "Kampanye PBB 2026 nekanake tumindak lan tanggung jawab kanggo nglindhungi warga sipil lan pekerja kamanungsan."]], "timeline": [["19 Agustus 2003", "Bom Canal Hotel: 22 tiwas lan luwih saka 100 tatu miturut PBB."], ["2008", "Majelis Umum netepake Dina Kamanungsan Donya."], ["Saben 19 Agustus", "Ngurmati pekerja bantuan sing tiwas utawa tatu lan mbela akses, keamanan lan martabat manungsa."]], "q": "Sapa sing nglindhungi wong sing nglindhungi wong liya nalika pekerja bantuan dhewe dadi sasaran?", "sections": ["Konteks lan pangeling", "Garis wektu", "Pitakon LuxDot", "Sumber", "Bali menyang Pangeling"], "credit": "UN Photo / Timothy Sopp — akibat serangan ing markas PBB ing Baghdad."}, "he": {"tag": "LUXDOT · זיכרון חי · 19 באוגוסט", "title": "19 באוגוסט — המסייעים תחת סכנה", "lead": "יום הסיוע ההומניטרי העולמי צמח מפצע מסוים: הפיגוע במטה האו״ם במלון קנאל בבגדאד ב־19 באוגוסט 2003. 22 בני אדם נהרגו ויותר ממאה נפצעו; התאריך הפך בהמשך ליום עולמי להגנת אזרחים ועובדי סיוע.", "cards": [["מלון קנאל", "המלון שימש בסיס של האו״ם בבגדאד. הפיגוע החריב חלק מן המבנה ושינה לאורך זמן את תפיסת הביטחון של הארגון בשטח."], ["22 בני אדם, לא מספר", "אתר ההנצחה של האו״ם שומר את שמות ההרוגים, ובהם סרג׳יו ויירה דה מלו. הזיכרון הוא של אנשים, משפחות ועמיתים."], ["מבגדאד ליום עולמי", "ב־2008 אימצה העצרת הכללית את החלטה 63/139 וקבעה את 19 באוגוסט כיום הסיוע ההומניטרי העולמי."], ["המסר של 2026", "קמפיין האו״ם לשנת 2026 מדגיש מעבר מדאגה לאחריות ולפעולה להגנת אזרחים ואנשי סיוע."]], "timeline": [["19 באוגוסט 2003", "הפיגוע במלון קנאל: 22 הרוגים ויותר ממאה פצועים לפי האו״ם."], ["2008", "העצרת הכללית קובעת את יום הסיוע ההומניטרי העולמי."], ["בכל 19 באוגוסט", "הנצחת עובדי סיוע שנהרגו או נפצעו וקידום גישה הומניטרית, ביטחון וכבוד האדם."]], "q": "מי מגן על המגינים על אחרים, וכיצד נשמרת עזרה הומניטרית נגישה ועצמאית כאשר עובדי הסיוע עצמם הופכים למטרה?", "sections": ["הקשר וזיכרון", "ציר זמן", "שאלת LuxDot", "מקורות", "חזרה לזיכרון"], "credit": "UN Photo / Timothy Sopp — תוצאות הפיגוע במטה האו״ם בבגדאד."}}; const SOURCES=[["United Nations — World Humanitarian Day", "https://www.un.org/en/observances/humanitarian-day"], ["United Nations — Remember the Fallen", "https://www.un.org/en/memorial/baghdad2003.shtml"], ["UN Department of Safety and Security — history", "https://dss.un.org/About-Us/-History"]]; const IMG="assets/images/memory/canal-hotel-2003.jpg"; const SYMBOLS="\ud83d\udd6f\ufe0f \u271a \u26a0\ufe0f";
function lang(){let q=new URLSearchParams(location.search).get('lang'),s=localStorage.getItem('luxdot.lang');let l=q||s||'ar';return DATA[l]?l:'en'}
function render(){let l=lang(),x=DATA[l],rtl=(l==='ar'||l==='he');document.documentElement.lang=l;document.documentElement.dir=rtl?'rtl':'ltr';document.title=x.title+' · LuxDot';let cards=x.cards.map(c=>`<article class="card"><h3>${c[0]}</h3><p>${c[1]}</p></article>`).join('');let tl=x.timeline.map(t=>`<article><b>${t[0]}</b><p>${t[1]}</p></article>`).join('');let ss=SOURCES.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener"><b>${s[0]}</b></a>`).join('');document.getElementById('app').innerHTML=`<section class="hero"><span class="tag">${x.tag}</span><h1>${x.title}</h1><div class="symbols" aria-label="SLS memory symbols">${SYMBOLS}</div><p class="lead">${x.lead}</p><img class="heroimg" src="${IMG}" alt=""><div class="credit">${x.credit}</div></section><h2>${x.sections[0]}</h2><section class="grid">${cards}</section><h2>${x.sections[1]}</h2><section class="timeline">${tl}</section><h2>${x.sections[2]}</h2><p class="question">${x.q}</p><h2>${x.sections[3]}</h2><div class="src">${ss}</div><div class="navline"><a href="memory.html?lang=${l}">← ${x.sections[4]}</a></div>`}render();</script><script src="site-shell.js?v=43108"></script><script defer src="luxdot-radio.js?v=43105"></script></body></html>
