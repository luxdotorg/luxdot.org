ning of heaven and earth", "nl": "Het begin van hemel en aarde", "id": "Awal langit dan bumi"}, "meaning": {"ar": "تبدأ السردية بظهور كامي أوائل ثم تتوسع إلى أنساب وقصص تكوين الجزر والعالم الإنساني", "en": "The narrative begins with the appearance of early kami and develops into genealogies and stories of the formation of islands and the human world", "nl": "Het verhaal begint met het verschijnen van vroege kami en ontwikkelt zich tot genealogieën en verhalen over de vorming van eilanden en de menselijke wereld", "id": "Narasi dimulai dengan kemunculan kami awal lalu berkembang menjadi silsilah dan kisah pembentukan pulau-pulau serta dunia manusia"}, "context": {"ar": "كوجيكي جُمّع في أوائل القرن الثامن ويُقرأ كسجل أسطوري-تاريخي تأسيسي", "en": "The Kojiki was compiled in the early eighth century and is read as a foundational mytho-historical chronicle", "nl": "De Kojiki werd in het begin van de achtste eeuw samengesteld en wordt gelezen als funderende mythisch-historische kroniek", "id": "Kojiki disusun pada awal abad kedelapan dan dibaca sebagai kronik mitis-historis yang mendasar"}}, {"ref": {"ar": "كوجيكي · إيزاناغي وإيزانامي", "en": "Kojiki · Izanagi and Izanami", "nl": "Kojiki · Izanagi en Izanami", "id": "Kojiki · Izanagi dan Izanami"}, "heading": {"ar": "تكوين الجزر والحدود بين الحياة والموت", "en": "Islands, life, and death", "nl": "Eilanden, leven en dood", "id": "Pulau, kehidupan, dan kematian"}, "meaning": {"ar": "تجمع السردية بين خلق الجزر والولادة والموت والتطهّر، وهي موضوعات ستصبح مهمة في فهم بعض تصورات الطهارة في الشنتو", "en": "The story links island formation, birth, death, and purification—motifs important for understanding later Shinto ideas of purity", "nl": "Het verhaal verbindt eilandvorming, geboorte, dood en zuivering—motieven die belangrijk zijn voor latere shinto-opvattingen over reinheid", "id": "Kisah menghubungkan pembentukan pulau, kelahiran, kematian, dan pemurnian—motif penting untuk memahami gagasan kemurnian dalam Shinto kemudian"},
