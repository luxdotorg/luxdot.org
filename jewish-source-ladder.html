"assets/jewish-research/maimonides.jpg","credit":"LuxDot Jewish Research · reference image","extra":[["ar","الطبقات الأساسية","1) التناخ: نصوص الكتاب العبري. 2) المشناه: تقنين مبكر للتوراة الشفوية. 3) الجمارا/التلمود: نقاش وتحليل للمشناه. 4) الجاؤونيم والريشونيم: مدارس ما بعد التلمود. 5) أعمال تقنين مثل Mishneh Torah وTur وShulchan Arukh. 6) Acharonim وResponsa الحديثة. القبّالاه مسار موازٍ وليست اختصاراً للهالاخاه."],["ar","قاعدة الاستدلال","وجود قول في التلمود لا يعني وحده أنه الحكم النهائي؛ وقد يحسم الفقهاء بين آراء متعددة. لذلك كل عقدة LuxDot يضاف لها وسم: SOURCE / STATUS / DATE / SCHOOL / CONSENSUS."]],"sources":[["Sefaria · Jewish texts library","https://www.sefaria.org/texts"],["Sefaria · Shulchan Arukh","https://www.sefaria.org/texts/Halakhah/Shulchan%20Arukh"]],"related":[["jewish-research-center.html","مركز الأبحاث اليهودية"],["sephardic-halakha.html","سلسلة الهالاخاه"],["talmud-messiah.html","التلمود والمشيح"]],"extra_i18n":{"en":[["Core layers","1) Tanakh: Hebrew Bible. 2) Mishnah: early codification of the Oral Torah. 3) Gemara/Talmud: discussion and analysis of the Mishnah. 4) Geonim and Rishonim: post-Talmudic schools. 5) Codes such as Mishneh Torah, Arba’ah Turim and Shulchan Arukh. 6) Acharonim and later responsa. Kabbalah is a parallel stream, not shorthand for halakha."],["Inference rule","A statement in the Talmud is not automatically the final ruling; later jurists may decide among multiple positions. Every LuxDot node therefore labels SOURCE / STATUS / DATE / SCHOOL / CONSENSUS."]],"nl":[["Kernlagen","1) Tenach: Hebreeuwse Bijbel. 2) Misjna: vroege codificatie van de Mondelinge Tora. 3) Gemara/Talmoed: bespreking en analyse van de Misjna. 4) Geonim en Rishonim: post-Talmoedische scholen. 5) Codices zoals Mishneh Torah, Arba’ah Turim en Shulchan Arukh. 6) Acharonim en latere responsa. Kabbala is een parallelle stroom, geen afkorting voor halacha."],["Regel voor gevolgtrekkingen","Een uitspraak in de Talmoed is niet automatisch het uiteindelijke
