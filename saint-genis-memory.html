<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="language-core.js?v=4387"></script><link href="styles.css?v=430" rel="stylesheet"><link rel="stylesheet" href="luxdot-ui-lock.css?v=4385"><style>body{background:#020403;color:#edf7ef;margin:0;font-family:Arial,sans-serif}.d{max-width:1100px;margin:auto;padding:34px 22px 90px}.hero,.card{border:1px solid #23402d;border-radius:24px;background:linear-gradient(145deg,#07120b,#020403)}.hero{padding:28px}.tag{font-size:12px;color:#d2b15b;letter-spacing:.08em}.hero h1{font-size:clamp(30px,5vw,60px);margin:.25em 0}.lead{font-size:18px;line-height:1.9;color:#d8e8dd}.heroimg{width:100%;max-height:540px;object-fit:cover;border-radius:18px;margin-top:20px;border:1px solid #2b4934}.credit{font-size:11px;color:#8da497;margin-top:7px}.symbols{display:inline-flex;gap:5px;border:1px solid #31563d;border-radius:999px;padding:7px 12px;margin:8px 0 4px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:22px 0}.card{padding:18px}.card h3,h2{color:#d2b15b}.card p,.timeline p{line-height:1.75}.timeline{border-inline-start:2px solid #31563d;margin:20px 0;padding-inline-start:20px}.timeline article{margin:0 0 18px}.timeline b{color:#d2b15b}.question{border-inline-start:3px solid #d2b15b;padding:16px 20px;background:#09140d;line-height:1.8;border-radius:0 14px 14px 0}.src{display:grid;gap:10px}.src a{display:block;border:1px solid #203a29;border-radius:16px;padding:15px;background:#06100a;text-decoration:none;color:#edf7ef}.src small{display:block;color:#9db1a3;margin-top:5px}.back a{color:#d2b15b;text-decoration:none}.navline{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.navline a{border:1px solid #31563d;border-radius:999px;padding:8px 12px;color:#d8e8dd;text-decoration:none}html[lang=ar] body{font-family:'Noto Kufi Arabic',Arial,sans-serif!important}html[dir=rtl] .question{border-radius:14px 0 0 14px}@media(max-width:650px){.d{padding:20px 14px 70px}.hero{padding:20px}}</style><title>LuxDot Memory</title><link rel="stylesheet" href="luxdot-global-language.css?v=4399"><link rel="stylesheet" href="luxdot-radio.css?v=43105"></head><body><header class="top"><div class="wrap topin"><a class="logo" data-lux-brand href="home.html">LuxDot</a><nav class="nav"><a href="memory.html" data-t="memory"></a><a href="research.html" data-t="research"></a><select class="lang lang-select" data-lang-select></select></nav></div></header><main class="d" id="app"></main><script>const DATA={"ar": {"tag": "LUXDOT · الذاكرة الحية · 20 أغسطس", "title": "20 أغسطس — مجزرة سان جيني لافال", "lead": "في 20 أغسطس 1944، قبل أيام فقط من تحرير سجن مونلوك، أُخرج نحو 120 معتقلاً من السجن في ليون ونُقلوا إلى حصن كوت لوريت في سان جيني لافال حيث قُتلوا. الحدث جزء من موجة الإعدامات التي رافقت الأيام الأخيرة للاحتلال الألماني في المنطقة.", "cards": [["مونلوك", "كان سجن مونلوك مركز اعتقال وقمع في ليون. في أغسطس 1944 تسارعت عمليات إخراج المعتقلين وقتلهم مع اقتراب التحرير."], ["20 أغسطس 1944", "يوثق النصب الوطني لسجن مونلوك إعدام 120 من المعتقلين المقاومين في حصن كوت لوريت في ذلك اليوم."], ["سياق أوسع", "بين 17 و21 أغسطس قُتل أيضاً 109 معتقلين يهود أُخرجوا من مونلوك في مطار برون. تكشف الأحداث نمطاً من العنف في اللحظات الأخيرة للاحتلال."], ["بعد أربعة أيام", "تحرر نحو 950 سجيناً من مونلوك مساء 24 أغسطس، ما يجعل قرب النجاة جزءاً مؤلماً من معنى مجزرة 20 أغسطس."]], "timeline": [["17–21 أغسطس 1944", "إعدامات برون: 109 معتقلين يهود بحسب نصب مونلوك."], ["20 أغسطس 1944", "نقل 120 معتقلاً مقاوماً من مونلوك وقتلهم في حصن كوت لوريت."], ["24 أغسطس 1944", "تحرير نحو 950 سجيناً من مونلوك."], ["3 سبتمبر 1944", "تحرير مدينة ليون."]], "q": "لماذا يزداد خطر الأسرى أحياناً عندما يصبح سقوط سلطة الاحتلال قريباً، وكيف نحفظ أسماء الضحايا وسياقهم بدلاً من اختزالهم في رقم؟", "sections": ["السياق والذاكرة", "خط زمني", "سؤال LuxDot", "المصادر", "العودة إلى الذاكرة"], "credit": "Xavier Caré / Wikimedia Commons / CC BY-SA — نصب شهداء حصن كوت لوريت."}, "en": {"tag": "LUXDOT · LIVING MEMORY · 20 AUGUST", "title": "20 August — the Saint-Genis-Laval massacre", "lead": "On 20 August 1944, only days before Montluc prison was liberated, about 120 detainees were taken from the Lyon prison to Fort Côte-Lorette at Saint-Genis-Laval and killed. The massacre formed part of a wave of executions during the final days of German occupation in the region.", "cards": [["Montluc", "Montluc prison was a major site of detention and repression in Lyon. As liberation approached in August 1944, removals and executions of prisoners accelerated."], ["20 August 1944", "The Montluc National Memorial records the execution of 120 resistance detainees at Fort Côte-Lorette that day."], ["A wider pattern", "Between 17 and 21 August, 109 Jewish detainees removed from Montluc were also killed at Bron airfield, revealing a broader pattern of last-stage repression."], ["Four days later", "Around 950 Montluc prisoners were freed on the evening of 24 August. The nearness of survival is part of what makes the 20 August massacre especially stark."]], "timeline": [["17–21 August 1944", "Bron executions: 109 Jewish detainees, according to the Montluc Memorial."], ["20 August 1944", "120 resistance detainees taken from Montluc and killed at Fort Côte-Lorette."], ["24 August 1944", "Around 950 Montluc prisoners are freed."], ["3 September 1944", "Lyon is liberated."]], "q": "Why can prisoners become more vulnerable as an occupying power nears collapse, and how do we preserve victims as named lives rather than a number?", "sections": ["Context & memory", "Timeline", "LuxDot question", "Sources", "Back to Memory"], "credit": "Xavier Caré / Wikimedia Commons / CC BY-SA — memorial at Fort Côte-Lorette."}, "nl": {"tag": "LUXDOT · LEVEND GEHEUGEN · 20 AUGUSTUS", "title": "20 augustus — het bloedbad van Saint-Genis-Laval", "lead": "Op 20 augustus 1944, slechts enkele dagen vóór de bevrijding van de Montluc-gevangenis, werden ongeveer 120 gevangenen uit Lyon naar Fort Côte-Lorette in Saint-Genis-Laval gebracht en gedood. Het bloedbad maakte deel uit van een golf van executies in de laatste dagen van de Duitse bezetting in de regio.", "cards": [["Montluc", "De Montluc-gevangenis was een belangrijk centrum van opsluiting en repressie in Lyon. Toen de bevrijding naderde, namen de wegvoeringen en executies toe."], ["20 augustus 1944", "Het Nationaal Mémorial van Montluc documenteert de executie van 120 verzetsgevangenen bij Fort Côte-Lorette."], ["Een breder patroon", "Tussen 17 en 21 augustus werden ook 109 Joodse gevangenen uit Montluc op het vliegveld van Bron vermoord."], ["Vier dagen later", "Op de avond van 24 augustus werden ongeveer 950 gevangenen uit Montluc bevrijd. De nabijheid van redding maakt de gebeurtenis extra aangrijpend."]], "timeline": [["17–21 augustus 1944", "Executies in Bron: 109 Joodse gevangenen volgens het Montluc Memorial."], ["20 augustus 1944", "120 verzetsgevangenen uit Montluc worden bij Fort Côte-Lorette gedood."], ["24 augustus 1944", "Ongeveer 950 gevangenen uit Montluc worden bevrijd."], ["3 september 1944", "Lyon wordt bevrijd."]], "q": "Waarom kunnen gevangenen juist kwetsbaarder worden wanneer een bezettingsmacht op instorten staat, en hoe bewaren we slachtoffers als levens met namen in plaats van als getal?", "sections": ["Context & herinnering", "Tijdlijn", "LuxDot-vraag", "Bronnen", "Terug naar Geheugen"], "credit": "Xavier Caré / Wikimedia Commons / CC BY-SA — monument bij Fort Côte-Lorette."}, "jv": {"tag": "LUXDOT · PANGELING URIP · 20 AGUSTUS", "title": "20 Agustus — pembantaian Saint-Genis-Laval", "lead": "Tanggal 20 Agustus 1944, mung sawetara dina sadurunge pakunjaran Montluc dibebasake, kira-kira 120 tahanan digawa saka Lyon menyang Fort Côte-Lorette ing Saint-Genis-Laval lan dipateni. Kedadean iki minangka bagean saka gelombang eksekusi ing dina-dina pungkasan pendhudhukan Jerman.", "cards": [["Montluc", "Pakunjaran Montluc dadi papan penahanan lan represi penting ing Lyon. Nalika pembebasan saya cedhak, pemindahan lan eksekusi tahanan saya akeh."], ["20 Agustus 1944", "Memorial Nasional Montluc nyathet eksekusi 120 tahanan perlawanan ing Fort Côte-Lorette."], ["Pola luwih amba", "Antarane 17–21 Agustus, 109 tahanan Yahudi saka Montluc uga dipateni ing lapangan udara Bron."], ["Patang dina sabanjure", "Kira-kira 950 tahanan Montluc dibebasake tanggal 24 Agustus. Cedhake wektu slamet ndadekake tragedi iki luwih nglarani."]], "timeline": [["17–21 Agustus 1944", "Eksekusi Bron: 109 tahanan Yahudi."], ["20 Agustus 1944", "120 tahanan perlawanan dipateni ing Fort Côte-Lorette."], ["24 Agustus 1944", "Kira-kira 950 tahanan Montluc dibebasake."], ["3 September 1944", "Lyon dibebasake."]], "q": "Napa tahanan bisa luwih rawan nalika kekuwatan pendhudhukan meh ambruk, lan kepiye carane njaga korban minangka urip sing duwe jeneng, dudu mung angka?", "sections": ["Konteks lan pangeling", "Garis wektu", "Pitakon LuxDot", "Sumber", "Bali menyang Pangeling"], "credit": "Xavier Caré / Wikimedia Commons / CC BY-SA — memorial Fort Côte-Lorette."}, "he": {"tag": "LUXDOT · זיכרון חי · 20 באוגוסט", "title": "20 באוגוסט — טבח סן־ז׳ני־לאוואל", "lead": "ב־20 באוגוסט 1944, ימים ספורים לפני שחרור כלא מונלוק, הוצאו כ־120 עצורים מן הכלא בליון והובלו למצודת קוט־לורט בסן־ז׳ני־לאוואל, שם נרצחו. הטבח היה חלק מגל הוצאות להורג בימיה האחרונים של הכיבוש הגרמני באזור.", "cards": [["מונלוק", "כלא מונלוק היה מוקד מרכזי של כליאה ודיכוי בליון. ככל שהתקרב השחרור באוגוסט 1944 גברו הוצאת האסירים וההוצאות להורג."], ["20 באוגוסט 1944", "האתר הלאומי של מונלוק מתעד הוצאה להורג של 120 עצורי מחתרת במצודת קוט־לורט."], ["דפוס רחב יותר", "בין 17 ל־21 באוגוסט נרצחו גם 109 עצורים יהודים שהוצאו ממונלוק בשדה התעופה ברון."], ["ארבעה ימים אחר כך", "בערב 24 באוגוסט שוחררו כ־950 אסירי מונלוק. הקרבה להצלה מוסיפה ממד כואב במיוחד לטבח של 20 באוגוסט."]], "timeline": [["17–21 באוגוסט 1944", "הוצאות להורג בברון: 109 עצורים יהודים לפי אתר מונלוק."], ["20 באוגוסט 1944", "120 עצורי מחתרת נלקחים ממונלוק ונרצחים במצודת קוט־לורט."], ["24 באוגוסט 1944", "כ־950 אסירי מונלוק משתחררים."], ["3 בספטמבר 1944", "ליון משתחררת."]], "q": "מדוע אסירים עלולים להיות בסכנה גדולה יותר דווקא כאשר שלטון כיבוש מתקרב לקריסה, וכיצד נשמר את הקורבנות כחיים בעלי שמות ולא כמספר?", "sections": ["הקשר וזיכרון", "ציר זמן", "שאלת LuxDot", "מקורות", "חזרה לזיכרון"], "credit": "Xavier Caré / Wikimedia Commons / CC BY-SA — אתר ההנצחה במצודת קוט־לורט."}}; const SOURCES=[["Mémorial national de la prison de Montluc — chronology", "https://www.memorial-montluc.fr/ressources/frise-chronologique"], ["Mémorial Montluc — Bron and Saint-Genis-Laval massacres", "https://www.memorial-montluc.fr/ressources/frise-chronologique/massacres-de-bron-et-saint-genis-laval"], ["Wikimedia Commons — Saint-Genis-Laval massacre archive", "https://commons.wikimedia.org/wiki/Category:Saint-Genis-Laval_massacre"]]; const IMG="assets/images/memory/saint-genis-memorial.jpg"; const SYMBOLS="\ud83d\udd6f\ufe0f \u26d3\ufe0f \u2694\ufe0f";
function lang(){let q=new URLSearchParams(location.search).get('lang'),s=localStorage.getItem('luxdot.lang');let l=q||s||'ar';return DATA[l]?l:'en'}
function render(){let l=lang(),x=DATA[l],rtl=(l==='ar'||l==='he');document.documentElement.lang=l;document.documentElement.dir=rtl?'rtl':'ltr';document.title=x.title+' · LuxDot';let cards=x.cards.map(c=>`<article class="card"><h3>${c[0]}</h3><p>${c[1]}</p></article>`).join('');let tl=x.timeline.map(t=>`<article><b>${t[0]}</b><p>${t[1]}</p></article>`).join('');let ss=SOURCES.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener"><b>${s[0]}</b></a>`).join('');document.getElementById('app').innerHTML=`<section class="hero"><span class="tag">${x.tag}</span><h1>${x.title}</h1><div class="symbols" aria-label="SLS memory symbols">${SYMBOLS}</div><p class="lead">${x.lead}</p><img class="heroimg" src="${IMG}" alt=""><div class="credit">${x.credit}</div></section><h2>${x.sections[0]}</h2><section class="grid">${cards}</section><h2>${x.sections[1]}</h2><section class="timeline">${tl}</section><h2>${x.sections[2]}</h2><p class="question">${x.q}</p><h2>${x.sections[3]}</h2><div class="src">${ss}</div><div class="navline"><a href="memory.html?lang=${l}">← ${x.sections[4]}</a></div>`}render();</script><script src="site-shell.js?v=4387"></script><script defer src="luxdot-radio.js?v=43105"></script></body></html>
