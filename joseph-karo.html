<!doctype html><html lang="en" dir="ltr"><head><script src="language-core.js?v=4390"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewish Research · LuxDot</title><link rel="stylesheet" href="styles.css?v=430"><link rel="stylesheet" href="arabic-polish.css?v=430"><link rel="stylesheet" href="platform-v43.css?v=4328"><link rel="stylesheet" href="jewish-research.css?v=4390"><link rel="stylesheet" href="luxdot-ui-lock.css?v=4385"><script defer src="app.js?v=430"></script></head><body data-lux-i18n-complete="1"><header class="top"><div class="wrap topin"><a class="logo" data-lux-brand href="home.html">LuxDot</a><nav class="nav"><a data-t="home" href="home.html"></a><a data-t="research" href="research.html"></a><a data-t="faith" href="faith.html"></a><select class="lang lang-select" data-lang-select><option value="ar">العربية</option><option value="en">English</option><option value="nl">Nederlands</option><option value="jv">Basa Jawa</option><option value="he">עברית</option></select></nav></div></header><main class="jr" id="jr"></main><script>window.JR_PAGE={"slug":"joseph-karo","data":{"ar":{"title":"يوسف كارو · מרן","sub":"الطرد · الدولة العثمانية · صفد · الشولحان عاروخ","lead":"يوسف كارو (1488–1575) يمثل جسراً نموذجياً بين سفاراد بعد 1492 وصفد العثمانية. Beit Yosef موسوعة فقهية على Tur، وShulchan Arukh خلاصة عملية أصبحت مرجعاً محورياً، مع اختلافات أشكنازية دوّنها لاحقاً موسى إيسرلس (Rema)."},"en":{"title":"Joseph Karo · Maran","sub":"expulsion · Ottoman world · Safed · Shulchan Arukh","lead":"Karo (1488–1575) is a bridge between post-1492 Sepharad and Ottoman Safed. Beit Yosef is a vast legal commentary; Shulchan Arukh is its practical digest, later accompanied by the Rema’s Ashkenazic glosses."},"nl":{"title":"Joseph Karo · Maran","sub":"verdrijving · Ottomaanse wereld · Safed","lead":"Joseph Karo (1488–1575) vormt een brug tussen Sefarad na 1492 en Ottomaans Safed. Beit Yosef is een omvangrijk juridisch commentaar; Shulchan Arukh is de praktische samenvatting, later vergezeld door de Asjkenazische glossen van Rema."},"jv":{"title":"Joseph Karo · Maran","sub":"pengusiran · Safed · Shulchan Arukh","lead":"Jembatan Sefarad sawise 1492 menyang Safed lan kodifikasi hukum."},"he":{"title":"רבי יוסף קארו · מרן","sub":"גירוש · העולם העות׳מאני · צפת · שולחן ערוך","lead":"גשר בין ספרד שלאחר הגירוש לצפת; מחבר בית יוסף ושולחן ערוך."}},"img":"assets/jewish-research/joseph-karo.jpg","credit":"Joseph Karo portrait by Meir Kunstadt · public domain","extra":[["ar","لماذا هو مركزي للسفارديم؟","لأن مشروعه أعاد ترتيب كم هائل من الخلافات الفقهية في صورة قابلة للاستخدام. لكنه لا يلغي minhag المحلي، ولا يعني أن كل سفاردي في كل بلد يتبع حكماً واحداً في كل مسألة."],["ar","كارو المتصوف","وجود Maggid Mesharim في تراثه يجعل كارو مثالاً ممتازاً على ضرورة فصل شخصية الفقيه عن تجربته الصوفية: المصدران ينتميان للشخص نفسه لكنهما ليسا من النوع المعرفي نفسه."]],"sources":[["Sefaria · Joseph Karo","https://www.sefaria.org/topics/joseph-karo"],["My Jewish Learning · Shulchan Arukh","https://www.myjewishlearning.com/article/the-shulhan-arukh/"]],"related":[["sephardic-halakha.html","سلسلة الهالاخاه"],["safed-kabbalah-messianism.html","صفد والقبّالاه"],["karo-decision-method.html","منهج الحسم الفقهي"],["jewish-source-ladder.html","سُلّم المصادر"]],"extra_i18n":{"en":[["Why is he central to Sephardic law?","His project reorganized an enormous body of legal disagreement into a form that could be used in practice. It did not erase local minhag, nor does it mean that every Sephardi in every country follows one identical ruling in every matter."],["Karo the mystic","The presence of Maggid Mesharim in his legacy makes Karo a useful example of why the jurist and the mystical experience must be distinguished: both belong to the same person, but they are not the same kind of source."]],"nl":[["Waarom is hij centraal in de Sefardische halacha?","Zijn project ordende een enorme hoeveelheid juridisch meningsverschil in een praktisch bruikbare vorm. Het schafte lokaal minhag niet af en betekent niet dat iedere Sefardische Jood overal in elke kwestie dezelfde uitspraak volgt."],["Karo de mysticus","De aanwezigheid van Maggid Mesharim in zijn nalatenschap maakt Karo tot een goed voorbeeld van waarom jurist en mystieke ervaring uit elkaar moeten worden gehouden: beide horen bij dezelfde persoon, maar zijn niet hetzelfde soort bron."]]},"related_i18n":{"en":["Sephardic Halakha","Safed · Kabbalah · Messianism","Joseph Karo · Legal Decision Method","Jewish Source Ladder"],"nl":["Sefardische halacha","Safed · Kabbala · messianisme","Joseph Karo · methode van rechtsbeslissing","Joodse bronnenladder"]}};</script><script defer src="jewish-research-page.js?v=4390"></script><script src="site-shell.js?v=4385"></script></body></html>
