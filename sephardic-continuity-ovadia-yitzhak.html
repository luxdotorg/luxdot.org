<!doctype html><html lang="en" dir="ltr"><head><script src="language-core.js?v=4391"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewish Research · LuxDot</title><link rel="stylesheet" href="styles.css?v=430"><link rel="stylesheet" href="arabic-polish.css?v=430"><link rel="stylesheet" href="platform-v43.css?v=4328"><link rel="stylesheet" href="jewish-research.css?v=4391"><link rel="stylesheet" href="luxdot-ui-lock.css?v=4385"><script defer src="app.js?v=430"></script></head><body data-lux-i18n-complete="1"><header class="top"><div class="wrap topin"><a class="logo" data-lux-brand href="home.html">LuxDot</a><nav class="nav"><a data-t="home" href="home.html"></a><a data-t="research" href="research.html"></a><a data-t="faith" href="faith.html"></a><select class="lang lang-select" data-lang-select><option value="ar">العربية</option><option value="en">English</option><option value="nl">Nederlands</option><option value="jv">Basa Jawa</option><option value="he">עברית</option></select></nav></div></header><main class="jr" id="jr"></main><script>window.JR_PAGE={"slug":"sephardic-continuity-ovadia-yitzhak","data":{"ar":{"title":"عوفاديا يوسف → يتسحاق يوسف","sub":"استمرارية فقهية حديثة · Maran · Yabia Omer · Yalkut Yosef","lead":"هذه العقدة تدرس العلاقة بين مشروع عوفاديا يوسف الفقهي وموسوعة Yalkut Yosef لابنه يتسحاق: أين توجد الاستمرارية، وأين يجب فحص كل فتوى بنصها وسياقها بدلاً من افتراض التطابق العائلي."},"en":{"title":"Ovadia Yosef → Yitzhak Yosef","sub":"modern Sephardic continuity · Maran · Yabia Omer · Yalkut Yosef","lead":"A node on continuity between Ovadia Yosef’s jurisprudence and Yitzhak Yosef’s Yalkut Yosef, while avoiding the assumption that family continuity means identical rulings in every case."},"nl":{"title":"Ovadia Yosef → Yitzhak Yosef","sub":"moderne Sefardische continuïteit","lead":"Een knoop over continuïteit tussen de jurisprudentie van Ovadia Yosef en Yitzhak Yosefs Yalkut Yosef, zonder aan te nemen dat familiale continuïteit in elke kwestie identieke uitspraken betekent."},"jv":{"title":"Ovadia → Yitzhak Yosef","sub":"kontinuitas hukum Sefardi modern","lead":"Nglacak pengaruh tanpa nganggep kabeh putusan padha."},"he":{"title":"עובדיה יוסף → יצחק יוסף","sub":"רציפות פסיקה ספרדית מודרנית","lead":"בחינת ההמשכיות ההלכתית לצד בדיקה עצמאית של כל פסק."}},"img":"assets/jewish-research/ovadia-yosef.jpg","credit":"Ovadia Yosef · LuxDot local research asset","extra":[["ar","مشروع عوفاديا","يُدرس عبر الفتاوى المطولة، وبخاصة Yabia Omer، ومن خلال مركزية «ماران» يوسف كارو في كثير من أحكامه. الهدف البحثي هو تتبع طريقة وزن المصادر لا مجرد جمع النتائج."],["ar","مشروع يتسحاق","Yalkut Yosef يقدّم نطاقاً واسعاً من الأحكام العملية، ومتأثر بقوة بمدرسة والده. لكن LuxDot يعامل كل حكم كوثيقة مستقلة: موضوع، إصدار، سياق، مصادر، ومعارضون إن وجدوا."],["ar","بروتوكول مراسلة الحاخامات","قبل إرسال سؤال فقهي: 1) تحديد السؤال بدقة؛ 2) ذكر النصوص الأساسية؛ 3) فصل السؤال القانوني عن القبّالاه وعن الادعاءات الشخصية؛ 4) طلب تصحيح المصدر لا طلب المصادقة على نتيجة جاهزة. بهذه الطريقة تصبح إجابات الحاخامات بيانات بحثية قابلة للمقارنة."]],"sources":[["Sefaria · Joseph Karo topic","https://www.sefaria.org/topics/joseph-karo"],["Sefaria · Shulchan Arukh","https://www.sefaria.org/texts/Halakhah/Shulchan%20Arukh"]],"related":[["ovadia-yosef.html","عوفاديا يوسف"],["yitzhak-yosef.html","يتسحاق يوسف"],["karo-decision-method.html","منهج كارو"],["jewish-source-ladder.html","سُلّم المصادر"]],"extra_i18n":{"en":[["Ovadia’s project","It is studied through extended responsa, especially Yabia Omer, and through the centrality of “Maran” Joseph Karo in many rulings. The research goal is to trace how sources are weighed rather than merely collect conclusions."],["Yitzhak’s project","Yalkut Yosef presents a broad range of practical rulings and is strongly shaped by his father’s school. LuxDot nevertheless treats each ruling as its own document: issue, edition, context, sources and dissenting views where present."],["Rabbinic outreach protocol","Before sending a halakhic question: 1) define the question precisely; 2) cite the core texts; 3) separate the legal question from Kabbalah and personal claims; 4) ask for source correction rather than endorsement of a predetermined conclusion. Replies then become comparable research data."]],"nl":[["Het project van Ovadia","Het wordt bestudeerd via uitvoerige responsa, vooral Yabia Omer, en via de centrale plaats van “Maran” Joseph Karo in veel uitspraken. Het onderzoeksdoel is te volgen hoe bronnen worden gewogen, niet alleen conclusies te verzamelen."],["Het project van Yitzhak","Yalkut Yosef biedt een breed scala aan praktische uitspraken en is sterk gevormd door de school van zijn vader. LuxDot behandelt elke uitspraak toch als een afzonderlijk document: onderwerp, editie, context, bronnen en eventuele tegenstemmen."],["Protocol voor contact met rabbijnen","Voor een halachische vraag wordt verstuurd: 1) formuleer de vraag precies; 2) noem de kernteksten; 3) scheid de juridische vraag van Kabbala en persoonlijke claims; 4) vraag om broncorrectie in plaats van bevestiging van een vooraf vaststaande conclusie. Antwoorden worden zo vergelijkbare onderzoeksdata."]]},"related_i18n":{"en":["Ovadia Yosef","Yitzhak Yosef","Joseph Karo · Legal Decision Method","Jewish Source Ladder"],"nl":["Ovadia Yosef","Yitzhak Yosef","Joseph Karo · methode van rechtsbeslissing","Joodse bronnenladder"]}};</script><script defer src="jewish-research-page.js?v=4391"></script><script src="site-shell.js?v=4385"></script></body></html>
