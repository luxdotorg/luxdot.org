karo.jpg","credit":"Joseph Karo · historical portrait · public domain source used in LuxDot","extra":[["ar","الثلاثة الكبار","منهج كارو ارتكز بصورة مشهورة على مقارنة ثلاثة أعمدة فقهية: إسحاق الفاسي (Rif)، موسى بن ميمون (Rambam)، وآشر بن يحيئيل (Rosh)، مع تفاصيل واستثناءات أوسع في بيت يوسف."],["ar","لماذا بيت يوسف أهم للبحث؟","لأن Shulchan Arukh يعرض الحكم بصورة شديدة الاختصار، بينما Beit Yosef يحتفظ بمسار المصادر والخلاف والموازنة. لذلك LuxDot يربط أي حكم مثير للجدل أولاً ببيت يوسف ثم بالنص المختصر."],["ar","السفاردي والأشكنازي","طبعات Shulchan Arukh الشائعة تضم أيضاً تعليقات موسى إسرلس (Rema) التي تسجل أعرافاً وأحكاماً أشكنازية. يجب عدم نسبة تعليق Rema إلى كارو نفسه."]],"sources":[["Sefaria · Beit Yosef","https://www.sefaria.org/Beit_Yosef"],["Sefaria · Shulchan Arukh","https://www.sefaria.org/texts/Halakhah/Shulchan%20Arukh"],["Sefaria · Rosh topic","https://www.sefaria.org/topics/rosh"]],"related":[["joseph-karo.html","يوسف كارو"],["sephardic-halakha.html","سلسلة الهالاخاه"],["jewish-source-ladder.html","سُلّم المصادر"],["ovadia-yosef.html","عوفاديا يوسف"]],"extra_i18n":{"en":[["The three major authorities","Karo’s method famously centered on comparing three major legal authorities: Isaac Alfasi (Rif), Maimonides (Rambam), and Asher ben Jehiel (Rosh), with broader detail and exceptions in Beit Yosef."],["Why Beit Yosef matters more for research","Shulchan Arukh states rulings very concisely, while Beit Yosef preserves the path of sources, disagreement and weighing. LuxDot therefore links a disputed ruling first to Beit Yosef and then to the concise code."],["Sephardic and Ashkenazic layers","Common editions of Shulchan Arukh also include the glosses of Moses Isserles (Rema), which record Ashkenazic customs and rulings. A Rema gloss must not be attributed to Karo himself."]],"nl":[["De drie hoofdautoriteiten","Karo’s methode draaide beroemd om de vergelijking van drie belangrijke juridische autoriteiten: Isaac Alfasi (Rif), Maimonides (Rambam) en Asher ben Jehiel (Rosh), met meer details en uitzonderingen in Beit Yosef."],["Waarom Beit Yosef voor onderzoek belangrijker is","Shulchan Arukh formuleert uitspraken zeer beknopt, terwijl Beit Yosef de weg van bronnen, meningsverschil en afweging bewaart. LuxDot koppelt een betwiste uitspraak daarom eerst aan Beit Yosef en daarna aan de beknopte codex."],["Sefardische en Asjkenazische lagen","Gangbare edities van Shulchan Arukh bevatten ook de glossen van Moses Isserles (Rema), waarin Asjkenazische gebruiken en uitspraken staan. Een gloss van Rema mag niet aan Karo zelf worden toegeschreven."]]},"related_i18n":{"en":["Joseph Karo","Sephardic Halakha","Jewish Source Ladder","Ovadia Yosef"],"nl":["Joseph Karo","Sefardische halacha","Joodse bronnenladder","Ovadia Yosef"]}};</script><script defer src="jewish-research-page.js?v=4391"></script><script src="site-shell.js?v=43115"></script><script src="hebrew-research-overlay.js?v=4399"></script><script defer src="luxdot-radio.js?v=43105"></script><script defer src="content-language-core.js?v=43115"></script><script src="luxdot-typography-density.js?v=41416"></script>
