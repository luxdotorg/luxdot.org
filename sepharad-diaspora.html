<!doctype html><html lang="en" dir="ltr"><head><script src="language-core.js?v=43101"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewish Research · LuxDot</title><link rel="stylesheet" href="styles.css?v=430"><link rel="stylesheet" href="arabic-polish.css?v=430"><link rel="stylesheet" href="platform-v43.css?v=4328"><link rel="stylesheet" href="jewish-research.css?v=4390"><link rel="stylesheet" href="luxdot-ui-lock.css?v=4385"><script defer src="app.js?v=430"></script><link rel="stylesheet" href="luxdot-global-language.css?v=43101"></head><body data-lux-i18n-complete="1"><header class="top"><div class="wrap topin"><a class="logo" data-lux-brand href="home.html">LuxDot</a><nav class="nav"><a data-t="home" href="home.html"></a><a data-t="research" href="research.html"></a><a data-t="faith" href="faith.html"></a><select class="lang lang-select" data-lang-select><option value="ar">العربية</option><option value="en">English</option><option value="nl">Nederlands</option><option value="jv">Basa Jawa</option><option value="he">עברית</option></select></nav></div></header><main class="jr" id="jr"></main><script>window.JR_PAGE={"slug":"sepharad-diaspora","data":{"ar":{"title":"المسار الأول: سفاراد والشتات","sub":"إيبيريا → 1492 → المتوسط → أمستردام","lead":"يتتبع المسار تشكل الهوية السفاردية من شبه الجزيرة الإيبيرية إلى الطرد والتحول القسري والشتات، مع تمييز السفاردي النسَبي عن المزراحي والتقليد السفاردي الأوسع."},"en":{"title":"Track I: Sepharad & Diaspora","sub":"Iberia → 1492 → Mediterranean → Amsterdam","lead":"Traces Sephardic identity from Iberia through expulsion, forced conversion and diaspora, distinguishing genealogical Sephardim from broader Sephardic/Mizrahi religious traditions."},"nl":{"title":"Spoor I: Sefarad & diaspora","sub":"Iberië → 1492 → Middellandse Zee → Amsterdam","lead":"Volgt de Sefardische geschiedenis van Iberië via verdrijving en gedwongen bekering naar de diaspora, met onderscheid tussen afkomst en religieuze traditie."},"jv":{"title":"Jalur I: Sefarad lan diaspora","sub":"Iberia → 1492 → Mediterania → Amsterdam","lead":"Nglacak identitas Sefardi saka Iberia menyang pengusiran lan diaspora."},"he":{"title":"מסלול א: ספרד והתפוצה","sub":"איבריה → 1492 → הים התיכון → אמסטרדם","lead":"מעקב אחר הזהות הספרדית מאיבריה דרך הגירוש והאנוסים אל התפוצה, תוך הבחנה בין מוצא למסורת הלכתית."}},"img":"assets/jewish-research/joseph-karo.jpg","credit":"Joseph Karo portrait by Meir Kunstadt · public domain","extra":[["ar","تمييز المصطلحات","Sephardi بالمعنى النسَبي = جذور إيبيرية؛ Sephardic بالمعنى الطقسي/الفقهي قد يشمل جماعات شرقية أوسع؛ Mizrahi = يهود الشرق الأوسط وشمال أفريقيا بخصوصيات متعددة. لا ندمجها آلياً."],["ar","هولندا داخل المسار","أمستردام ليست هامشاً: الجماعة البرتغالية اليهودية والـEsnoga ومكتبة Ets Haim تجعل هولندا عقدة رئيسية في تاريخ السفارديم الغربيين."]],"sources":[["Jewish Cultural Quarter · Portuguese Synagogue","https://jck.nl/en/location/portuguese-synagogue"]],"related":[["joseph-karo.html","يوسف كارو"],["safed-kabbalah-messianism.html","صفد والقبّالاه"]],"extra_i18n":{"en":[["Distinguishing the terms","Sephardi in a genealogical sense means Iberian roots; Sephardic in a liturgical or legal sense can cover a wider group of Eastern communities; Mizrahi refers to Middle Eastern and North African Jewish communities with diverse histories. These categories must not be collapsed automatically."],["The Netherlands in this route","Amsterdam is not peripheral: the Portuguese Jewish community, the Esnoga and the Ets Haim library make the Netherlands a major node in the history of Western Sephardim."]],"nl":[["De termen onderscheiden","Sephardi in genealogische zin betekent Iberische wortels; Sefardisch in liturgische of juridische zin kan een bredere groep oosterse gemeenschappen omvatten; Mizrahi verwijst naar Joodse gemeenschappen uit het Midden-Oosten en Noord-Afrika met uiteenlopende geschiedenissen. Deze categorieën mogen niet automatisch worden samengevoegd."],["Nederland in dit spoor","Amsterdam is niet perifeer: de Portugees-Joodse gemeenschap, de Esnoga en de Ets Haim-bibliotheek maken Nederland tot een belangrijk knooppunt in de geschiedenis van de West-Sefardim."]],"he":[["הבחנה בין מונחים","ספרדי במובן הגנאלוגי מציין שורשים איבריים; ספרדי במובן הליטורגי או ההלכתי עשוי לכלול קהילות מזרחיות רחבות יותר; מזרחי מציין קהילות יהודי המזרח התיכון וצפון אפריקה על גווניהן. אין למזג את הקטגוריות אוטומטית."],["הולנד בתוך המסלול","אמסטרדם אינה שולית: הקהילה הפורטוגזית, בית הכנסת הפורטוגזי וספריית עץ חיים הופכים את הולנד לצומת מרכזי בתולדות הספרדים המערביים."]]},"related_i18n":{"en":["Joseph Karo","Safed · Kabbalah · Messianism"],"nl":["Joseph Karo","Safed · Kabbala · messianisme"],"he":["רבי יוסף קארו","צפת · קבלה · משיח"]}};</script><script defer src="jewish-research-page.js?v=4390"></script><script src="site-shell.js?v=4385"></script><script src="hebrew-research-overlay.js?v=4399"></script></body></html>
