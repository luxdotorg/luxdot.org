name: Phase B Direct Core Migration

on:
  push:
    branches:
      - 'luxdot/phase-b-direct-core'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: luxdot/phase-b-direct-core
          fetch-depth: 0
      - name: Update direct core bridge references
        shell: bash
        run: |
          set -euo pipefail
          for f in home.html research.html projects.html memory.html; do
            sed -i 's#/luxdot-shell-bridge.js?v=41850#/luxdot-shell-bridge.js?v=41851#g' "$f"
          done
          python - <<'PY'
          from pathlib import Path
          files=['home.html','research.html','projects.html','memory.html']
          for f in files:
              t=Path(f).read_text(encoding='utf-8')
              needle='/luxdot-shell-bridge.js?v=41851'
              if needle not in t:
                  raise SystemExit(f'{f}: missing 4.18.51 bridge reference')
          print('Direct core bridge references updated.')
          PY
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home.html research.html projects.html memory.html
          git commit -m 'phase B: switch core pages to direct bridge mode'
          git push origin HEAD:luxdot/phase-b-direct-core
