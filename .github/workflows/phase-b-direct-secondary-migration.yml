name: Phase B Direct Secondary Migration

on:
  push:
    branches:
      - 'luxdot/phase-b-direct-secondary'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: luxdot/phase-b-direct-secondary
          fetch-depth: 0
      - name: Update secondary direct bridge references
        shell: bash
        run: |
          set -euo pipefail
          for f in library.html faith.html humanity.html media.html audiovisual.html praxis.html; do
            sed -i 's#/luxdot-shell-bridge.js?v=41850#/luxdot-shell-bridge.js?v=41852#g' "$f"
          done
          python - <<'PY'
          from pathlib import Path
          files=['library.html','faith.html','humanity.html','media.html','audiovisual.html','praxis.html']
          needle='/luxdot-shell-bridge.js?v=41852'
          for f in files:
              t=Path(f).read_text(encoding='utf-8')
              if needle not in t:
                  raise SystemExit(f'{f}: missing 4.18.52 bridge reference')
          print('Secondary direct bridge references updated.')
          PY
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library.html faith.html humanity.html media.html audiovisual.html praxis.html
          git commit -m 'phase B: switch secondary core pages to direct mode'
          git push origin HEAD:luxdot/phase-b-direct-secondary
