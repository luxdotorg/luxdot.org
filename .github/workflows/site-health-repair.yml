name: LuxDot One-Shot Site Health Repair

on:
  push:
    branches:
      - luxdot/site-health-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: luxdot/site-health-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair conservative static-site health issues
        run: python tools/repair_site_health.py
      - name: Verify no errors or warnings remain
        run: python tools/site_health.py --fail-on warning | tee site-health-after-repair.txt
      - name: Commit repaired HTML and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/site-health-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git commit -m "fix: repair static site health baseline"
          git push origin HEAD:luxdot/site-health-foundation
