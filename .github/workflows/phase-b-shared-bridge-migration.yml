name: Phase B Shared Bridge Migration

on:
  push:
    branches:
      - 'luxdot/phase-b-shared-shell-bridge'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: luxdot/phase-b-shared-shell-bridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace duplicated inline shell bridges
        run: python tools/migrate_shell_bridge.py --write
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'research/*.html' 2>/dev/null || true
          git add -u
          git commit -m 'refactor: centralize shell bridge across pages'
          git push origin HEAD:luxdot/phase-b-shared-shell-bridge
