name: LuxDot QA

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'luxdot/**'

permissions:
  contents: read

concurrency:
  group: luxdot-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -s VERSION; test -s index.html; test -s GOVERNANCE.md; test -s CONTRIBUTING.md
          python - <<'PY'
          from pathlib import Path
          import re,sys
          version=Path('VERSION').read_text().strip(); errors=[]
          if not re.fullmatch(r'\d+\.\d+\.\d+',version): errors.append('invalid VERSION '+repr(version))
          pats=[re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),re.compile(r'ghp_[A-Za-z0-9]{30,}'),re.compile(r'github_pat_[A-Za-z0-9_]{30,}')]
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts: continue
            try: data=p.read_text(encoding='utf-8')
            except: continue
            if any(x.search(data) for x in pats): errors.append(str(p)+': credential-like content')
          if errors: print('\n'.join(errors));sys.exit(1)
          print('Repository guardrails passed.')
          PY
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
      - name: Basic HTML sanity
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          for p in Path('.').rglob('*.html'): HTMLParser().feed(p.read_text(encoding='utf-8'))
          print('HTML parser sanity passed.')
          PY
      - name: Shared shell bridge contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,sys
          old="location.replace('/player-shell.html?page='"; rx=re.compile(r'/luxdot-shell-bridge\.js\?v=\d+'); offenders=[];users=[]
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts or p.name=='player-shell.html': continue
            t=p.read_text(encoding='utf-8')
            if old in t: offenders.append(str(p))
            if rx.search(t): users.append(str(p))
          if offenders or len(users)<500 or not Path('luxdot-shell-bridge.js').is_file(): print(offenders,len(users));sys.exit(1)
          print(f'Shared shell bridge contract passed: {len(users)} pages.')
          PY
      - name: Direct native page contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          direct=['home.html','research.html','projects.html','memory.html','library.html','faith.html','humanity.html','media.html','audiovisual.html','praxis.html']; bridge=Path('luxdot-shell-bridge.js').read_text();shell=Path('player-shell.html').read_text();e=[]
          for n in direct:
            if not Path(n).is_file() or f"'/{n}'" not in bridge or f"'{n}'" not in shell:e.append(n)
          if e: print(e);sys.exit(1)
          print('Direct native contract passed.')
          PY
      - name: Site health audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/site_health.py --fail-on warning | tee site-health-report.txt
      - name: Arabic surface translation audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/arabic_surface_audit.py | tee arabic-surface-report.txt
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxdot-qa-reports
          path: |
            site-health-report.txt
            arabic-surface-report.txt
          if-no-files-found: ignore
