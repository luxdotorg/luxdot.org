name: LuxDot QA

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'luxdot/**'

permissions:
  contents: read

concurrency:
  group: luxdot-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repository guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -s VERSION
          test -s index.html
          test -s GOVERNANCE.md
          test -s CONTRIBUTING.md

          python - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path('.')
          errors = []

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              errors.append(f'VERSION must use X.Y.Z, got: {version!r}')

          # Conservative scan for common private-secret forms.
          # Publishable/anonymous browser keys are intentionally not flagged.
          secret_patterns = [
              (re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'), 'private key'),
              (re.compile(r'ghp_[A-Za-z0-9]{30,}'), 'GitHub personal access token'),
              (re.compile(r'github_pat_[A-Za-z0-9_]{30,}'), 'GitHub fine-grained token'),
              (re.compile(r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'), 'JWT-like credential'),
          ]

          text_ext = {'.html','.css','.js','.json','.md','.txt','.yml','.yaml','.py','.xml','.svg'}
          skip = {'.git'}
          for p in root.rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts):
                  continue
              if p.suffix.lower() not in text_ext and p.name not in {'VERSION','CNAME'}:
                  continue
              try:
                  data = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for pattern, label in secret_patterns:
                  if pattern.search(data):
                      errors.append(f'{p}: detected {label}')

          if errors:
              print('\n'.join('ERROR: '+e for e in errors))
              sys.exit(1)
          print('Repository guardrails passed.')
          PY

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          echo 'JavaScript syntax passed.'

      - name: Basic HTML sanity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          class Parser(HTMLParser):
              pass

          bad=[]
          for p in Path('.').rglob('*.html'):
              try:
                  Parser().feed(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append(f'{p}: {e}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('HTML parser sanity passed.')
          PY
