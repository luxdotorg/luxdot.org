const EN=`<section class="hero"><div class="eyebrow">LUXDOT · STAND FOR</div><h1>What does LuxDot stand for?</h1><p class="lead"><b>Lux</b> is light. <b>Dot</b> is a point. LuxDot is a <b>point of light</b>: a place where a fragment of history, a memory, a text, a place, a symbol, a testimony or a question can become visible — and connect to other points without pretending that connection itself is proof.</p><div class="wordmark"><span class="word"><b>LUX</b> · light / illumination</span><span class="word"><b>DOT</b> · point / node</span><span class="word"><b>LUXDOT</b> · a point of light in a larger map</span></div></section><section class="manifest"><div class="quote">“A map of questions, not a machine of certainty.”</div><p>LuxDot exists to help people <b>see, compare, remember, question and verify</b>. It asks what the source is, what contradicts it, what alternative explanation exists, and what could make us change our mind.</p></section><section class="section"><h2>What does it do?</h2><div class="grid"><div class="card"><b>CONNECT</b><p>Places historical, religious, scientific, cultural, geographical and symbolic material in one navigable knowledge network.</p></div><div class="card"><b>REMEMBER</b><p>Builds living memory around people, testimony and events.</p></div><div class="card"><b>INVESTIGATE</b><p>Turns coincidences, legends, archival traces and difficult questions into research hypotheses rather than automatic conclusions.</p></div><div class="card"><b>COMPARE</b><p>Keeps competing narratives, counter-evidence and alternative explanations visible.</p></div></div></section>`;
const AR=`<section class="hero"><div class="eyebrow">LUXDOT · ماذا نمثّل؟</div><h1>ما هو LuxDot؟ وماذا يمثّل؟</h1><p class="lead"><b>Lux</b> تعني النور، و<b>Dot</b> تعني النقطة. لذلك LuxDot هو <b>نقطة نور</b>: مساحة يمكن فيها لجزء من التاريخ، أو ذكرى، أو نص، أو مكان، أو رمز، أو شهادة، أو سؤال أن يصبح مرئياً، وأن يرتبط بنقاط أخرى من دون الادعاء بأن مجرد وجود الرابط يُعد دليلاً.</p><div class="wordmark"><span class="word"><b>LUX</b> · نور / إضاءة</span><span class="word"><b>DOT</b> · نقطة / عقدة</span><span class="word"><b>LUXDOT</b> · نقطة نور ضمن خريطة أكبر</span></div></section>
<section class="manifest"><div class="quote">«خريطة للأسئلة، وليست آلة لإنتاج اليقين.»</div><p>وُجد LuxDot ليساعد الإنسان على <b>الرؤية والمقارنة والتذكّر والتساؤل والتحقق</b>. لا يطلب من القارئ قبول نتيجة لأنها جميلة أو مقدسة أو غريبة أو قائمة على مصادفة؛ بل يسأل: ما المصدر؟ ما الذي يناقض الادعاء؟ ما التفسير البديل؟ وما الدليل الذي يمكن أن يجعلنا نغيّر رأينا؟</p></section>
<section class="section"><h2>ماذا يفعل LuxDot؟</h2><div class="grid"><div class="card"><b>الربط</b><p>يضع المواد التاريخية والدينية والعلمية والثقافية والجغرافية والرمزية ضمن شبكة معرفة واحدة قابلة للاستكشاف.</p></div><div class="card"><b>التذكّر</b><p>يبني ذاكرة حيّة حول الأشخاص والشهادات والأحداث حتى لا تختزل الأسماء والتجارب إلى أرقام وإحصاءات.</p></div><div class="card"><b>البحث</b><p>يحوّل المصادفات والأساطير والآثار الأرشيفية والأسئلة الصعبة إلى فرضيات قابلة للبحث، لا إلى استنتاجات تلقائية.</p></div><div class="card"><b>المقارنة</b><p>يبقي الروايات المتنافسة والأدلة المضادة والتفسيرات البديلة ظاهرة بدلاً من إخفاء المواد غير المريحة.</p></div><div class="card"><b>حفظ السياق</b><p>يربط النصوص بزمنها ومكانها ومؤلفيها وتقاليدها وتفسيراتها اللاحقة، خصوصاً عندما يختلف الاعتقاد التاريخي عن فهم المجتمعات الحيّة اليوم.</p></div><div class="card"><b>البقاء حيّاً</b><p>يمكن للبحث أن ينمو ويُصحح ويُعارض أو يُدحض. التقرير المطبوع لقطة مؤرخة، أما عقدة المعرفة فتبقى حيّة.</p></div></div></section>
<section class="section"><h2>كيف يفكّر LuxDot؟</h2><div class="flow"><span class="pill">الإنسان</span><span>←</span><span class="pill">السؤال</span><span>←</span><span class="pill">المصدر</span><span>←</span><span class="pill">الادعاء</span><span>←</span><span class="pill">الدليل</span><span>←</span><span class="pill">الدليل المضاد</span><span>←</span><span class="pill">التفسير البديل</span><span>←</span><span class="pill">قابلية التفنيد</span><span>←</span><span class="pill">المراجعة</span></div><p class="small">معيار LuxDot للبحث ما يزال حالياً نموذجاً نظرياً تجريبياً. بنيته موجودة، لكنه لا يمنح تلقائياً درجات أو شهادات ولا يغيّر الأبحاث القائمة آلياً.</p></section>
<section class="section"><h2>ما الذي لا يمثّله LuxDot؟</h2><div class="grid"><div class="card"><b>ليس موسوعة</b><p>هدفه ليس مجرد تلخيص المعرفة المستقرة، بل رسم الأسئلة والعلاقات المحيطة بها.</p></div><div class="card"><b>ليس منظومة اعتقاد</b><p>يمكن دراسة التقاليد الدينية والفلسفية داخله من دون أن يطالب LuxDot باعتناق أي منها.</p></div><div class="card"><b>النمط ليس دليلاً بذاته</b><p>تشابه اسم أو رقم أو رمز أو نبوءة أو جغرافيا قد يفتح باب التحقيق، لكنه لا يستطيع وحده إغلاقه بنتيجة نهائية.</p></div><div class="card"><b>ليس مشروعاً منتهياً</b><p>إظهار عدم اليقين والتصحيحات جزء من التصميم، وليس عيباً يجب إخفاؤه.</p></div></div></section>
<section class="section"><h2>من نقطة إلى كوكبة</h2><p>قد تكون النقطة الواحدة وثيقة. وقد تكون الأخرى قبراً، أو فيلماً، أو اسم عائلة، أو نصاً قديماً، أو شهادة ناجٍ، أو موقعاً أثرياً، أو حدثاً معاصراً. يسمح LuxDot لهذه النقاط بأن تتجاور، ثم يسأل إن كانت الخطوط بينها <b>موثقة، أو مرجحة، أو افتراضية، أو رمزية، أو ما تزال مجهولة</b>.</p><p>ولهذا تستطيع مشاريع مختلفة مثل الذاكرة الحيّة، وبحوث النصوص الدينية، والتاريخ المحلي، وReiderland، وأطلس المخلّص، والتحقيقات الأرشيفية أن تعيش داخل النظام نفسه من دون معاملتها على أنها النوع نفسه من الأدلة.</p></section>
<section class="manifest"><div class="quote">كل نقطة قد تحمل قصة.<br>وكل رابط يبقى فرضية حتى يقول الدليل غير ذلك.</div></section>

<section class="card"><h2>المعرفة القابلة للتفنيد والمفتوحة</h2><p>كل ادعاء في LuxDot يجب أن يظل قابلاً للاعتراض والتصحيح. نشجع القارئ على الشك المنهجي وعلى تقديم الدليل الذي يضعف استنتاجاتنا قبل الدليل الذي يؤكدها.</p><p>ونتعامل مع المعرفة بوصفها تراكماً إنسانياً مشتركاً، مع احترام المصادر وحقوق وتراخيص المواد الخارجية.</p><p><a href="corrections.html?lang=ar">بوابة التصحيح والتفنيد ↗</a> · <a href="open-knowledge-covenant.html?lang=ar">ميثاق المعرفة المفتوحة ↗</a></p></section>`;
