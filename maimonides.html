<!doctype html><html lang="en" dir="ltr"><head><script src="language-core.js?v=43110"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewish Research · LuxDot</title><link rel="stylesheet" href="styles.css?v=430"><link rel="stylesheet" href="arabic-polish.css?v=430"><link rel="stylesheet" href="platform-v43.css?v=4328"><link rel="stylesheet" href="jewish-research.css?v=4392"><link rel="stylesheet" href="luxdot-ui-lock.css?v=4385"><script defer src="app.js?v=430"></script><link rel="stylesheet" href="luxdot-global-language.css?v=4399"><link rel="stylesheet" href="luxdot-radio.css?v=43105"></head><body data-lux-i18n-complete="1"><header class="top"><div class="wrap topin"><a class="logo" data-lux-brand href="home.html">LuxDot</a><nav class="nav"><a data-t="home" href="home.html"></a><a data-t="research" href="research.html"></a><a data-t="faith" href="faith.html"></a><select class="lang lang-select" data-lang-select><option value="ar">العربية</option><option value="en">English</option><option value="nl">Nederlands</option><option value="jv">Basa Jawa</option><option value="he">עברית</option></select></nav></div></header><main class="jr" id="jr"></main><script>window.JR_PAGE={"slug":"maimonides","data":{"ar":{"title":"موسى بن ميمون · הרמב״ם","sub":"قرطبة · الفقه · الفلسفة · المشيح","lead":"عقدة مرجعية مركزية: موسى بن ميمون (1138–1204) جمع بين الفقه والفلسفة والطب. Mishneh Torah مشروع تقنين شامل، وGuide of the Perplexed عمل فلسفي مختلف الوظيفة. في موضوع المشيح يجب قراءة Hilkhot Melakhim مباشرة، وفي البقرة الحمراء يجب فصل النص الفقهي عن التوسع التفسيري اللاحق."},"en":{"title":"Maimonides · Rambam","sub":"Cordoba · law · philosophy · Messiah","lead":"A central reference node. Maimonides (1138–1204) combined law, philosophy and medicine. Mishneh Torah is a comprehensive legal code; Guide of the Perplexed is a distinct philosophical work. Messiah claims should be checked against Hilkhot Melakhim directly."},"nl":{"title":"Maimonides · Rambam","sub":"Córdoba · recht · filosofie · Messias","lead":"Een centrale referentieknoop. Maimonides (1138–1204) verenigde recht, filosofie en geneeskunde. Mishneh Torah is een omvattende juridische codificatie; Guide of the Perplexed is een afzonderlijk filosofisch werk. Claims over de Messias moeten rechtstreeks aan Hilkhot Melakhim worden getoetst."},"jv":{"title":"Maimonides · Rambam","sub":"Cordoba · hukum · filsafat · Mesias","lead":"Simpul utama kanggo Mishneh Torah, filsafat lan ajaran Mesias."},"he":{"title":"הרמב״ם · משה בן מימון","sub":"קורדובה · הלכה · פילוסופיה · משיח","lead":"צומת יסוד: משנה תורה כקוד הלכתי, מורה נבוכים כחיבור פילוסופי, והלכות מלכים כמקור מרכזי לדיון במשיח."}},"img":"assets/jewish-research/maimonides.jpg","credit":"Maimonides relief · Architect of the Capitol · public domain","extra":[["ar","الأعمال التي يجب فصلها","Mishneh Torah للتقنين الفقهي؛ Guide of the Perplexed للفلسفة؛ Commentary on the Mishnah يضم صياغته الشهيرة لأصول الإيمان. الخلط بين وظائف هذه الكتب يخلق استنتاجات خاطئة."],["ar","المشيح والبقرة الحمراء","ربط ابن ميمون البقرة العاشرة بالمشيح في نهاية قوانين البقرة الحمراء معروف في التقليد اللاحق؛ عقدة LuxDot الموجودة للبقرة الحمراء يجب أن تعود إلى النص نفسه وأن تميّز الدعاء/التقليد عن أي ادعاء تاريخي عن ذبح فعلي."]],"sources":[["Stanford Encyclopedia of Philosophy · Maimonides","https://plato.stanford.edu/entries/maimonides/"],["Chabad · Red Heifer and Maimonides tradition","https://www.chabad.org/library/article_cdo/aid/3613245/jewish/For-Real-How-Rare-Is-a-Red-Heifer.htm"]],"related":[["sephardic-halakha.html","سلسلة الهالاخاه"],["red-heifer.html","البقرة الحمراء"],["savior-atlas.html","أطلس المخلّص"],["maimonides-messiah-test.html","اختبار المشيح عند ابن ميمون"],["jewish-source-ladder.html","سُلّم المصادر"],["maimonides-letters-numbers.html","الحروف والأرقام عند ابن ميمون"],["abulafia-letters-names.html","أبو العافية · قبّالاه الأسماء"],["abraham-maimonides-sufi-bridge.html","أبراهام بن ميمون · الجسر الصوفي"]],"extra_i18n":{"en":[["Works that must remain distinct","Mishneh Torah is a work of legal codification; Guide of the Perplexed is philosophical; Commentary on the Mishnah contains his famous formulation of the principles of faith. Mixing the functions of these works produces false conclusions."],["Messiah and the Red Heifer","Maimonides’ association of a tenth red heifer with the Messiah at the end of the laws of the red heifer is well known in later tradition. LuxDot must return to the text itself and distinguish prayer or tradition from any historical claim that an actual slaughter occurred."]],"nl":[["Werken die uit elkaar moeten blijven","Mishneh Torah is een juridische codificatie; Guide of the Perplexed is filosofisch; Commentary on the Mishnah bevat zijn bekende formulering van de geloofsbeginselen. Het vermengen van deze functies leidt tot verkeerde conclusies."],["Messias en de rode koe","De koppeling die Maimonides aan het einde van de wetten over de rode koe maakt tussen een tiende rode koe en de Messias is bekend in de latere traditie. LuxDot moet teruggaan naar de tekst zelf en gebed of traditie onderscheiden van een historische bewering dat er werkelijk een slachting heeft plaatsgevonden."]]},"related_i18n":{"en":["Sephardic Halakha","Red Heifer","Savior Atlas","Maimonides’ Messiah Test","Jewish Source Ladder","Maimonides · Letters & Numbers","Abraham Abulafia · Letters & Divine Names","Abraham Maimonides · Jewish–Sufi Bridge"],"nl":["Sefardische halacha","Rode koe","Verlossersatlas","Messiastoets van Maimonides","Joodse bronnenladder","Maimonides · letters & getallen","Abraham Abulafia · letters & godsnamen","Abraham Maimonides · Joods-soefistische brug"]}};</script><script defer src="jewish-research-page.js?v=4392"></script><script src="site-shell.js?v=43109"></script><script src="hebrew-research-overlay.js?v=4399"></script><script defer src="luxdot-radio.js?v=43105"></script></body></html>
